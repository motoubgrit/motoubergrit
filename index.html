<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto UBGrit - La Grita</title>
    
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        grita: {
                            red: '#dc2626',
                            darkred: '#b91c1c',
                            black: '#000000',
                            dark: '#111111',
                            gray: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></link>

    <!-- Tone.js for Sound Notifications -->

    <!-- Leaflet JS -->

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; overflow-x: hidden; }
        .map-container { height: 100%; width: 100%; z-index: 10; }

        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 10px; }

</head>
<body class="bg-[#0b0f19] text-gray-900 min-h-screen w-screen m-0 p-0 flex flex-col items-center justify-center">
    <div id="root" class="w-full h-screen md:max-w-md md:h-[90vh] md:max-h-[850px] md:rounded-[2.5xl] md:border-8 md:border-zinc-800 bg-black shadow-2xl overflow-hidden flex flex-col relative"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ADMIN_PHONE = "584140792843";
        const ADMIN_EMAIL = "motoubgrit@gmail.com";
        const ADMIN_PASS = "Universal11!!";
        const LA_GRITA_COORDS = [8.1333, -71.9833];
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCxtrFExgrWMSZfbIcx_KGwa2ZLpbepaTzTjdwPxI5qpe62z29-bUy3X-UFylc_ZoGCw/exec";
        const DRIVER_WHATSAPP_GROUP = "https://chat.whatsapp.com/D2ttUD6ykSeBdJBEmIikNx?s=cl&p=a&mlu=4&ilr=4";
        const APP_URL = "https://motoubgrit.netlify.app/";

        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c * 1.35; // Factor vial urbano aproximado
        };

        const calculateFares = (distKm) => {
            let copPrice = 5000; // Base para casco central
            if (distKm > 1.5) {
                copPrice = Math.round(5000 + (distKm - 1.5) * 2500);
            }
            let usdPrice = (copPrice / 3100).toFixed(2); // $1 USD = 3,100 COP
            let vesPrice = (copPrice / 3.2).toFixed(2);
            let adminCommission = Math.round(copPrice * 0.12); // 12% ganancia admin
            return { cop: copPrice, usd: usdPrice, ves: vesPrice, admin: adminCommission };
        };

        const AlertBox = ({ msg, type = 'error', onClose }) => (
            <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl z-[300] text-white font-bold flex items-center gap-3 ${type === 'error' ? 'bg-red-600' : 'bg-green-600'} animate-bounce`}>
                <i className={type === 'error' ? "fa-solid fa-circle-exclamation text-lg" : "fa-solid fa-circle-check text-lg"}></i>
                <span>{msg}</span>
                <button onClick={onClose} className="text-white hover:text-gray-200 ml-2">✕</button>
            </div>
        );

        const PostOrderModal = ({ onExit, onNewOrder }) => (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[250] p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl animate-fade-in">
                    <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-green-200 shadow-inner">
                        <i className="fa-solid fa-check text-4xl"></i>
                    </div>
                    <h3 className="text-2xl font-black text-gray-800 mb-2">¡Pedido Enviado!</h3>
                    <p className="text-gray-600 text-sm mb-6 font-medium">
                        Tu solicitud ha sido enviada con éxito. ¿Qué deseas hacer ahora?
                    </p>
                    <div className="space-y-3">
                        <button 
                            onClick={onNewOrder} 
                            className="w-full bg-grita-red text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-grita-darkred transition flex items-center justify-center gap-2 text-base">
                            <i className="fa-solid fa-rotate-right"></i> Hacer otro pedido
                        </button>
                        <button 
                            onClick={onExit} 
                            className="w-full bg-gray-100 text-gray-800 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition border border-gray-300 flex items-center justify-center gap-2 text-base">
                            <i className="fa-solid fa-arrow-right-from-bracket"></i> Salir de la aplicación
                        </button>
                    </div>
                </div>
            </div>
        );

        const ShortcutModal = ({ onClose }) => {
            const downloadShortcut = () => {
                const shortcutContent = `[InternetShortcut]\nURL=${APP_URL}\nIconIndex=0\nIconFile=${APP_URL}`;
                const blob = new Blob([shortcutContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Moto UBGrit.url';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[200] p-4">
                    <div className="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
                        <div className="w-24 h-24 bg-grita-red rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_0_20px_rgba(220,38,38,0.5)] border-4 border-white">
                            <i className="fa-solid fa-motorcycle text-5xl text-white"></i>
                        </div>
                        <h3 className="text-xl font-bold mb-2">¡Instala Moto UBGrit!</h3>
                        <p className="text-gray-600 text-sm mb-6">
                            Descarga el acceso directo con el logo oficial en tu dispositivo para ingresar rápido y seguro.
                        </p>
                        <div className="space-y-3">
                            <button onClick={downloadShortcut} className="w-full bg-grita-red text-white font-bold py-3.5 rounded-xl shadow hover:bg-grita-darkred transition flex items-center justify-center gap-2">
                                <i className="fa-solid fa-download"></i> Descargar Acceso Directo
                            </button>
                            <button onClick={onClose} className="w-full bg-gray-200 text-gray-800 font-bold py-3 rounded-xl hover:bg-gray-300 transition">
                                Continuar a la App
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('landing'); 
            const [user, setUser] = useState(null);
            const [alert, setAlert] = useState(null);
            const [showShortcutModal, setShowShortcutModal] = useState(false);
            const [showPostOrderModal, setShowPostOrderModal] = useState(false);
            
            const [usersDB, setUsersDB] = useState([
                { id: 'admin', role: 'admin', email: ADMIN_EMAIL, password: ADMIN_PASS, name: 'Administrador UBGrit' },
                { id: 'd1', role: 'driver', email: 'chofer1@test.com', password: '123', name: 'Carlos Perez', vehicle: 'Bera SBR', plate: 'AB123C', isOnline: true, coords: [8.1350, -71.9800] },
                { id: 's1', role: 'store', email: 'tienda1@test.com', password: '123', name: 'Pedro Gomez', storeName: 'Bodega La Grita', address: 'Calle 2 con Carrera 4', phone: '04141234567', coords: [8.1330, -71.9820] }
            ]);
            const [storesDB, setStoresDB] = useState([
                { id: 's1', role: 'store', email: 'tienda1@test.com', name: 'Pedro Gomez', storeName: 'Bodega La Grita', address: 'Calle 2 con Carrera 4', phone: '04141234567', coords: [8.1330, -71.9820] }
            ]);

            const showAlert = (msg, type = 'error') => {
                setAlert({ msg, type });
                setTimeout(() => setAlert(null), 4000);
            };

            const playAlertSound = () => {
                try {
                    const synth = new Tone.Synth().toDestination();
                    synth.triggerAttackRelease("C5", "8n");
                    setTimeout(() => synth.triggerAttackRelease("E5", "8n"), 200);
                    setTimeout(() => synth.triggerAttackRelease("G5", "4n"), 400);
                } catch (e) { console.log("Audio not allowed yet"); }
            };

            const handleLogin = (email, pass) => {
                if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                    setUser({ id: 'admin', role: 'admin', name: 'Administrador UBGrit' });
                    setView('adminDash');
                    return;
                }
                const found = usersDB.find(u => u.email === email && u.password === pass);
                if (found) {
                    setUser(found);
                    if (found.role === 'driver') setView('driverDash');
                    else if (found.role === 'store') setView('storeDash');
                    else setView('clientDash');
                    showAlert("¡Bienvenido de vuelta!", "success");
                } else {
                    showAlert("Correo o contraseña incorrectos.");
                }
            };

            const handleRegister = (role, data) => {
                const newUser = { ...data, id: Date.now().toString(), role, isOnline: true, coords: data.coords || LA_GRITA_COORDS };
                setUsersDB(prev => [...prev, newUser]);
                if (role === 'store') {
                    setStoresDB(prev => [...prev, newUser]);
                }
                setUser(newUser);
                setShowShortcutModal(true); 
                if (role === 'driver') setView('driverDash');
                else if (role === 'store') setView('storeDash');
                else setView('clientDash');
            };

            const logout = () => {
                setUser(null);
                setShowPostOrderModal(false);
                setView('landing');
            };

            const handleOrderComplete = () => {
                playAlertSound();
                showAlert("¡Pedido enviado con éxito!", "success");
                setShowPostOrderModal(true);
            };

            const handleNewOrder = () => {
                setShowPostOrderModal(false);
            };

            const Landing = () => {
                const [showLoginModal, setShowLoginModal] = useState(false);
                const [showForgotModal, setShowForgotModal] = useState(false);
                const [email, setEmail] = useState('');
                const [pass, setPass] = useState('');
                const [forgotEmail, setForgotEmail] = useState('');

                const handlePasswordRecovery = (e) => {
                    e.preventDefault();
                    if (!forgotEmail) {
                        showAlert("Por favor ingresa tu correo electrónico.");
                        return;
                    }
                    const userAccount = usersDB.find(u => u.email === forgotEmail) || (forgotEmail === ADMIN_EMAIL ? {email: ADMIN_EMAIL} : null);
                    if (userAccount) {
                        showAlert(`Contraseña enviada automáticamente desde ${ADMIN_EMAIL} a ${forgotEmail}.`, "success");
                        setShowForgotModal(false);
                        setForgotEmail('');
                    } else {
                        showAlert("No se encontró ninguna cuenta registrada con este correo.");
                    }
                };

                return (
                    <div className="flex flex-col h-full bg-grita-black text-white relative">
                        {showLoginModal && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[250] p-4">
                                <div className="bg-white text-gray-900 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
                                    <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-gray-500 font-bold">✕</button>
                                    <div className="w-16 h-16 bg-red-100 text-grita-red rounded-full flex items-center justify-center mx-auto mb-3 shadow">
                                        <i className="fa-solid fa-user-shield text-2xl"></i>
                                    </div>
                                    <h3 className="text-xl font-bold mb-1 text-center">Iniciar Sesión / Admin</h3>
                                    <p className="text-gray-500 text-xs mb-4 text-center">Accede a tu cuenta o panel de administración</p>
                                    <input type="email" placeholder="Correo Electrónico" className="w-full p-3 mb-3 border rounded-xl text-sm bg-gray-50" value={email} onChange={e=>setEmail(e.target.value)}/>
                                    <input type="password" placeholder="Contraseña" className="w-full p-3 mb-2 border rounded-xl text-sm bg-gray-50" value={pass} onChange={e=>setPass(e.target.value)}/>
                                    <div className="text-right mb-4">
                                        <button onClick={() => { setShowLoginModal(false); setShowForgotModal(true); }} className="text-xs text-grita-red font-bold hover:underline">¿Olvidaste tu contraseña?</button>
                                    </div>
                                    <button onClick={() => handleLogin(email, pass)} className="w-full bg-grita-red hover:bg-grita-darkred text-white font-bold py-3 rounded-xl shadow transition">
                                        Entrar
                                    </button>
                                </div>
                            </div>
                        )}

                        {showForgotModal && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[250] p-4">
                                <div className="bg-white text-gray-900 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
                                    <button onClick={() => setShowForgotModal(false)} className="absolute top-4 right-4 text-gray-500 font-bold">✕</button>
                                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow">
                                        <i className="fa-solid fa-key text-2xl"></i>
                                    </div>
                                    <h3 className="text-xl font-bold mb-1 text-center">Recuperar Contraseña</h3>
                                    <p className="text-gray-500 text-xs mb-4 text-center">Te enviaremos los datos automáticamente desde {ADMIN_EMAIL}</p>
                                    <form onSubmit={handlePasswordRecovery}>
                                        <input type="email" placeholder="Tu correo electrónico registrado" className="w-full p-3 mb-4 border rounded-xl text-sm bg-gray-50" value={forgotEmail} onChange={e=>setForgotEmail(e.target.value)}/>
                                        <button type="submit" className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow transition">
                                            Enviar Contraseña al Correo
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        <div className="flex-grow flex flex-col items-center justify-center p-6 text-center">
                            <div className="w-24 h-24 bg-grita-red rounded-full flex items-center justify-center mb-3 shadow-[0_0_30px_rgba(220,38,38,0.5)] border-4 border-white">
                                <i className="fa-solid fa-motorcycle text-4xl text-white"></i>
                            </div>
                            <h1 className="text-2xl font-extrabold mb-1"><span className="text-grita-red">Moto</span> UBGrit</h1>
                            <div className="text-gray-300 mb-5 text-[11px] max-w-xs leading-relaxed font-bold">
                                <p>Tu Traslado y Encomienda</p>
                                <p>Seguro y Rápido en la Grita</p>
                            </div>
                            
                            <div className="space-y-3 w-full max-w-xs">
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setShowLoginModal(true)} className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 px-2 rounded-xl transition shadow flex items-center justify-center gap-1.5 text-xs">
                                        <i className="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
                                    </button>
                                    <button onClick={() => { setEmail(ADMIN_EMAIL); setPass(ADMIN_PASS); setShowLoginModal(true); }} className="w-full bg-zinc-800 hover:bg-zinc-700 text-amber-400 border border-amber-500/50 font-bold py-3.5 px-2 rounded-xl transition shadow flex items-center justify-center gap-1.5 text-xs">
                                        <i className="fa-solid fa-shield-halved"></i> Admin
                                    </button>
                                </div>
                                <button onClick={() => setView('registerClient')} className="w-full bg-white hover:bg-gray-200 text-grita-black font-bold py-3.5 px-4 rounded-xl transition shadow text-sm">
                                    Soy Pasajero (Registrarse)
                                </button>
                                <button onClick={() => setView('registerStore')} className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 px-4 rounded-xl transition shadow text-sm">
                                    Soy Local / Empresa (Encomiendas)
                                </button>
                                <button onClick={() => setView('registerDriver')} className="w-full border-2 border-grita-red text-grita-red hover:bg-grita-red hover:text-white font-bold py-3.5 px-4 rounded-xl transition shadow text-sm">
                                    Quiero ser Conductor
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const RegisterForm = ({ role }) => {
                const isDriver = role === 'driver';
                const isStore = role === 'store';
                const [formData, setFormData] = useState({
                    name: '', last: '', phone: '', address: '', email: '', password: '', vehicle: '', plate: '', storeName: ''
                });
                const [storeCoords, setStoreCoords] = useState(LA_GRITA_COORDS);
                const [isSubmitting, setIsSubmitting] = useState(false);
                const mapRef = useRef(null);
                const mapInstance = useRef(null);
                const markerRef = useRef(null);

                useEffect(() => {
                    if (isStore && !mapInstance.current && mapRef.current) {
                        mapInstance.current = L.map(mapRef.current).setView(LA_GRITA_COORDS, 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance.current);
                        
                        const storeIcon = L.divIcon({ html: `<div class="w-6 h-6 bg-amber-600 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white text-xs"><i class="fa-solid fa-store"></i></div>`, className: '' });
                        markerRef.current = L.marker(LA_GRITA_COORDS, { draggable: true, icon: storeIcon }).addTo(mapInstance.current);

                        markerRef.current.on('dragend', () => {
                            const pos = markerRef.current.getLatLng();
                            setStoreCoords([pos.lat, pos.lng]);
                        });

                        mapInstance.current.on('click', (e) => {
                            markerRef.current.setLatLng(e.latlng);
                            setStoreCoords([e.latlng.lat, e.latlng.lng]);
                        });
                    }
                }, [isStore]);

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    if(!formData.email || !formData.password || (!isStore && !formData.name) || (isStore && !formData.storeName)) {
                        showAlert("Por favor llene todos los campos obligatorios incluyendo correo y contraseña.");
                        return;
                    }

                    setIsSubmitting(true);
                    const finalData = { ...formData, coords: storeCoords };
                    const dataToSend = { ...finalData, rol: role };

                    try {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors", 
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify(dataToSend), 
                        });

                        handleRegister(role, finalData);

                        if (isDriver) {
                            window.open(DRIVER_WHATSAPP_GROUP, '_blank');
                        } else {
                            showAlert("¡Registro exitoso! Ya puedes operar.", "success");
                        }
                    } catch (error) {
                        console.error("Error enviando datos:", error);
                        handleRegister(role, finalData);
                        showAlert("Registro exitoso localmente.", "success");
                    } finally {
                        setIsSubmitting(false);
                    }
                };

                return (
                    <div className="flex flex-col h-full bg-white overflow-y-auto">
                        <div className="p-4 bg-grita-black text-white sticky top-0 z-25 flex items-center shadow-md">
                            <button type="button" onClick={() => setView('landing')} className="mr-4">← Volver</button>
                            <h2 className="text-xl font-bold">Registro de {isDriver ? 'Conductor' : (isStore ? 'Local / Empresa' : 'Pasajero')}</h2>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 max-w-md mx-auto w-full space-y-4">
                            {isStore ? (
                                <>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">NOMBRE DE LA EMPRESA O LOCAL</label>
                                        <input required placeholder="Ej. Farmacia La Grita" className="w-full p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, storeName: e.target.value})}/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">NOMBRE DEL ENCARGADO</label>
                                        <input required placeholder="Nombre y Apellido" className="w-full p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, name: e.target.value})}/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">TELÉFONO DE CONTACTO</label>
                                        <input required type="tel" placeholder="0414..." className="w-full p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, phone: e.target.value})}/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">DIRECCIÓN ESCRITA DEL LOCAL</label>
                                        <input required placeholder="Ej. Carrera 5, frente a la plaza" className="w-full p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, address: e.target.value})}/>
                                    </div>
                                    <div className="pt-2">
                                        <label className="block text-xs font-bold text-gray-600 mb-1">UBICACIÓN GEOGRÁFICA EN MAPA</label>
                                        <div className="h-48 w-full rounded-xl overflow-hidden border relative z-10">
                                            <div ref={mapRef} className="h-full w-full"></div>
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input required placeholder="Nombres" className="p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, name: e.target.value})}/>
                                        <input required placeholder="Apellidos" className="p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, last: e.target.value})}/>
                                    </div>
                                    <input required type="tel" placeholder="Teléfono" className="w-full p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, phone: e.target.value})}/>
                                    <textarea required placeholder="Dirección de Vivienda" className="w-full p-3 border rounded-lg bg-gray-50 text-sm" onChange={e=>setFormData({...formData, address: e.target.value})}></textarea>
                                </>
                            )}

                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">CORREO ELECTRÓNICO (Para Iniciar Sesión)</label>

                        const data = await res.json();
                        
                        if (data && data.length > 0) {

                            if (type === 'pickup') {

            };

            const AdminDashboard = () => {
                const [tab, setTab] = useState('map'); 
                const mapRef = useRef(null);
                const mapInstance = useRef(null);

                const drivers = usersDB.filter(u => u.role === 'driver');
                const stores = storesDB;
                const clients = usersDB.filter(u => u.role === 'client');

                useEffect(() => {
                    if (tab === 'map' && !mapInstance.current && mapRef.current) {
                        mapInstance.current = L.map(mapRef.current).setView(LA_GRITA_COORDS, 15);
                        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png').addTo(mapInstance.current);
                    }

                    if (tab === 'map' && mapInstance.current) {
                        mapInstance.current.eachLayer((layer) => {
                            if (layer instanceof L.Marker) mapInstance.current.removeLayer(layer);
                        });

                        drivers.filter(d => d.isOnline).forEach(m => {
                            const icon = L.divIcon({
                                html: `<div class="w-7 h-7 bg-black rounded-full flex items-center justify-center text-white border-2 border-grita-red"><i class="fa-solid fa-motorcycle text-[10px]"></i></div>`,
                                className: '', iconSize: [28, 28], iconAnchor: [14, 14]
                            });
                            L.marker(m.coords || LA_GRITA_COORDS, {icon}).addTo(mapInstance.current).bindPopup(`<b>${m.name}</b>`);
                        });

                        stores.forEach(s => {
                            const storeIcon = L.divIcon({
                                html: `<div class="w-7 h-7 bg-amber-600 rounded-full flex items-center justify-center text-white border-2 border-white"><i class="fa-solid fa-store text-[10px]"></i></div>`,
                                className: '', iconSize: [28, 28], iconAnchor: [14, 14]
                            });
                            L.marker(s.coords || LA_GRITA_COORDS, {icon: storeIcon}).addTo(mapInstance.current).bindPopup(`<b>${s.storeName}</b>`);
                        });
                    }
                }, [tab, drivers, stores]);

                return (
                    <div className="flex flex-col h-full bg-gray-100">
                        <div className="bg-grita-red text-white p-3 flex justify-between items-center shadow-md z-20">
                            <span className="font-bold text-sm"><i className="fa-solid fa-shield-halved"></i> Panel Admin</span>
                            <button onClick={logout} className="text-xs bg-black/20 px-2.5 py-1 rounded">Salir</button>
                        </div>
                        <div className="flex bg-white shadow-sm z-20 overflow-x-auto">
                            <button onClick={()=>setTab('map')} className={`flex-1 py-2 px-3 font-bold text-xs border-b-2 whitespace-nowrap ${tab==='map'?'border-grita-red text-grita-red':'border-transparent text-gray-500'}`}>Mapa GPS</button>
                            <button onClick={()=>setTab('clients')} className={`flex-1 py-2 px-3 font-bold text-xs border-b-2 whitespace-nowrap ${tab==='clients'?'border-grita-red text-grita-red':'border-transparent text-gray-500'}`}>Pasajeros ({clients.length})</button>
                            <button onClick={()=>setTab('stores')} className={`flex-1 py-2 px-3 font-bold text-xs border-b-2 whitespace-nowrap ${tab==='stores'?'border-grita-red text-grita-red':'border-transparent text-gray-500'}`}>Locales ({stores.length})</button>
                            <button onClick={()=>setTab('drivers')} className={`flex-1 py-2 px-3 font-bold text-xs border-b-2 whitespace-nowrap ${tab==='drivers'?'border-grita-red text-grita-red':'border-transparent text-gray-500'}`}>Choferes ({drivers.length})</button>
                        </div>
                        <div className="flex-grow relative overflow-hidden">
                            {tab === 'map' && <div className="absolute inset-0"><div ref={mapRef} className="map-container"></div></div>}
                            {tab === 'clients' && (
                                <div className="h-full overflow-y-auto p-3 space-y-2 text-xs">
                                    <h4 className="font-bold text-gray-700">Pasajeros</h4>
                                    {clients.map(c => (
                                        <div key={c.id} className="bg-white p-3 rounded-lg shadow border">
                                            <p className="font-bold">{c.name} {c.last}</p>
                                            <p className="text-gray-500">{c.email} • {c.phone}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                            {tab === 'stores' && (
                                <div className="h-full overflow-y-auto p-3 space-y-2 text-xs">
                                    <h4 className="font-bold text-gray-700">Locales</h4>
                                    {stores.map(s => (
                                        <div key={s.id} className="bg-white p-3 rounded-lg shadow border border-amber-100">
                                            <p className="font-bold text-amber-700">{s.storeName}</p>
                                            <p className="text-gray-600">{s.name} • {s.phone}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                            {tab === 'drivers' && (
                                <div className="h-full overflow-y-auto p-3 space-y-2 text-xs">
                                    <h4 className="font-bold text-gray-700">Conductores</h4>
                                    {drivers.map(d => (
                                        <div key={d.id} className="bg-white p-3 rounded-lg shadow border flex justify-between items-center">
                                            <div>
                                                <p className="font-bold">{d.name}</p>
                                                <p className="text-gray-500">{d.vehicle} • {d.plate}</p>
                                            </div>
                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${d.isOnline ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                                {d.isOnline ? 'Online' : 'Offline'}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <>
                    {alert && <AlertBox msg={alert.msg} type={alert.type} onClose={() => setAlert(null)} />}
                    {showShortcutModal && <ShortcutModal onClose={() => setShowShortcutModal(false)} />}
                    {showPostOrderModal && <PostOrderModal onExit={logout} onNewOrder={handleNewOrder} />}
                    {view === 'landing' && <Landing />}
                    {view === 'registerClient' && <RegisterForm role="client" />}
                    {view === 'registerStore' && <RegisterForm role="store" />}
                    {view === 'registerDriver' && <RegisterForm role="registerDriver" />}
                    {view === 'clientDash' && <ClientDashboard user={user} onLogout={logout} onOrderComplete={handleOrderComplete} />}
                    {view === 'storeDash' && <StoreDashboard user={user} onLogout={logout} onOrderComplete={handleOrderComplete} />}
                    {view === 'driverDash' && <DriverDashboard user={user} onLogout={logout} />}
                    {view === 'adminDash' && <AdminDashboard />}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
