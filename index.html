        const AdminPanel = ({ goBack, showToast }) => {
            const [pendings, setPendings] = useState([]);
            const [users, setUsers] = useState([]);
            const [adminTab, setAdminTab] = useState('viajes'); 
            const [selectedUser, setSelectedUser] = useState(null);

            useEffect(() => {
                if(!window.fb) return;
                
                // Suscripción en tiempo real a Usuarios
                const unsubUsers = window.fb.onSnapshot(getCol('users'), (snap) => {
                    setUsers(snap.docs.map(d => d.data()));
                }, (err) => console.log(err));

                // Suscripción en tiempo real a Viajes Pendientes (Activa Campanita Visual)
                const unsubTrips = window.fb.onSnapshot(getCol('trips'), (snap) => {
                    const allPending = snap.docs.map(d => d.data()).filter(t => t.status === 'pending');
                    setPendings(allPending);
                }, (err) => console.log(err));

                return () => { unsubUsers(); unsubTrips(); };
            }, []);

            const toggleVerify = async (email) => {
                if(!window.fb) return;
                try {
                    const targetUser = users.find(u => u.email === email);
                    await window.fb.updateDoc(getDoc('users', email), { verified: !targetUser.verified });
                    if(selectedUser) setSelectedUser({...selectedUser, verified: !targetUser.verified});
                    showToast("Estado de chofer actualizado en la nube", false);
                } catch(e) { showToast("Error al verificar", true); }
            };

            const drivers = users.filter(u => u.role === 'driver');
            const clients = users.filter(u => u.role !== 'driver' && u.role !== 'admin');

            if (selectedUser) {
                return (
                    <div className="flex flex-col h-full bg-gray-100 fade-in w-full relative">
                        <HeaderNav title={`Perfil: ${selectedUser.nombre}`} onBack={() => setSelectedUser(null)} />
                        <div className="p-4 flex-1 overflow-y-auto space-y-4 pb-24">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 text-sm">
                                <div className="flex items-center justify-between border-b border-gray-100 pb-4 mb-4">
                                    <div className="flex items-center gap-3">
                                        <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-xl"><i className="fa-solid fa-user text-gray-400"></i></div>
                                        <div>
                                            <h3 className="font-black text-lg text-gray-800 leading-tight">{selectedUser.nombre}</h3>
                                            <span className="text-[9px] font-black px-2 py-0.5 bg-blue-100 text-blue-800 rounded uppercase tracking-wider">{selectedUser.role}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <p className="bg-gray-50 p-3 rounded-lg border"><span className="font-black text-gray-400 block text-[9px] uppercase mb-1">Cédula de Identidad</span> <span className="font-bold text-gray-700">{selectedUser.cedula}</span></p>
                                    <p className="bg-gray-50 p-3 rounded-lg border"><span className="font-black text-gray-400 block text-[9px] uppercase mb-1">Correo Electrónico</span> <span className="font-bold text-gray-700">{selectedUser.email}</span></p>
                                    <p className="bg-gray-50 p-3 rounded-lg border"><span className="font-black text-gray-400 block text-[9px] uppercase mb-1">WhatsApp</span> <a href={`https://wa.me/${selectedUser.telefono}`} target="_blank" className="text-[#25D366] font-black flex items-center gap-1"><i className="fa-brands fa-whatsapp"></i> {selectedUser.telefono}</a></p>
                                    <p className="bg-gray-50 p-3 rounded-lg border"><span className="font-black text-gray-400 block text-[9px] uppercase mb-1">Dirección Registrada</span> <span className="font-bold text-gray-700 text-xs">{selectedUser.direccion}</span></p>
                                </div>
                                
                                {selectedUser.role === 'driver' && (
                                    <div className="mt-5 bg-blue-50 p-4 rounded-xl border border-blue-200">
                                        <h4 className="font-black mb-3 text-blue-900 border-b border-blue-200 pb-2 flex items-center gap-2"><i className="fa-solid fa-motorcycle"></i> Datos del Vehículo</h4>
                                        <p><span className="font-black text-blue-600 block text-[9px] uppercase mb-1">Placa Registrada</span> <span className="font-bold text-xl text-blue-900 bg-white px-3 py-1 rounded shadow-sm border">{selectedUser.placa || 'No registrada'}</span></p>
                                    </div>
                                )}
                            </div>
                        </div>
                        {selectedUser.role === 'driver' && (
                            <div className="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] pb-8">
                                <button onClick={() => toggleVerify(selectedUser.email)} className={`w-full py-4 rounded-xl font-black shadow-lg text-white transition-all active:scale-95 ${selectedUser.verified ? 'bg-red-500 hover:bg-red-600' : 'bg-green-600 hover:bg-green-700'}`}>
                                    {selectedUser.verified ? '🚫 BLOQUEAR CHOFER' : '✅ APROBAR CHOFER'}
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full">
                    <HeaderNav title="Central Admin" onBack={goBack} right={<div className="relative mt-1"><i className={`fa-solid fa-bell text-2xl ${pendings.length>0?'animate-ring text-red-500 drop-shadow-md':'text-gray-500'}`}></i>{pendings.length>0 && <span className="absolute -top-1 -right-2 bg-red-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full border border-white">{pendings.length}</span>}</div>} />
                    
                    <div className="flex bg-white shadow-sm shrink-0 border-b border-gray-200">
                        <button onClick={()=>setAdminTab('viajes')} className={`flex-1 py-3.5 text-xs font-black transition-colors ${adminTab==='viajes'?'border-b-4 border-red-500 text-red-600 bg-red-50':'text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-route"></i> Viajes</button>
                        <button onClick={()=>setAdminTab('choferes')} className={`flex-1 py-3.5 text-xs font-black transition-colors ${adminTab==='choferes'?'border-b-4 border-blue-500 text-blue-600 bg-blue-50':'text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-helmet-safety"></i> Choferes</button>
                        <button onClick={()=>setAdminTab('usuarios')} className={`flex-1 py-3.5 text-xs font-black transition-colors ${adminTab==='usuarios'?'border-b-4 border-green-500 text-green-600 bg-green-50':'text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-users"></i> Clientes</button>
                    </div>

                    <div className="p-4 flex-1 overflow-y-auto space-y-4 pb-20">
                        {adminTab === 'viajes' && (
                            <div className={`p-5 rounded-2xl shadow-sm border ${pendings.length>0?'bg-red-50 border-red-200':'bg-white border-gray-200'}`}>
                                <h3 className="font-black text-sm mb-4 text-gray-800 flex items-center gap-2"><i className="fa-solid fa-satellite-dish text-red-500"></i> Solicitudes Activas</h3>
                                {pendings.length === 0 ? <p className="text-xs font-bold text-gray-400 text-center py-8 bg-gray-50 rounded-xl border border-dashed">No hay pedidos en cola.</p> : pendings.map(t => (
                                    <div key={t.id} className="p-4 bg-white rounded-xl border border-gray-200 mb-3 shadow-sm flex flex-col gap-2">
                                        <div className="flex justify-between items-center border-b pb-2">
                                            <span className="font-black text-[10px] bg-blue-100 text-blue-800 px-2 py-1 rounded uppercase tracking-wider">{t.tipo}</span>
                                            <span className="font-black text-green-700 text-lg">{t.precio.toLocaleString()} <span className="text-[10px]">COP</span></span>
                                        </div>
                                        <div>
                                            <p className="font-bold text-xs text-gray-800"><i className="fa-solid fa-user text-gray-400 w-4"></i> {t.cliente}</p>
                                            <p className="text-[10px] text-gray-500 mt-1"><i className="fa-solid fa-circle-dot text-green-500 w-4"></i> {t.origen}</p>
                                            <p className="text-[10px] text-gray-500"><i className="fa-solid fa-location-dot text-red-500 w-4"></i> {t.destino}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {adminTab === 'choferes' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                <h3 className="font-black text-sm mb-4 text-gray-800 border-b pb-2">Directorio de Choferes</h3>
                                {drivers.length === 0 && <p className="text-xs font-bold text-gray-400 text-center py-6 bg-gray-50 rounded-xl border border-dashed">No hay choferes registrados.</p>}
                                {drivers.map(d => (
                                    <div key={d.email} onClick={() => setSelectedUser(d)} className="p-3 bg-gray-50 rounded-xl border border-gray-200 mb-2 flex justify-between items-center cursor-pointer hover:bg-blue-50 transition-colors shadow-sm active:scale-95">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center border shadow-sm"><i className="fa-solid fa-motorcycle text-gray-500"></i></div>
                                            <div>
                                                <p className="font-black text-gray-800 text-xs">{d.nombre}</p>
                                                <p className="text-[9px] text-gray-500 mt-0.5 font-bold">Placa: {d.placa || 'N/A'}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className={`px-2 py-1 rounded text-[9px] font-black text-white shadow-sm uppercase ${d.verified?'bg-green-500':'bg-red-500 animate-pulse'}`}>{d.verified ? 'Activo' : 'Revisar'}</span>
                                            <i className="fa-solid fa-chevron-right text-gray-300"></i>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {adminTab === 'usuarios' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                <h3 className="font-black text-sm mb-4 text-gray-800 border-b pb-2">Directorio General</h3>
                                {clients.length === 0 && <p className="text-xs font-bold text-gray-400 text-center py-6 bg-gray-50 rounded-xl border border-dashed">Sin usuarios registrados.</p>}
                                {clients.map(c => (
                                    <div key={c.email} onClick={() => setSelectedUser(c)} className="p-3 bg-gray-50 rounded-xl border border-gray-200 mb-2 flex justify-between items-center cursor-pointer hover:bg-green-50 transition-colors shadow-sm active:scale-95">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center border shadow-sm"><i className={`fa-solid ${c.role==='store'?'fa-store':'fa-user'} text-gray-500`}></i></div>
                                            <div>
                                                <p className="font-black text-gray-800 text-xs">{c.nombre}</p>
                                                <p className="text-[9px] text-gray-500 mt-0.5 font-bold uppercase">{c.role}</p>
                                            </div>
                                        </div>
                                        <i className="fa-solid fa-chevron-right text-gray-300"></i>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('splash');
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('');
            const [form, setForm] = useState({});
            const [toast, setToast] = useState(null);
            const [fbReady, setFbReady] = useState(false);

            useEffect(() => {
                if (window.fb) setFbReady(true);
                else window.addEventListener('firebase-ready', () => setFbReady(true));

                const u = localStorage.getItem('motoubgrit_current'); 
                if(u) setUser(JSON.parse(u));
                setTimeout(() => { if(view === 'splash') setView('menu'); }, 3000);
            }, []);

            const showToast = (msg, isError) => { setToast({msg, isError}); setTimeout(()=>setToast(null), 3500); };
            const handleLogout = () => { localStorage.removeItem('motoubgrit_current'); setUser(null); showToast("Sesión cerrada", false); setView('menu'); };
            const handleInputChange = (e) => setForm({...form, [e.target.name]: e.target.value});

            const nav = async (u) => { 
                if(u.role==='driver') { 
                    if(window.fb) {
                        const snap = await window.fb.getDoc(getDoc('users', u.email));
                        if(snap.exists() && snap.data().verified) { setView('driver_dash'); } 
                        else showToast("⚠️ Cuenta en revisión por Admin.", true);
                    }
                } 
                else if(u.role==='market') setView('market'); 
                else if(u.role==='store') setView('enco'); 
                else setView('client'); 
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                if(!fbReady) return showToast("Conectando nube...", true);

                if(role === 'admin') { 
                    if(form.email === ADMIN_EMAIL && form.password === ADMIN_PASS) { setView('admin'); showToast("🔐 Acceso Concedido", false); } 
                    else showToast("Credenciales inválidas", true); 
                    return; 
                }
                
                try {
                    const userRef = getDoc('users', form.email);
                    const snap = await window.fb.getDoc(userRef);
                    
                    if (snap.exists() && snap.data().password === form.password) {
                        const exist = snap.data();
                        setUser(exist); localStorage.setItem('motoubgrit_current', JSON.stringify(exist)); 
                        nav(exist); showToast(`¡Hola de nuevo, ${exist.nombre}!`, false);
                    } else if (form.nombre && form.cedula) { 
                        const nu = { ...form, role: role, verified: false }; 
                        await window.fb.setDoc(userRef, nu);
                        setUser(nu); localStorage.setItem('motoubgrit_current', JSON.stringify(nu));
                        if(role === 'driver') setView('driver_rules'); else { showToast("Registro exitoso en Nube", false); nav(nu); }
                    } else {
                        showToast("Faltan datos obligatorios o clave errónea", true);
                    }
                } catch(err) {
                    showToast("Error de conexión con la nube", true);
                }
            };

            if(view === 'splash') return (
                <div className="fixed inset-0 bg-[#0b0f19] flex flex-col items-center justify-center z-50 text-center">
                    <div className="w-28 h-28 bg-red-600 rounded-full flex items-center justify-center mb-6 animate-logo border-4 border-red-500"><i className="fa-solid fa-motorcycle text-5xl text-white"></i></div>
                    <h1 className="text-5xl font-black text-white mb-2 tracking-tighter">Moto UBGrit</h1>
                    <div className="bg-black/40 border border-gray-800 p-4 rounded-2xl mt-4 w-10/12 backdrop-blur-sm">
                        <p className="text-[11px] text-gray-300 font-black uppercase tracking-widest leading-relaxed">Tu Traslado / Encomienda<br/>Mercado / Medicamento</p>
                        <div className="mt-3 bg-red-600/20 border border-red-500/50 rounded-lg py-1.5"><p className="text-red-500 font-black text-[10px] tracking-[0.2em]">RÁPIDO Y SEGURO</p></div>
                    </div>
                </div>
            );
            
            if(view === 'menu') return (
                <div className="flex flex-col h-full bg-[#0b0f19] w-full p-5 text-center relative overflow-y-auto">
                    {toast && <Toast msg={toast.msg} isError={toast.isError} />}
                    <div className="absolute top-4 right-4 flex gap-2 z-20">
                        <button onClick={()=>{setRole('admin');setView('auth');}} className="bg-white/10 text-white px-3 py-2 rounded-lg text-[10px] font-black border border-white/20 hover:bg-white/20"><i className="fa-solid fa-shield-halved"></i> Admin</button>
                        {user && <button onClick={handleLogout} className="bg-red-600 text-white px-3 py-2 rounded-lg text-[10px] font-black shadow-md hover:bg-red-700"><i className="fa-solid fa-right-from-bracket"></i> Salir</button>}
                    </div>
                    <div className="mt-10 mb-6 flex flex-col items-center">
                        <div className="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center mb-4 shadow-[0_0_30px_rgba(220,38,38,0.4)] border-2 border-red-500"><i className="fa-solid fa-motorcycle text-3xl text-white"></i></div>
                        <h1 className="text-3xl font-black text-white mb-2 tracking-tight">Moto UBGrit</h1>
                        <p className="text-[9px] text-gray-400 font-black uppercase tracking-widest leading-relaxed">Tu Traslado / Encomienda<br/>Mercado / Medicamento</p>
                        <p className="text-red-500 font-black tracking-[0.2em] mt-2 text-[9px] bg-red-500/10 border border-red-500/30 px-3 py-1 rounded-full">RÁPIDO Y SEGURO</p>
                    </div>
                    <div className="space-y-3 w-full max-w-sm mx-auto pb-8">
                        <button onClick={()=>{setRole('client'); user?.role==='client'?nav(user):setView('auth');}} className="w-full bg-white text-black font-black py-4 rounded-xl text-sm shadow-xl flex items-center justify-center gap-3 transition-transform active:scale-95"><div className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><i className="fa-solid fa-person-biking text-gray-700"></i></div> Pedir Moto (Pasajero)</button>
                        <button onClick={()=>{setRole('store'); user?.role==='store'?nav(user):setView('auth');}} className="w-full bg-blue-600 text-white font-black py-4 rounded-xl text-sm shadow-xl flex items-center justify-center gap-3 transition-transform active:scale-95"><div className="w-8 h-8 bg-blue-700 rounded-full flex items-center justify-center"><i className="fa-solid fa-box text-white"></i></div> Local / Encomiendas</button>
                        <button onClick={()=>{setRole('market'); user?.role==='market'?nav(user):setView('auth');}} className="w-full bg-green-600 text-white font-black py-4 rounded-xl text-sm shadow-xl flex items-center justify-center gap-3 transition-transform active:scale-95"><div className="w-8 h-8 bg-green-700 rounded-full flex items-center justify-center"><i className="fa-solid fa-basket-shopping text-white"></i></div> Mercado en Casa</button>
                        <button onClick={()=>showToast('Módulo de Farmacia en desarrollo', false)} className="w-full bg-purple-600 text-white font-black py-4 rounded-xl text-sm shadow-xl opacity-90 flex items-center justify-center gap-3 transition-transform active:scale-95"><div className="w-8 h-8 bg-purple-700 rounded-full flex items-center justify-center"><i className="fa-solid fa-pills text-white"></i></div> Farmacia (Próximamente)</button>
                        <div className="pt-6 mt-6 border-t border-gray-800/50">
                            <button onClick={()=>{setRole('driver'); user?.role==='driver'?nav(user):setView('auth');}} className="w-full bg-[#1a1a1a] text-gray-400 border-2 border-gray-800 hover:border-gray-600 py-4 rounded-xl font-black text-xs transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-helmet-safety"></i> Panel Conductor</button>
                        </div>
                    </div>
                </div>
            );

            if(view === 'auth') return (
                <div className="flex flex-col h-full bg-[#0b0f19] w-full overflow-y-auto">
                    <HeaderNav title={role==='admin'?"Acceso Administrador": "Ingreso Seguro"} onBack={()=>setView('menu')} />
                    <div className="p-5 pb-20">
                        <form onSubmit={handleAuth} className="bg-white p-6 rounded-3xl space-y-4 shadow-2xl relative border-t-8 border-red-600">
                            <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 w-12 h-12 bg-red-600 rounded-full flex items-center justify-center shadow-lg border-4 border-[#0b0f19]"><i className="fa-solid fa-lock text-white"></i></div>
                            <h2 className="text-center font-black text-lg text-gray-800 mt-2 mb-1">Tus Datos</h2>
                            <p className="text-[10px] text-center text-gray-500 font-bold mb-4">{role === 'admin' ? 'Solo personal autorizado.' : 'Ingresa correo y clave. Si eres nuevo, llena el resto para registrarte.'}</p>
                            
                            <div className="space-y-3">
                                <input required name="email" type="email" placeholder="Correo electrónico" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                <input required name="password" type="password" placeholder="Contraseña" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                            </div>

                            {role !== 'admin' && (
                                <div className="border-t border-dashed border-gray-300 pt-4 mt-2 space-y-3">
                                    <p className="text-[9px] text-gray-400 font-black uppercase tracking-widest text-center bg-gray-50 py-1 rounded">Si eres nuevo, llena esto:</p>
                                    <input name="nombre" placeholder="Nombre completo o Local" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                    <input name="cedula" type="number" placeholder="Cédula de Identidad" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                    <input name="telefono" type="tel" placeholder="WhatsApp (Ej: 584141234567)" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                    {role === 'driver' && <input name="placa" placeholder="Placa y Modelo de Moto" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />}
                                    <textarea name="direccion" placeholder="Dirección exacta en La Grita" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs h-20 outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                </div>
                            )}
                            <button type="submit" disabled={!fbReady} className="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-xl font-black text-sm shadow-lg mt-4 transition-transform active:scale-95 disabled:opacity-50">{fbReady ? 'Ingresar / Registrar' : 'Conectando Nube...'}</button>
                            <button type="button" onClick={()=>setView('menu')} className="w-full text-gray-500 py-3 rounded-xl text-xs font-bold mt-1 hover:bg-gray-50"><i className="fa-solid fa-arrow-left mr-1"></i> Cancelar y Volver</button>
                        </form>
                    </div>
                </div>
            );

            if(view === 'driver_rules') return (
                <div className="flex flex-col h-full bg-[#0b0f19] p-6 text-center justify-center">
                    <div className="bg-white p-6 rounded-3xl border-4 border-yellow-400 shadow-2xl">
                        <span className="text-5xl block mb-2">⚠️</span><h2 className="text-xl font-black mb-4 text-gray-800">REGLAS DEL CHOFER</h2>
                        <div className="text-left text-xs font-bold space-y-3 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200 text-gray-600 shadow-inner">
                            <p><i className="fa-solid fa-check text-green-500 mr-1"></i> 1. Cobrar estrictamente la tarifa de la app.</p>
                            <p><i className="fa-solid fa-check text-green-500 mr-1"></i> 2. Casco (chofer y pasajero) obligatorio.</p>
                            <p><i className="fa-solid fa-check text-green-500 mr-1"></i> 3. Tienes 60s para aceptar un viaje antes de que pase a otro chofer.</p>
                            <p className="text-red-700 bg-red-100 p-3 rounded-lg border border-red-200 mt-2"><i className="fa-solid fa-triangle-exclamation mr-1"></i> 4. Tu cuenta debe ser aprobada por el administrador.</p>
                        </div>
                        <button onClick={()=>{window.open(`https://wa.me/${ADMIN_PHONE}?text=Registrado%20como%20chofer.%20Mi%20nombre%20es%20${user.nombre},%20cedula%20${user.cedula}.%20Espero%20aprobacion.`, '_blank'); setView('menu');}} className="w-full bg-black text-white py-4 rounded-xl font-black shadow-lg transition-transform active:scale-95"><i className="fa-brands fa-whatsapp text-green-500 mr-2"></i> Notificar Admin y Salir</button>
                    </div>
                </div>
            );

            if(view === 'client') return <TripPlanner user={user} type="client" goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'enco') return <TripPlanner user={user} type="encomienda" goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'market') return <MercadoDashboard user={user} goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'driver_dash') return <DriverDashboard user={user} goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'admin') return <AdminPanel goBack={()=>setView('menu')} showToast={showToast} />;
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
