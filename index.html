                        if (p.max && newQ > p.max) newQ = p.max;

                                        <p className="text-[10px] text-gray-500 font-bold"><span className="text-red-500">A:</span> {t.destino}</p>
                                    </div>
                                    <button onClick={()=>acceptTrip(t)} className="w-full bg-blue-600 text-white font-black py-3 rounded-xl mt-4 active:scale-95">ACEPTAR CARRERA</button>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };
        const AdminDashboard = ({ goBack }) => {
            const [adminView, setAdminView] = useState('main'); 
            const [trips, setTrips] = useState([]);
            const [loading, setLoading] = useState(false);
            useEffect(() => {
                if (!window.db) return;
                const fetchAll = async () => {
                    setLoading(true);
                    try {
                        const q = window.fb.query(window.fb.collection(window.db, "viajes"), window.fb.orderBy("fecha", "desc"));
                        const snapV = await window.fb.getDocs(q);
                        let v = []; snapV.forEach(d => v.push({ id: d.id, ...d.data() })); setTrips(v);
                    } catch(e) { console.log(e); }
                    setLoading(false);
                };
                if(adminView !== 'main') fetchAll();
            }, [adminView]);
            const renderMainMenu = () => (
                <div className="flex-1 p-4 pb-20 flex flex-col items-center w-full fade-in">
                    <div className="w-16 h-16 rounded-full bg-green-100 border-4 border-green-500 text-green-500 flex items-center justify-center mb-2 text-2xl shadow-md"><i className="fa-solid fa-cloud-check"></i></div>
                    <h2 className="font-black text-lg text-gray-800 mb-1">Panel de Control Activo</h2>
                    <div className="w-full max-w-sm space-y-3 mt-6">
                        <button onClick={() => setAdminView('history')} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:border-blue-500 flex items-center justify-between">
                            <div className="flex items-center gap-3"><div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600"><i className="fa-solid fa-map-location-dot"></i></div>
                            <div className="text-left"><h3 className="font-bold text-sm">Historial Viajes</h3><p className="text-[10px] text-gray-500">Monitor en vivo</p></div></div>
                        </button>
                        <button onClick={() => setAdminView('users')} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                            <div className="flex items-center gap-3"><div className="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600"><i className="fa-solid fa-users"></i></div>
                            <div className="text-left"><h3 className="font-bold text-sm">Base de Datos</h3></div></div>
                        </button>
                        <button onClick={() => setAdminView('finances')} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                            <div className="flex items-center gap-3"><div className="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-purple-600"><i className="fa-solid fa-sack-dollar"></i></div>
                            <div className="text-left"><h3 className="font-bold text-sm">Finanzas y Pagos</h3></div></div>
                        </button>
                    </div>
                </div>
            );
            const renderHistory = () => (
                <div className="p-4 fade-in pb-20">
                    <h3 className="font-black text-gray-800 mb-3"><i className="fa-solid fa-list text-blue-600 mr-1"></i> Todos los Viajes</h3>
                    {loading ? <p>Cargando...</p> : trips.map(t => (
                        <div key={t.id} className="bg-white p-3 rounded-lg border shadow-sm mb-2 text-xs">
                            <div className="flex justify-between font-black"><span className="uppercase text-blue-600">{t.tipo}</span><span>{t.costo} COP</span></div>
                            <p className="text-[10px] text-gray-500">{new Date(t.fecha).toLocaleString()}</p>
                            <p className="font-bold mt-1">Cli: {t.clienteInfo?.nombre}</p>
                            {t.choferAsignado && <p className="font-bold text-green-600">Chofer: {t.choferAsignado.nombre}</p>}
                        </div>
                    ))}
                </div>
            );
            const renderFinances = () => {
                const totalBruto = trips.reduce((s, t) => s + (t.costo || 0), 0);
                const gananciaPlat = totalBruto * 0.15;
                return (
                    <div className="p-4 fade-in">
                        <div className="bg-white p-4 rounded-xl shadow-sm border mb-6 text-center">
                            <p className="text-[10px] font-bold text-gray-500 uppercase">Ingreso Bruto Global</p>
                            <h3 className="text-2xl font-black text-green-600 mb-2">{totalBruto.toLocaleString()} COP</h3>
                            <div className="border-t pt-2 mt-2">
                                <p className="text-[10px] font-bold text-gray-500 uppercase">Comisión Plataforma (15%)</p>
                                <h3 className="text-lg font-black text-purple-600">{gananciaPlat.toLocaleString()} COP</h3>
                            </div>
                        </div>
                    </div>
                );
            };
            return (
                <div className="flex flex-col h-full bg-gray-100 w-full relative">
                    <HeaderNav title={adminView === 'main' ? "Panel Maestro" : "Atrás"} onBack={adminView === 'main' ? goBack : () => setAdminView('main')} />
                    <div className="flex-1 overflow-y-auto">
                        {adminView === 'main' && renderMainMenu()}
                        {adminView === 'history' && renderHistory()}
                        {adminView === 'users' && <div className="p-4 text-center font-bold text-gray-500">Listado de usuarios activo en base de datos.</div>}
                        {adminView === 'finances' && renderFinances()}
                    </div>
                </div>
            );
        };
        function App() {
            const [view, setView] = useState('menu');
            const [user, setUser] = useState(null);
            useEffect(() => {
                const u = localStorage.getItem('motoubgrit_current'); 
                if(u) setUser(JSON.parse(u));
            }, []);
            const requireAuth = (desiredView, roleStr) => {
                if (user) setView(desiredView);
                else setView('auth_' + roleStr);
            };
            if(view === 'menu') return (
                <div className="flex flex-col h-full bg-[#0b0f19] w-full p-5 text-center relative overflow-y-auto fade-in">
                    <div className="absolute top-4 right-4 flex gap-2 z-20">
                        {!user && <button onClick={()=>setView('auth_admin')} className="bg-white/10 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold border border-white/20 flex items-center gap-1.5"><i className="fa-solid fa-shield-halved"></i> Admin</button>}
                        {user && <button onClick={()=>{localStorage.removeItem('motoubgrit_current'); setUser(null);}} className="bg-red-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1.5"><i className="fa-solid fa-right-from-bracket"></i> Salir</button>}
                    </div>
                    <div className="mt-12 mb-8 flex flex-col items-center">
                        <div className="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center mb-3 shadow-[0_0_25px_rgba(220,38,38,0.4)]">
                            <i className="fa-solid fa-motorcycle text-3xl text-white"></i>
                        </div>
                        <h1 className="text-2xl font-black text-white tracking-tight mb-1">Moto UBGrit</h1>
                        <p className="text-[7px] text-gray-400 font-bold tracking-[0.2em] uppercase text-center mt-1 leading-relaxed">
                            Tu traslado / Encomienda<br/>Mercado / Medicamento
                        </p>
                    </div>
                    <div className="space-y-3 w-full max-w-sm mx-auto pb-8 px-2">
                        {user?.role === 'admin' && <button onClick={()=>setView('admin_dash')} className="w-full bg-red-600 text-white font-black py-3.5 rounded-xl text-sm mb-4 shadow-lg border border-red-500">Panel Maestro</button>}
                        <button onClick={()=>requireAuth('moto', 'client')} className="w-full bg-white text-black font-black py-3.5 rounded-xl text-sm shadow-md flex items-center justify-center gap-2">
                            <i className="fa-solid fa-motorcycle text-gray-400"></i> Pedir Moto
                        </button>
                        <button onClick={()=>requireAuth('enco', 'store')} className="w-full bg-blue-600 text-white font-black py-3.5 rounded-xl text-sm shadow-md flex items-center justify-center gap-2">
                            <i className="fa-solid fa-box text-blue-200"></i> Encomiendas
                        </button>
                        <button onClick={()=>user?.role==='admin' ? setView('market') : requireAuth('market', 'client')} className="w-full bg-green-600 text-white font-black py-3 rounded-xl text-sm shadow-md flex flex-col items-center justify-center">
                            <div className="flex items-center gap-2"><i className="fa-solid fa-basket-shopping text-green-200"></i> Mercado en Casa</div>
                            <span className="text-[8px] font-bold text-green-200 mt-0.5">(Requiere Ingreso para el Envío)</span>
                        </button>
                        <button onClick={()=>Swal.fire('Próximamente', 'Módulo de farmacia en desarrollo.', 'info')} className="w-full bg-purple-600 text-white font-black py-3.5 rounded-xl text-sm shadow-md flex items-center justify-center gap-2">
                            <i className="fa-solid fa-pills text-purple-200"></i> Farmacia (Próximamente)
                        </button>
                        <div className="pt-6 mt-6 border-t border-gray-800">
                            <button onClick={()=>requireAuth('driver_dash', 'driver')} className="w-full bg-[#161b26] hover:bg-[#1f2636] transition-colors text-gray-500 py-3.5 rounded-xl font-bold text-xs border border-gray-800 shadow-inner flex items-center justify-center gap-2">
                                <i className="fa-solid fa-id-card text-gray-600"></i> Ingreso / Registro Conductor
                            </button>
                        </div>
                    </div>
                </div>
            );
            if(view === 'auth_admin') {
                return (
                    <div className="flex flex-col h-full bg-[#0b0f19] items-center justify-center p-6 fade-in">
                        <h2 className="text-white font-black text-2xl mb-6">Acceso Admin</h2>
                        <form onSubmit={(e)=>{e.preventDefault(); if(e.target.p.value==='Universal11!!'){const a={role:'admin', email:ADMIN_EMAIL, nombre:'Admin'}; setUser(a); localStorage.setItem('motoubgrit_current', JSON.stringify(a)); setView('admin_dash');}}} className="w-full max-w-sm space-y-4">
                            <input name="p" type="password" placeholder="Contraseña" className="w-full p-4 rounded-xl font-bold" />
                            <button type="submit" className="bg-red-600 text-white w-full py-4 rounded-xl font-black">Entrar</button>
                        </form>
                        <button onClick={()=>setView('menu')} className="text-gray-500 mt-6 font-bold">Volver</button>
                    </div>
                );
            }
            if(view.startsWith('auth_')) return <AuthScreen requestedRole={view.split('_')[1]} goBack={()=>setView('menu')} onLoginSuccess={(u)=>{setUser(u); localStorage.setItem('motoubgrit_current', JSON.stringify(u)); setView('menu');}} />;
            if(view === 'market') return <MercadoDashboard user={user} goBack={()=>setView('menu')} />;
            if(view === 'moto') return <TripPlanner user={user} type="client" goBack={()=>setView('menu')} />;
            if(view === 'enco') return <TripPlanner user={user} type="encomienda" goBack={()=>setView('menu')} />;
            if(view === 'admin_dash') return <AdminDashboard goBack={()=>setView('menu')} />;
            if(view === 'driver_dash') return <DriverDashboard user={user} goBack={()=>setView('menu')} />;
            return null;
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
