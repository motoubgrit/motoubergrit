<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; touch-action: manipulation; }
        ::-webkit-scrollbar { display: none; }
        #mobile-container { width: 100%; max-width: 430px; height: 100%; max-height: 100dvh; background-color: #f9fafb; position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseLogo { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-logo { animation: pulseLogo 2s infinite; }
        .custom-pin { filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5)); font-size: 30px; line-height: 30px; text-align: center; }
        @keyframes ringBell { 0%, 50%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(15deg); } 20%, 40% { transform: rotate(-15deg); } }
        .animate-ring { animation: ringBell 1s infinite; }
    </style>
</head>

        const inventory = [

            {c:"Frutas", n:"Lechoza", p:2500, i:"🍈"}, {c:"Frutas", n:"Melón", p:3000, i:"🍈"}, {c:"Frutas", n:"Guanábana", p:4500, i:"🍐"}, {c:"Frutas", n:"Guayaba", p:3000, i:"🍏"}, {c:"Frutas", n:"Parchita", p:4000, i:"🟡"}, {c:"Frutas", n:"Manzana", p:8000, i:"🍎"}, {c:"Frutas", n:"Cambur", p:2000, i:"🍌"}, {c:"Frutas", n:"Naranja", p:2500, i:"🍊"}, {c:"Frutas", n:"Fresa", p:8000, i:"🍓"}, {c:"Frutas", n:"Uva", p:10000, i:"🍇"}, {c:"Frutas", n:"Piña", p:3500, i:"🍍"}, {c:"Frutas", n:"Patilla", p:2000, i:"🍉"}, {c:"Frutas", n:"Limón", p:3000, i:"🍋"}, {c:"Frutas", n:"Mango", p:2500, i:"🥭"}, {c:"Frutas", n:"Pera", p:8000, i:"🍐"},
            {c:"Ramas, Hierbas y Especias", n:"Cilantro", p:2000, i:"🌿"}, {c:"Ramas, Hierbas y Especias", n:"Perejil", p:2000, i:"🌿"}, {c:"Ramas, Hierbas y Especias", n:"Ajoporro", p:2500, i:"🌱"}, {c:"Ramas, Hierbas y Especias", n:"Matadera", p:2000, i:"☘️"}, {c:"Ramas, Hierbas y Especias", n:"Albahaca", p:2000, i:"🌱"}, {c:"Ramas, Hierbas y Especias", n:"Romero", p:2500, i:"🌿"}, {c:"Ramas, Hierbas y Especias", n:"Tomillo", p:2500, i:"🌿"}, {c:"Ramas, Hierbas y Especias", n:"Menta", p:2000, i:"🍃"}, {c:"Ramas, Hierbas y Especias", n:"Orégano", p:2000, i:"🌿"}, {c:"Ramas, Hierbas y Especias", n:"Cebollín", p:2000, i:"🌱"}, {c:"Ramas, Hierbas y Especias", n:"Comino", p:2000, i:"🧂"}, {c:"Ramas, Hierbas y Especias", n:"Paprica", p:2500, i:"🌶️"}, {c:"Ramas, Hierbas y Especias", n:"Ajo en polvo", p:3000, i:"🧄"}, {c:"Ramas, Hierbas y Especias", n:"Clavito", p:2000, i:"🟤"}, {c:"Ramas, Hierbas y Especias", n:"Guayabita", p:2500, i:"🫒"}, {c:"Ramas, Hierbas y Especias", n:"Canela", p:3000, i:"🪵"}, {c:"Ramas, Hierbas y Especias", n:"Canela en polvo", p:3000, i:"🫙"}, {c:"Ramas, Hierbas y Especias", n:"Pimienta", p:3000, i:"🧂"}, {c:"Ramas, Hierbas y Especias", n:"Anís estrellado", p:3000, i:"🌟"}, {c:"Ramas, Hierbas y Especias", n:"Hoja de laurel", p:2000, i:"🍃"},
            {c:"Proteínas y Huevos", n:"Cartón de Huevos", p:16000, i:"🥚"}
        ];

        const catStyles = {
            "Hortalizas y Verduras": { bg: "bg-green-600", text: "text-green-700", border: "border-green-500", light: "bg-green-50" },
            "Tubérculos y Vituallas": { bg: "bg-amber-600", text: "text-amber-700", border: "border-amber-500", light: "bg-amber-50" },
            "Frutas": { bg: "bg-orange-500", text: "text-orange-700", border: "border-orange-500", light: "bg-orange-50" },
            "Ramas, Hierbas y Especias": { bg: "bg-teal-600", text: "text-teal-700", border: "border-teal-500", light: "bg-teal-50" },
            "Proteínas y Huevos": { bg: "bg-red-500", text: "text-red-700", border: "border-red-500", light: "bg-red-50" }
        };
        const catList = Object.keys(catStyles);

        // --- BASE DE DATOS LOCAL ---
        const getDB = (key) => { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } };
        const setDB = (key, data) => localStorage.setItem(key, JSON.stringify(data));

        // --- COMPONENTES DE DISEÑO ---
        const HeaderNav = ({ title, onBack, right }) => (
            <div className="bg-black text-white p-4 sticky top-0 z-50 flex items-center justify-between shadow-md h-16 shrink-0 w-full">
                {onBack ? ( <button onClick={onBack} className="text-xs font-bold bg-white/20 px-3 py-2 rounded hover:bg-white/30"><i className="fa-solid fa-arrow-left"></i> Volver</button> ) : <div className="w-16"></div>}
                <h2 className="text-sm font-black truncate flex-1 text-center">{title}</h2>
                <div className="w-16 flex justify-end">{right}</div>
            </div>
        );

        const Toast = ({ msg, isError }) => (
            <div className={`absolute top-20 left-1/2 transform -translate-x-1/2 z-[999] w-11/12 max-w-xs fade-in ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-4 py-3 rounded-xl shadow-2xl font-bold text-xs text-center pointer-events-none`}>
                {msg}
            </div>
        );

        const MercadoDashboard = ({ user, goBack, showToast }) => {
            const [view, setView] = useState('shop');
            const [catIdx, setCatIdx] = useState(0);
            const [cart, setCart] = useState({});
            const [currency, setCurrency] = useState('COP');

            const currentCat = catList[catIdx];
            const products = inventory.filter(p => p.c === currentCat);

            const formatQty = (q, name) => {
                const isEgg = name.toLowerCase().includes("huevo");
                if (q === 0.25) return isEgg ? "1/4 Cartón" : "250g";
                if (q === 0.5) return isEgg ? "Medio Cartón" : "Medio Kg";
                if (q === 0.75) return isEgg ? "3/4 Cartón" : "750g";
                if (q === 1) return isEgg ? "1 Cartón" : "1 Kg";
                return `${q} ${isEgg ? 'Cartones' : 'Kg/Und'}`;
            };

            const updateCart = (name, q, price) => {
                const cleanQ = Math.max(0, Math.round(q * 100) / 100);
                let finalPrice = price;
                
                // REGLA MATEMÁTICA: Si es huevo, calcula el precio automáticamente por 1/4 y Medio
                if (name.toLowerCase().includes("huevo")) {
                    if (cleanQ === 0.25) finalPrice = 4000;
                    else if (cleanQ === 0.5) finalPrice = 8000;
                    else if (cleanQ === 0.75) finalPrice = 12000;
                    else finalPrice = 16000;
                }
                
                setCart(prev => {
                    const newCart = { ...prev };
                    if (cleanQ <= 0) delete newCart[name];
                    else newCart[name] = { q: cleanQ, p: finalPrice };
                    return newCart;
                });
            };

            const cartSubtotal = Object.values(cart).reduce((sum, item) => sum + (item.p * item.q), 0);
            const deliveryFee = 5000; 
            const totalCOP = cartSubtotal > 0 ? cartSubtotal + deliveryFee : 0;
            const totalVES = (totalCOP / TASA_VES_COP).toFixed(2);
            const totalUSD = (totalCOP / TASA_USD_COP).toFixed(2);

            const submitOrder = async () => {
                if(totalCOP === 0) return;
                
                let itemsStr = Object.keys(cart).map(n => `${formatQty(cart[n].q, n)} ${n}`).join(", ");
                let payDetails = currency === 'COP' ? `${totalCOP.toLocaleString()} COP (Efectivo)` : currency === 'VES' ? `${totalVES} VES` : `$${totalUSD} USD`;
                
                // Agregar a pendientes para Choferes/Admin
                let pending = getDB('motoubgrit_pending');
                pending.push({
                    id: Date.now(), cliente: user.nombre, telefono: user.telefono,
                    origen: "Mercado VicRos", destino: user.direccion, precio: totalCOP,
                    tipo: 'Mercado', status: 'pending', time: Date.now()
                });
                setDB('motoubgrit_pending', pending);

                let wsMsg = `*🛒 MERCADO EN CASA*%0A*Cliente:* ${user.nombre}%0A*Tel:* ${user.telefono}%0A*Dir:* ${user.direccion}%0A%0A*PEDIDO:*%0A`;
                Object.keys(cart).forEach(n => {
                    wsMsg += `▪ ${formatQty(cart[n].q, n)} de ${n} - ${(cart[n].p * cart[n].q).toLocaleString()} COP%0A`;
                });
                wsMsg += `🛵 *Delivery:* ${deliveryFee.toLocaleString()} COP%0A`;
                wsMsg += `💵 *TOTAL A PAGAR:* ${payDetails}`;
                
                window.open(`https://wa.me/${ADMIN_PHONE}?text=${wsMsg}`, '_blank');
                setCart({});
                setView('success');
            };

            if (view === 'shop') return (
                <div className="flex flex-col h-full bg-gray-50 fade-in w-full">
                    <HeaderNav title="Mercado en Casa" onBack={goBack} right={<button onClick={()=>setView('cart')} className="bg-white text-green-700 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm border border-green-200">🛒 {Object.keys(cart).length}</button>} />
                    
                    <div className={`p-3 flex items-center justify-between shadow-sm shrink-0 ${catStyles[currentCat].light} border-b-4 ${catStyles[currentCat].border}`}>
                        <button onClick={()=>setCatIdx(Math.max(0, catIdx-1))} disabled={catIdx===0} className="p-2 text-xl opacity-70 disabled:opacity-30">⬅️</button>
                        <h2 className={`text-sm font-black text-center ${catStyles[currentCat].text}`}>{currentCat}</h2>
                        <button onClick={()=>setCatIdx(Math.min(catList.length-1, catIdx+1))} disabled={catIdx===catList.length-1} className="p-2 text-xl opacity-70 disabled:opacity-30">➡️</button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 pb-20">
                        <div className="grid grid-cols-2 gap-3">
                            {products.map(p => {
                                const q = cart[p.n]?.q || 0;
                                const isEgg = p.n.toLowerCase().includes("huevo");
                                const displayPrice = isEgg ? 16000 : p.p;
                                const style = catStyles[currentCat];
                                return (
                                    <div key={p.n} className="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center justify-between">
                                        <div className="text-4xl mb-2">{p.i}</div>
                                        <h3 className="font-bold text-xs text-center h-8 flex items-center">{p.n}</h3>
                                        <p className={`${style.text} font-black text-[11px] my-2`}>{displayPrice.toLocaleString()} COP {isEgg?'/Cartón':'/Kg'}</p>
                                        
                                        {q === 0 ? (
                                            <button onClick={()=>{updateCart(p.n, 0.25, displayPrice); showToast(`${p.n} agregado`, false)}} className={`w-full ${style.light} ${style.text} border ${style.border} py-1.5 rounded-lg text-xs font-bold`}>➕ Agregar</button>
                                        ) : (
                                            <div className="flex justify-between items-center w-full bg-gray-50 rounded-lg p-1 border">
                                                <button onClick={()=>updateCart(p.n, q-0.25, displayPrice)} className="px-2 text-red-500 font-bold">-</button>
                                                <span className="font-bold text-[10px]">{formatQty(q, p.n)}</span>
                                                <button onClick={()=>updateCart(p.n, q+0.25, displayPrice)} className={`px-2 ${style.text} font-bold`}>+</button>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {catIdx < catList.length - 1 ? (
                            <button onClick={()=>{document.querySelector('.overflow-y-auto').scrollTo(0,0); setCatIdx(catIdx+1)}} className={`w-full mt-6 py-4 rounded-xl font-bold shadow-sm border-2 ${catStyles[catList[catIdx+1]].text} ${catStyles[catList[catIdx+1]].border}`}>
                                Avanzar a {catList[catIdx+1]} ↓
                            </button>
                        ) : (
                            <button onClick={()=>setView('cart')} className="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg">
                                Ir al Carrito 🛒
                            </button>
                        )}
                    </div>
                </div>
            );

            if (view === 'cart') return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full relative">
                    <HeaderNav title="Carrito de Compras" onBack={()=>setView('shop')} />
                    
                    <div className="flex-1 overflow-y-auto p-4 pb-32">
                        <div className="bg-white rounded-xl shadow-sm p-4 mb-4">
                            {Object.keys(cart).length === 0 ? <p className="text-center text-gray-500 text-sm">Carrito vacío</p> : null}
                            {Object.keys(cart).map(n => (
                                <div key={n} className="flex justify-between items-center py-2 border-b text-xs">
                                    <span>{formatQty(cart[n].q, n)} {n}</span>
                                    <span className="font-bold">{(cart[n].p * cart[n].q).toLocaleString()} COP</span>
                                </div>
                            ))}
                            <div className="flex justify-between items-center py-3 text-xs text-orange-600 font-bold border-b">
                                <span>Delivery (La Grita)</span>
                                <span>+{deliveryFee.toLocaleString()} COP</span>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm mb-6">
                            <h3 className="font-bold text-xs text-center mb-3">Moneda de Pago</h3>
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                {['COP', 'VES', 'USD'].map(c => (
                                    <button key={c} onClick={()=>setCurrency(c)} className={`py-2 rounded-lg font-bold text-xs border-2 transition-colors ${currency === c ? 'bg-green-100 border-green-500 text-green-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>
                                        {c}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="p-4 bg-gray-50 rounded-xl text-center border border-gray-200">
                                <p className="text-[10px] font-bold text-gray-500 mb-1">TOTAL A PAGAR</p>
                                {currency === 'COP' && <p className="font-black text-green-700 text-2xl">{totalCOP.toLocaleString()} COP</p>}
                                {currency === 'VES' && <p className="font-black text-blue-700 text-2xl">{totalVES} VES</p>}
                                {currency === 'USD' && <p className="font-black text-emerald-700 text-2xl">${totalUSD} USD</p>}
                            </div>
                        </div>
                    </div>
                    
                    <div className="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-50">
                        <button onClick={submitOrder} disabled={totalCOP===0} className="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center gap-2 text-sm disabled:opacity-50">
                            📲 Enviar Pedido por WhatsApp
                        </button>
                    </div>
                </div>
            );

            if (view === 'success') return (
                <div className="flex flex-col h-full bg-green-50 fade-in w-full items-center justify-center p-6 text-center">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full border-t-8 border-green-600">
                        <div className="text-5xl mb-4">✅</div>
                        <h2 className="text-xl font-black text-green-800 mb-2">¡Pedido Enviado!</h2>
                        <p className="text-xs text-gray-600 mb-6">Tu pedido ha sido procesado con éxito y enviado por WhatsApp.</p>
                        <div className="space-y-3">
                            <button onClick={()=>{setCart({}); setView('shop');}} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow">🛒 Hacer otro pedido</button>
                            <button onClick={goBack} className="w-full border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-bold bg-gray-50">🏠 Volver al Menú</button>
                        </div>
                    </div>
                </div>
            );
        };

        const TripPlanner = ({ user, type, goBack, showToast }) => {
            const mapRef = useRef(null);
            const mapInst = useRef(null);
            const routeLayer = useRef(null);
            const markers = useRef([]);

            const [view, setView] = useState('planner');
            const [oText, setOText] = useState('');
            const [dText, setDText] = useState('');
            const [oCoords, setOCoords] = useState(null);
            const [dCoords, setDCoords] = useState(null);
            const [priceCOP, setPriceCOP] = useState(0);
            const [currency, setCurrency] = useState('COP');
            const [encDetails, setEncDetails] = useState({ queLleva: '', recibe: '', telRecibe: '' });
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (mapRef.current && !mapInst.current && view === 'planner') {
                    mapInst.current = L.map(mapRef.current, { zoomControl: false }).setView([8.1333, -71.9833], 15);
                    // Servidor Esri (Estable, sin error 403)
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { 
                        maxZoom: 19, attribution: 'Tiles &copy; Esri' 
                    }).addTo(mapInst.current);
                }
            }, [view]);

            const geocode = async (text, isOrigin) => {
                if(!text) return showToast("Escribe una referencia", true);
                setLoading(true);
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(text + ', La Grita, Táchira')}`);
                    const data = await res.json();
                    if(data && data.length > 0) {
                        const c = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                        if(isOrigin) { setOCoords(c); showToast("Origen fijado📍", false); } 
                        else { setDCoords(c); showToast("Destino fijado🏁", false); }
                        
                        mapInst.current.setView(c, 16);
                        const m = L.marker(c, { 
                            icon: L.divIcon({ className: 'custom-pin', html: isOrigin?'🟢':'🔴', iconSize:[30,30], iconAnchor:[15,30] }) 
                        }).addTo(mapInst.current);
                        markers.current.push(m);
                        
                        if (isOrigin && dCoords) calcRoute(c, dCoords);
                        else if (!isOrigin && oCoords) calcRoute(oCoords, c);
                    } else showToast("Lugar no encontrado", true);
                } catch(e) { showToast("Error de red", true); }
                setLoading(false);
            };

            const calcRoute = async (c1, c2) => {
                try {
                    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${c1[1]},${c1[0]};${c2[1]},${c2[0]}?overview=full&geometries=geojson`);
                    const data = await res.json();
                    if(data.routes && data.routes.length > 0) {
                        if(routeLayer.current) mapInst.current.removeLayer(routeLayer.current);
                        routeLayer.current = L.geoJSON(data.routes[0].geometry, { style: { color: '#2563eb', weight: 5, opacity: 0.9 } }).addTo(mapInst.current);
                        mapInst.current.fitBounds(routeLayer.current.getBounds(), { padding: [40, 40] });
                        
                        const distMeters = data.routes[0].distance;
                        let p = 5000; 
                        if(distMeters > 2000) p += Math.ceil((distMeters - 2000) / 1000) * 1500; 
                        setPriceCOP(p);
                    }
                } catch(e){}
            };

            const submitTrip = () => {
                if(!oCoords || !dCoords) return showToast("Fija Origen y Destino", true);
                if(type === 'encomienda' && view === 'planner') return setView('details');
                
                const isEnc = type === 'encomienda';
                const tripData = { 
                    id: Date.now(), cliente: user.nombre, telefono: user.telefono, 
                    origen: oText, destino: dText, precio: priceCOP, 
                    tipo: isEnc ? 'Encomienda' : 'Pasajero', detalles: isEnc ? encDetails : null, 
                    coords: {o: oCoords, d: dCoords}, status: 'pending', time: Date.now() 
                };
                
                let pending = getDB('motoubgrit_pending');

        const DriverDashboard = ({ user, goBack, showToast }) => {
            const [view, setView] = useState('dash');
            const [activeTrip, setActiveTrip] = useState(null);
            const [pendingTrip, setPendingTrip] = useState(null);
            const [history, setHistory] = useState([]);
            const [timeLeft, setTimeLeft] = useState(60);

            useEffect(() => {
                setHistory(getDB(`hist_${user.email}`));
                setActiveTrip(getDB(`act_${user.email}`)[0] || null);

                const timer = setInterval(() => {
                    if(activeTrip) return;
                    const p = getDB('motoubgrit_pending');
                    if(p.length > 0 && p[0].status === 'pending') {
                        setPendingTrip(p[0]);
                    } else {
                        setPendingTrip(null);
                    }
                }, 3000);
                return () => clearInterval(timer);
            }, [activeTrip]);

            useEffect(() => {
                let t;
                if(pendingTrip) {
                    setTimeLeft(60);
                    t = setInterval(() => {
                        setTimeLeft(prev => {
                            if(prev <= 1) { 
                                clearInterval(t); 
                                let p = getDB('motoubgrit_pending'); 
                                p.shift(); 
                                setDB('motoubgrit_pending', p); 
                                setPendingTrip(null); 
                                showToast("Tiempo agotado. Viaje reasignado.", true); 
                                return 0; 
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(t);
            }, [pendingTrip]);

            const acceptTrip = () => {
                if(!pendingTrip) return;
                let p = getDB('motoubgrit_pending'); 
                p = p.filter(t => t.id !== pendingTrip.id);
                setDB('motoubgrit_pending', p);
                
                setActiveTrip(pendingTrip); 
                setDB(`act_${user.email}`, [pendingTrip]);
                setPendingTrip(null);
            };

            const finishTrip = () => {
                if(!activeTrip) return;
                const h = [activeTrip, ...history]; 
                setHistory(h); 
                setDB(`hist_${user.email}`, h); 
                
                setActiveTrip(null); 
                setDB(`act_${user.email}`, []); 
                showToast("✅ Viaje completado. Ingreso guardado.", false);
            };

            const totalGen = history.reduce((s, t) => s + t.precio, 0);

            if(view === 'wallet') return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full">

                            <h3 className="text-3xl font-black text-green-400 mb-4">{totalGen.toLocaleString()} COP</h3>
                            <div className="bg-red-500/20 border border-red-500/50 p-3 rounded-xl">
                                <p className="text-[10px] font-bold text-red-300">A PAGAR ADMIN (10%)</p>
                                <p className="text-2xl font-black text-red-400">{(totalGen * 0.1).toLocaleString()} COP</p>
                            </div>
                        </div>
                        <h3 className="font-bold text-sm mb-3 px-1 text-gray-700">Historial Permanente</h3>
                        {history.length === 0 ? <p className="text-xs text-center text-gray-400">No hay carreras aún.</p> : null}

                            <div key={i} className="bg-white p-3 rounded-xl shadow-sm border mb-2 text-xs">
                                <div className="flex justify-between font-bold border-b pb-1 mb-1">
                                    <span>{t.tipo}</span>
                                    <span className="text-green-700">+{t.precio.toLocaleString()} COP</span>
                                </div>
                                <p className="text-[10px] text-gray-500">De: {t.origen}</p>
                                <p className="text-[10px] text-gray-500">A: {t.destino}</p>
                            </div>

                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full">
                    <div className="bg-black text-white p-4 sticky top-0 z-20 flex justify-between items-center shadow-md">

                            <h1 className="font-black text-sm">Panel Chofer</h1>
                            <p className="text-[9px] text-green-400 font-bold flex items-center gap-1"><span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> En Línea</p>
                        </div>
                        <button onClick={()=>setView('wallet')} className="text-xs bg-gray-800 px-3 py-1.5 rounded-lg font-bold border border-gray-700 hover:bg-gray-700">💰 Billetera</button>
                    </div>
                    
                    <div className="p-4 flex-1 overflow-y-auto">
                        {activeTrip ? (
                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden border-2 border-blue-500 mb-6">
                                <div className="bg-blue-600 p-2 text-white text-center font-black text-xs">VIAJE EN CURSO</div>
                                <div className="p-4 space-y-3 text-xs">
                                    <p className="font-bold text-sm">👤 {activeTrip.cliente} <a href={`tel:${activeTrip.telefono}`} className="text-blue-500 ml-2 underline">Llamar</a></p>
                                    <div className="bg-gray-50 p-3 rounded-lg border">
                                        <p className="font-bold mb-1">📍 De: {activeTrip.origen}</p>
                                        <p className="font-bold">🏁 Para: {activeTrip.destino}</p>
                                        {activeTrip.detalles && <p className="font-bold mt-2 text-purple-700 bg-purple-50 p-1 rounded">📦 Lleva: {activeTrip.detalles.queLleva}</p>}
                                    </div>
                                    <div className="text-center bg-green-50 p-3 rounded-lg border border-green-200">
                                        <p className="text-[10px] font-black text-gray-400 uppercase mb-1">Cobrar al cliente</p>
                                        <p className="text-2xl font-black text-green-700">{activeTrip.precio.toLocaleString()} COP</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-2">
                                        {activeTrip.coords?.o ? (
                                            <button onClick={()=>window.open(`https://www.google.com/maps?q=${activeTrip.coords.o[0]},${activeTrip.coords.o[1]}`, '_blank')} className="bg-gray-800 text-white py-3 rounded-xl font-bold text-xs shadow">Nav Origen</button>
                                        ) : <button disabled className="bg-gray-300 text-gray-500 py-3 rounded-xl font-bold text-xs">Sin GPS</button>}
                                        
                                        {activeTrip.coords?.d ? (
                                            <button onClick={()=>window.open(`https://www.google.com/maps?q=${activeTrip.coords.d[0]},${activeTrip.coords.d[1]}`, '_blank')} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-xs shadow">Nav Destino</button>
                                        ) : <button disabled className="bg-gray-300 text-gray-500 py-3 rounded-xl font-bold text-xs">Sin GPS</button>}
                                    </div>
                                    <button onClick={finishTrip} className="w-full bg-green-500 text-white py-4 rounded-xl font-black mt-3 shadow-lg hover:bg-green-600 text-sm">✅ Finalizar Viaje</button>
                                </div>
                            </div>
                        ) : pendingTrip ? (
                            <div className="bg-yellow-400 rounded-2xl shadow-xl p-5 text-center border-4 border-white animate-pulse">
                                <h3 className="font-black text-lg mb-1">¡NUEVO VIAJE!</h3>
                                <p className="text-xs font-bold text-red-700 mb-3 bg-red-100 rounded-full inline-block px-3 py-1">Aceptar en: {timeLeft}s</p>
                                <div className="bg-white p-3 rounded-lg text-left text-xs mb-4 shadow-inner">
                                    <p className="mb-1"><strong className="text-gray-500">De:</strong> {pendingTrip.origen}</p>
                                    <p><strong className="text-gray-500">Para:</strong> {pendingTrip.destino}</p>
                                    <p className="font-black text-green-600 text-xl mt-3 text-center border-t pt-2">{pendingTrip.precio.toLocaleString()} COP</p>
                                </div>
                                <button onClick={acceptTrip} className="w-full bg-black text-white py-4 rounded-xl font-black shadow-lg text-lg">Aceptar Viaje</button>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-64 opacity-50">
                                <i className="fa-solid fa-satellite-dish text-6xl mb-4 text-blue-500 animate-pulse"></i>
                                <p className="font-bold text-sm text-center text-gray-600">Buscando viajes cercanos...<br/>Estás En Línea.</p>
                            </div>
                        )}
                        <button onClick={goBack} className="w-full border-2 border-gray-300 text-gray-600 py-4 rounded-xl font-bold mt-4 text-xs bg-white">Salir al Menú Principal</button>
                    </div>
                </div>
            );
        };

        const AdminPanel = ({ goBack, showToast }) => {

            useEffect(() => {
                const load = () => {
                    setPendings(getDB('motoubgrit_pending'));
                    setDrivers(getDB('motoubgrit_users').filter(x => x.role === 'driver'));

                return () => clearInterval(t);

                setDrivers(u.filter(x => x.role === 'driver'));
                showToast("Estado de chofer actualizado", false);
            };

            return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full">
                    <HeaderNav 
                        title="Central Admin" 
                        onBack={goBack} 
                        right={
                            <div className="relative">

                                {pendings.length>0 && <span className="absolute -top-1 -right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 rounded-full">{pendings.length}</span>}
                            </div>
                        } 
                    />
                    <div className="p-4 flex-1 overflow-y-auto space-y-4">
                        <div className={`p-4 rounded-xl shadow border ${pendings.length>0?'bg-red-50 border-red-200':'bg-white'}`}>
                            <h3 className="font-black text-xs mb-3 text-gray-800">📡 Cola de Solicitudes</h3>
                            {pendings.length === 0 ? (
                                <p className="text-xs opacity-60 text-center py-2">Sin pedidos en este momento.</p>
                            ) : pendings.map(t => (
                                <div key={t.id} className="p-3 bg-white rounded-lg border mb-2 text-xs shadow-sm flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-blue-700">{t.tipo}</p>
                                        <p className="text-[10px] text-gray-600 truncate max-w-[200px]">{t.origen} → {t.destino}</p>
                                    </div>
                                    <p className="font-black text-green-600">{t.precio} COP</p>
                                </div>
                            ))}
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow border">
                            <h3 className="font-black text-xs mb-3 text-gray-800">Choferes Registrados</h3>
                            {drivers.length === 0 && <p className="text-xs text-gray-400 text-center">No hay choferes.</p>}
                            {drivers.map(d => (

        function App() {
            const [view, setView] = useState('splash');
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('');
            const [form, setForm] = useState({});
            const [toast, setToast] = useState(null);

            useEffect(() => {
                const u = localStorage.getItem('motoubgrit_current'); 
                if(u) setUser(JSON.parse(u));
                setTimeout(() => { if(view === 'splash') setView('menu'); }, 3000);
            }, []);

            const showToast = (msg, isError) => { 
                setToast({msg, isError}); 
                setTimeout(()=>setToast(null), 3500); 
            };

            const handleLogout = () => {
                localStorage.removeItem('motoubgrit_current');
                setUser(null);
                showToast("Sesión cerrada", false);
                setView('menu');
            };

            const nav = (u) => { 
                if(u.role==='driver') { 
                    if(!u.verified) showToast("Aún esperando aprobación del Admin", true); 
                    else setView('driver_dash'); 
                } 
                else if(u.role==='market') setView('market'); 
                else if(u.role==='store') setView('enco'); 
                else setView('client'); 
            };

            const handleAuth = (e) => {
                e.preventDefault();
                if(role === 'admin') { 
                    if(form.email === ADMIN_EMAIL && form.password === ADMIN_PASS) {
                        setView('admin'); showToast("Acceso Admin Concedido", false);
                    } else showToast("Credenciales inválidas", true); 
                    return; 
                }
                
                let users = getDB('motoubgrit_users');
                const exist = users.find(x => x.email === form.email && x.password === form.password);
                if(exist) { 
                    setUser(exist); localStorage.setItem('motoubgrit_current', JSON.stringify(exist)); 
                    nav(exist); showToast("Bienvenido", false); 
                } else if(form.nombre) { 
                    const nu = { ...form, role: role, verified: false }; 
                    users.push(nu); setDB('motoubgrit_users', users);
                    setUser(nu); localStorage.setItem('motoubgrit_current', JSON.stringify(nu));
                    if(role === 'driver') setView('driver_rules'); else nav(nu);
                } else showToast("Datos incompletos para registro", true);
            };

            if(view === 'splash') return (
                <div className="fixed inset-0 bg-[#0b0f19] flex flex-col items-center justify-center z-50">
                    <div className="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center mb-4 animate-logo shadow-[0_0_40px_rgba(220,38,38,0.6)]">
                        <i className="fa-solid fa-motorcycle text-4xl text-white"></i>
                    </div>
                    <h1 className="text-4xl font-black text-white mb-2 tracking-tighter">Moto UBGrit</h1>
                    <div className="bg-white/10 px-4 py-2 rounded-xl mt-2">
                        <p className="text-[10px] text-gray-200 font-bold uppercase tracking-widest text-center">Tu Traslado / Encomienda<br/>Mercado / Medicamento</p>
                        <p className="text-red-500 font-black text-center mt-1 text-xs tracking-widest">RÁPIDO Y SEGURO</p>
                    </div>
                </div>
            );
            
            if(view === 'menu') return (
                <div className="flex flex-col h-full bg-[#0b0f19] w-full p-6 text-center relative overflow-y-auto">
                    {toast && <Toast msg={toast.msg} isError={toast.isError} />}
                    
                    <div className="absolute top-4 right-4 flex gap-2 z-20">
                        <button onClick={()=>{setRole('admin');setView('auth');}} className="bg-white/10 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-white/20 transition-colors">⚙️ Admin</button>
                        {user && <button onClick={handleLogout} className="bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-red-700 shadow-lg">Salir</button>}
                    </div>

                    <div className="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-4 mt-10 shadow-[0_0_30px_rgba(220,38,38,0.4)]">
                        <i className="fa-solid fa-motorcycle text-3xl text-white"></i>
                    </div>
                    <h1 className="text-3xl font-black text-white mb-2">Moto UBGrit</h1>
                    
                    <div className="mb-8">
                        <p className="text-[10px] text-gray-300 font-bold uppercase tracking-widest">Tu Traslado / Encomienda / Mercado / Medicamento</p>
                        <p className="text-red-500 font-black tracking-widest mt-1 text-xs">RÁPIDO Y SEGURO</p>
                    </div>

                    <div className="space-y-3 w-full max-w-sm mx-auto mt-2">

                        <button onClick={()=>{setRole('store'); user?.role==='store'?nav(user):setView('auth');}} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-sm shadow-lg">📦 Local / Encomiendas</button>
                        <button onClick={()=>{setRole('market'); user?.role==='market'?nav(user):setView('auth');}} className="w-full bg-green-600 text-white font-bold py-4 rounded-xl text-sm shadow-lg">🛒 Mercado en Casa</button>
                        <button onClick={()=>showToast('Módulo de Farmacia en desarrollo.', false)} className="w-full bg-purple-600 text-white font-bold py-4 rounded-xl text-sm shadow">💊 Farmacia (Próximamente)</button>
                        
                        <div className="pt-4 mt-4 border-t border-gray-800">
                            <button onClick={()=>{setRole('driver'); user?.role==='driver'?nav(user):setView('auth');}} className="w-full bg-[#1a1a1a] text-gray-400 border border-gray-700 py-4 rounded-xl font-bold text-xs">Panel Conductor</button>
                        </div>
                    </div>
                </div>
            );

            if(view === 'auth') return (
                <div className="flex flex-col h-full bg-[#0b0f19] w-full overflow-y-auto">
                    <HeaderNav title={role==='admin'?"Acceso Admin": "Ingreso / Registro"} onBack={()=>setView('menu')} />
                    <div className="p-6">
                        <form onSubmit={handleAuth} className="bg-white p-6 rounded-3xl space-y-4 shadow-2xl">
                            <p className="text-xs text-center text-gray-500 font-bold mb-4">{role === 'admin' ? 'Ingresa credenciales exclusivas' : 'Si ya tienes cuenta, solo pon correo y clave.'}</p>
                            
                            <input required name="email" type="email" placeholder="Correo electrónico" onChange={e=>setForm({...form, email:e.target.value})} className="w-full p-4 border rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-red-500 outline-none" />
                            <input required name="password" type="password" placeholder="Contraseña" onChange={e=>setForm({...form, password:e.target.value})} className="w-full p-4 border rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-red-500 outline-none" />
                            
                            {role !== 'admin' && !user && (
                                <>
                                    <div className="border-t pt-4 mt-2">
                                        <p className="text-[10px] text-gray-400 font-bold mb-3 uppercase tracking-wider text-center">Datos para nuevos usuarios</p>
                                        <div className="space-y-4">
                                            <input name="nombre" placeholder="Nombre completo o Local" onChange={e=>setForm({...form, nombre:e.target.value})} className="w-full p-4 border rounded-xl bg-gray-50 text-sm outline-none" />
                                            <input name="telefono" type="tel" placeholder="WhatsApp" onChange={e=>setForm({...form, telefono:e.target.value})} className="w-full p-4 border rounded-xl bg-gray-50 text-sm outline-none" />
                                            {role === 'driver' && <input name="placa" placeholder="Placa de la Moto" onChange={e=>setForm({...form, placa:e.target.value})} className="w-full p-4 border rounded-xl bg-gray-50 text-sm outline-none" />}
                                            <textarea name="direccion" placeholder="Dirección exacta" onChange={e=>setForm({...form, direccion:e.target.value})} className="w-full p-4 border rounded-xl bg-gray-50 text-sm h-20 outline-none" />
                                        </div>
                                    </div>
                                </>
                            )}
                            
                            <button type="submit" className="w-full bg-red-600 text-white py-4 rounded-xl font-black text-lg shadow-lg mt-4">Acceder</button>
                            <button type="button" onClick={()=>setView('menu')} className="w-full bg-gray-100 text-gray-600 py-3 rounded-xl text-xs font-bold mt-2">← Cancelar y Volver</button>
                        </form>
                    </div>
                </div>
            );

            if(view === 'driver_rules') return (
                <div className="flex flex-col h-full bg-[#0b0f19] p-6 text-center justify-center">
                    <div className="bg-white p-6 rounded-3xl border-4 border-yellow-400 shadow-2xl">
                        <span className="text-5xl block mb-2">⚠️</span>
                        <h2 className="text-2xl font-black mb-4">REGLAS CHOFER</h2>
                        <div className="text-left text-xs font-bold space-y-3 mb-6 bg-gray-50 p-4 rounded-xl border">
                            <p>🟢 1. Cobrar estrictamente la tarifa de TRASLADO.</p>
                            <p>🟢 2. Casco (chofer y pasajero) y cesta son obligatorios.</p>
                            <p>🟢 3. Tienes 60s para aceptar un viaje antes de que pase a otro.</p>
                            <p className="text-red-600 bg-red-50 p-2 rounded">🔴 4. El pago del 10% es mensual. La app se bloqueará si hay impagos.</p>
                        </div>
                        <button onClick={()=>{window.open(`https://wa.me/${ADMIN_PHONE}?text=Registrado%20como%20chofer.%20Espero%20aprobacion.`, '_blank'); setView('menu');}} className="w-full bg-green-500 text-white py-4 rounded-xl font-black shadow-lg">Notificar Admin y Salir</button>
                    </div>
                </div>
            );

            if(view === 'client') return <TripPlanner user={user} type="client" goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'enco') return <TripPlanner user={user} type="encomienda" goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'market') return <MercadoDashboard user={user} goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'driver_dash') return <DriverDashboard user={user} goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'admin') return <AdminPanel goBack={()=>setView('menu')} showToast={showToast} />;
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
