                const cleanQ = Math.max(0, Math.round(q * 100) / 100);
                
                let finalPrice = productRef.p;
                if (productRef.type === 'gramos') {
                    finalPrice = (cleanQ / 1000) * productRef.p;
                } else if (name.toLowerCase().includes("huevo")) {
                    if (cleanQ === 0.25) finalPrice = 4000;
                    else if (cleanQ === 0.5) finalPrice = 8000;
                    else if (cleanQ === 0.75) finalPrice = 12000;
                    else finalPrice = 16000 * cleanQ;
                } else {
                     finalPrice = productRef.p * cleanQ;
                }

                setCart(prev => {
                    const newCart = { ...prev };
                    if (cleanQ <= 0 || (productRef.type === 'gramos' && cleanQ < productRef.min)) {
                        delete newCart[name];
                    } else {
                        let validatedQ = cleanQ;
                        if (productRef.max && validatedQ > productRef.max) validatedQ = productRef.max;
                        if (productRef.type === 'gramos') finalPrice = (validatedQ / 1000) * productRef.p;

                        newCart[name] = { q: validatedQ, p: finalPrice, ref: productRef };
                    }
                    return newCart;
                });
            };

            const cartSubtotal = Object.values(cart).reduce((sum, item) => sum + item.p, 0);
            const deliveryFee = 4000; 
            const totalCOP = cartSubtotal > 0 ? cartSubtotal + deliveryFee : 0;
            const totalVES = (totalCOP / TASA_VES_COP).toFixed(2);
            const totalUSD = (totalCOP / TASA_USD_COP).toFixed(2);

            const submitOrder = () => {
                let payDetails = currency === 'COP' ? `${totalCOP.toLocaleString()} COP` : currency === 'VES' ? `${totalVES} VES` : `$${totalUSD} USD`;
                let wsMsg = `*🛒 MERCADO EN CASA*%0A*Cliente:* ${user?.nombre || 'Invitado'}%0A*Tel:* ${user?.telefono || 'No registrado'}%0A*Dir:* ${user?.direccion || 'Acordar por chat'}%0A%0A*PEDIDO:*%0A`;
                Object.keys(cart).forEach(n => wsMsg += `▪ ${formatQty(cart[n].q, n)} de ${n} - ${cart[n].p.toLocaleString()} COP%0A`);
                wsMsg += `🛵 *Delivery:* ${deliveryFee.toLocaleString()} COP%0A💵 *TOTAL:* ${payDetails}`;
                
                window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(wsMsg)}`, '_blank');
                setCart({});
                setView('success');
            };

            if (view === 'shop') return (
                <div className="flex flex-col h-full bg-gray-50 fade-in w-full overflow-hidden">
                    <HeaderNav title="Mercado en Casa" onBack={goBack} right={<button onClick={()=>setView('cart')} className="bg-white text-green-700 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm border border-green-200">🛒 {Object.keys(cart).length}</button>} />
                    <div className={`p-3 flex items-center shadow-sm shrink-0 ${catStyles[currentCat].light} border-b-4 ${catStyles[currentCat].border} z-10 relative overflow-x-auto no-scrollbar`}>
                        <div className="flex gap-2 w-max px-2">
                            {catList.map((c, idx) => (
                                <button key={c} onClick={() => setCatIdx(idx)} className={`whitespace-nowrap px-4 py-2 rounded-full text-xs font-black shadow-sm transition-colors ${catIdx === idx ? catStyles[c].bg + ' text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
                                    {c}
                                </button>
                            ))}
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 pb-24 scroll-smooth bg-gray-50">
                        <div className="grid grid-cols-2 gap-3">
                            {products.map(p => {
                                const q = cart[p.n]?.q || 0;
                                const style = catStyles[currentCat];
                                return (
                                    <div key={p.n} className="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center justify-between">
                                        <div className="text-4xl mb-2">{p.i}</div>
                                        <h3 className="font-bold text-xs text-center h-8 flex items-center leading-tight">{p.n}</h3>
                                        <p className={`${style.text} font-black text-[10px] my-2 text-center bg-gray-50 px-2 py-1 rounded w-full`}>{getDisplayPrice(p)}</p>
                                        {q === 0 ? (
                                            <button onClick={()=>{updateCart(p.n, p.min || p.step, p); showToast(`${p.n} agregado`, false)}} className={`w-full ${style.light} ${style.text} border ${style.border} py-1.5 rounded-lg text-xs font-bold transition-transform active:scale-95`}>➕ Agregar</button>
                                        ) : (
                                            <div className="flex justify-between items-center w-full bg-gray-50 rounded-lg p-1 border">
                                                <button onClick={()=>updateCart(p.n, q-p.step, p)} className="px-3 text-red-500 font-black text-lg active:scale-90">-</button>
                                                <span className="font-bold text-[10px] text-center w-full">{formatQty(q, p.n)}</span>
                                                <button onClick={()=>updateCart(p.n, q+p.step, p)} className={`px-3 ${style.text} font-black text-lg active:scale-90`}>+</button>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        {catIdx < catList.length - 1 ? (
                            <button onClick={()=>{document.querySelector('.overflow-y-auto').scrollTo(0,0); setCatIdx(catIdx+1)}} className={`w-full mt-6 py-4 rounded-xl font-bold shadow-sm border-2 ${catStyles[catList[catIdx+1]].text} ${catStyles[catList[catIdx+1]].border} bg-white transition-transform active:scale-95`}>Avanzar a {catList[catIdx+1]} ↓</button>
                        ) : (
                            <button onClick={()=>setView('cart')} className="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg transition-transform active:scale-95">Ir al Carrito 🛒</button>
                        )}
                    </div>
                </div>
            );

            if (view === 'cart') return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full relative">
                    <HeaderNav title="Carrito de Compras" onBack={()=>setView('shop')} />
                    <div className="flex-1 overflow-y-auto p-4 pb-32">
                        <div className="bg-white rounded-xl shadow-sm p-4 mb-4 border border-gray-200">
                            {Object.keys(cart).length === 0 ? <p className="text-center text-gray-500 text-sm font-bold">Carrito vacío</p> : null}
                            {Object.keys(cart).map(n => (
                                <div key={n} className="flex justify-between items-center py-2 border-b text-xs border-dashed">
                                    <span>{formatQty(cart[n].q, n)} {n}</span><span className="font-bold text-gray-700">{cart[n].p.toLocaleString()} COP</span>
                                </div>
                            ))}
                            {cartSubtotal > 0 && (
                                <div className="flex justify-between items-center py-3 text-xs text-orange-600 font-bold">
                                    <span>Delivery (La Grita)</span><span>+{deliveryFee.toLocaleString()} COP</span>
                                </div>
                            )}
                        </div>
                        
                        <div className="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-200">
                            <h3 className="font-bold text-xs text-center mb-3 text-gray-700">Total a Pagar</h3>
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                {['COP', 'VES', 'USD'].map(c => (
                                    <button key={c} onClick={()=>setCurrency(c)} className={`py-2 rounded-lg font-bold text-xs border-2 transition-colors ${currency === c ? 'bg-green-100 border-green-500 text-green-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>{c}</button>
                                ))}
                            </div>
                            <div className="p-4 bg-gray-50 rounded-xl text-center border border-gray-200 shadow-inner">
                                {currency === 'COP' && <p className="font-black text-green-700 text-3xl">{totalCOP.toLocaleString()} <span className="text-sm">COP</span></p>}
                                {currency === 'VES' && <p className="font-black text-blue-700 text-3xl">{totalVES} <span className="text-sm">VES</span></p>}
                                {currency === 'USD' && <p className="font-black text-emerald-700 text-3xl">${totalUSD} <span className="text-sm">USD</span></p>}
                            </div>
                        </div>
                    </div>
                    <div className="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-50">
                        <button onClick={submitOrder} disabled={totalCOP===0} className="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 text-sm disabled:opacity-50 transition-transform active:scale-95">📲 Enviar Pedido a WhatsApp</button>
                    </div>
                </div>
            );

            if (view === 'success') return (
                <div className="flex flex-col h-full bg-green-50 fade-in w-full items-center justify-center p-6 text-center">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full border-t-8 border-green-600">
                        <div className="text-5xl mb-4">✅</div>
                        <h2 className="text-xl font-black text-green-800 mb-2">¡Pedido Enviado!</h2>
                        <p className="text-xs text-gray-600 mb-6 font-bold">Tu recibo ha sido enviado al administrador por WhatsApp.</p>
                        <div className="space-y-3">
                            <button onClick={()=>{setView('shop');}} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-green-700 transition-colors">🛒 Hacer otro pedido</button>
                            <button onClick={goBack} className="w-full border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-bold bg-gray-50 hover:bg-gray-100 transition-colors">🏠 Volver al Menú</button>
                        </div>
                    </div>
                </div>
            );
        };

        const TripPlanner = ({ user, type, goBack, showToast }) => {
            const mapRef = useRef(null);
            const mapInst = useRef(null);
            const routeLayer = useRef(null);
            const originMarker = useRef(null);
            const destMarker = useRef(null);
            const searchTimeout = useRef(null);

            const [view, setView] = useState('planner');
            const [oText, setOText] = useState('Centro La Grita');
            const [dText, setDText] = useState('');
            const [oCoords, setOCoords] = useState([8.1333, -71.9833]);
            const [dCoords, setDCoords] = useState(null);
            const [priceCOP, setPriceCOP] = useState(0);
            const [currency, setCurrency] = useState('COP');
            const [encDetails, setEncDetails] = useState({ queLleva: '', recibe: '', telRecibe: '' });
            const [precioRutaFija, setPrecioRutaFija] = useState(false);
            const [distanciaCalculadaKm, setDistanciaCalculadaKm] = useState(null);
            
            const [suggestions, setSuggestions] = useState({ type: null, list: [] });

            useEffect(() => {
                if (mapRef.current && !mapInst.current && view === 'planner') {
                    mapInst.current = L.map(mapRef.current, { zoomControl: false }).setView(oCoords, 15);
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { 
                        maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; MotoUBGrit' 
                    }).addTo(mapInst.current);
                }
            }, [view]);

            const actualizarPrecio = (distanciaRealMetros = 0) => {
                let pLista = null;
                const dUpper = dText.toUpperCase();
                const oUpper = oText.toUpperCase();
                
                Object.keys(RUTAS_FIJAS).forEach(clave => {
                    if(dUpper.includes(clave) || oUpper.includes(clave)) pLista = RUTAS_FIJAS[clave];
                });
                
                if (pLista) {
                    setPriceCOP(pLista);
                    setPrecioRutaFija(true);
                    if (distanciaRealMetros > 0) setDistanciaCalculadaKm((distanciaRealMetros / 1000).toFixed(1));
                } else {
                    setPrecioRutaFija(false);
                    let p = 4000; 
                    if (distanciaRealMetros > 0) {
                        const km = (distanciaRealMetros / 1000).toFixed(1);
                        setDistanciaCalculadaKm(km);
                        if (distanciaRealMetros > 3000) {
                            const kmExtra = (distanciaRealMetros - 3000) / 1000;
                            p += Math.round(kmExtra * 1500);
                        }
                    } else {
                        setDistanciaCalculadaKm(null);
                    }
                    setPriceCOP(p);
                }
            };

            useEffect(() => {
                if (dText || oText) actualizarPrecio();
            }, [dText, oText]);

            useEffect(() => {
                if(!mapInst.current) return;
                const getReverseGeocode = async (lat, lng, isOrigin) => {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                        const data = await res.json();
                        let name = data && data.address ? (data.address.road || data.display_name.split(',')[0]) : "Ubicación en mapa";
                        if(isOrigin) setOText(name); else setDText(name);
                    } catch(err) {}
                };

                if (oCoords) {
                    if (originMarker.current) mapInst.current.removeLayer(originMarker.current);
                    originMarker.current = L.marker(oCoords, { draggable: true, icon: L.divIcon({ className: 'custom-pin text-green-500', html: '<i class="fa-solid fa-circle-dot"></i>', iconSize:[30,30], iconAnchor:[15,30] }) }).addTo(mapInst.current);
                    originMarker.current.on('dragend', (e) => { 
                        const { lat, lng } = e.target.getLatLng(); 
                        setOCoords([lat, lng]); 
                        getReverseGeocode(lat, lng, true); 
                    });
                }
                
                if (dCoords) {
                    if (destMarker.current) mapInst.current.removeLayer(destMarker.current);
                    destMarker.current = L.marker(dCoords, { draggable: true, icon: L.divIcon({ className: 'custom-pin text-red-600', html: '<i class="fa-solid fa-location-dot"></i>', iconSize:[30,30], iconAnchor:[15,30] }) }).addTo(mapInst.current);
                    destMarker.current.on('dragend', (e) => { 
                        const { lat, lng } = e.target.getLatLng(); 
                        setDCoords([lat, lng]); 
                        getReverseGeocode(lat, lng, false); 
                    });
                }
                
                if (oCoords && dCoords) calcRoute(oCoords, dCoords);
            }, [oCoords, dCoords]);

            const handleTextChange = (e, isOrigin) => {
                const val = e.target.value;
                if(isOrigin) setOText(val); else setDText(val);

                if(val.length < 3) {
                    setSuggestions({ type: null, list: [] });
                    return;
                }

                if(searchTimeout.current) clearTimeout(searchTimeout.current);
                
                searchTimeout.current = setTimeout(async () => {
                    let results = [];
                    const valUpper = val.toUpperCase();
                    
                    Object.keys(RUTAS_FIJAS).forEach(clave => {
                        if(clave.includes(valUpper)) {
                            results.push({ name: clave, isFixed: true, price: RUTAS_FIJAS[clave] });
                        }
                    });

                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val + ', Tachira, Venezuela')}&limit=4`);
                        const data = await res.json();
                        if(data && data.length > 0) {
                            data.forEach(d => {
                                const shortName = d.display_name.split(',')[0];
                                if(!results.find(r => r.name.toUpperCase() === shortName.toUpperCase())) {
                                    results.push({ name: shortName + (d.display_name.split(',')[1]||''), lat: parseFloat(d.lat), lon: parseFloat(d.lon), isFixed: false });
                                }
                            });
                        }
                    } catch(e) {}

                    setSuggestions({ type: isOrigin ? 'origin' : 'dest', list: results.slice(0, 6) });
                }, 500);
            };

            const selectSuggestion = (s, isOrigin) => {
                if(isOrigin) setOText(s.name); else setDText(s.name);
                setSuggestions({ type: null, list: [] });

                if(s.lat && s.lon) {
                    const c = [s.lat, s.lon];
                    if(isOrigin) setOCoords(c); else setDCoords(c);
                    mapInst.current.setView(c, 15);
                } else {
                    actualizarPrecio();
                    const center = mapInst.current.getCenter();
                    if(isOrigin) setOCoords([center.lat, center.lng]); else setDCoords([center.lat, center.lng]);
                    showToast("Lugar de lista detectado. Mueve el pin si deseas precisión.", false);
                }
            };

            const forceSearchOnMap = async (text, isOrigin) => {
                setSuggestions({ type: null, list: [] });
                if(!text) return showToast("Escribe una dirección", true);
                
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(text + ', La Grita, Tachira')}`);
                    const data = await res.json();
                    if(data && data.length > 0) {
                        const c = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                        if(isOrigin) setOCoords(c); else setDCoords(c);
                        mapInst.current.setView(c, 15);
                    } else {
                        const resForanea = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(text + ', Tachira, Venezuela')}`);
                        const dataForanea = await resForanea.json();
                        if(dataForanea && dataForanea.length > 0) {
                            const c = [parseFloat(dataForanea[0].lat), parseFloat(dataForanea[0].lon)];
                            if(isOrigin) setOCoords(c); else setDCoords(c);
                            mapInst.current.setView(c, 14);
                        } else {
                            actualizarPrecio();
                            const center = mapInst.current.getCenter();
                            if(isOrigin) setOCoords([center.lat, center.lng]); else setDCoords([center.lat, center.lng]);
                            showToast("No encontrado. ¡Arrastra el pin en el mapa!", false);
                        }
                    }
                } catch(e) { 
                    actualizarPrecio(); 
                    showToast("Arrastra el pin directamente en el mapa.", false); 
                }
            };

            const calcRoute = async (c1, c2) => {
                try {
                    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${c1[1]},${c1[0]};${c2[1]},${c2[0]}?overview=full&geometries=geojson`);
                    const data = await res.json();
                    if(data.routes && data.routes.length > 0) {
                        if(routeLayer.current) mapInst.current.removeLayer(routeLayer.current);
                        routeLayer.current = L.geoJSON(data.routes[0].geometry, { style: { color: '#2563eb', weight: 6, opacity: 0.85 } }).addTo(mapInst.current);
                        mapInst.current.fitBounds(routeLayer.current.getBounds(), { padding: [50, 50] });
                        actualizarPrecio(data.routes[0].distance);
                    }
                } catch(e){
                    const R = 6371e3;
                    const φ1 = c1[0] * Math.PI/180;
                    const φ2 = c2[0] * Math.PI/180;
                    const Δφ = (c2[0]-c1[0]) * Math.PI/180;
                    const Δλ = (c2[1]-c1[1]) * Math.PI/180;
                    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    const distMetros = R * c * 1.3; 
                    actualizarPrecio(distMetros);
                }
            };

            const submitTrip = () => {
                if(type === 'encomienda' && view === 'planner') return setView('details');
                
                const isEnc = type === 'encomienda';
                let pVES = (priceCOP / TASA_VES_COP).toFixed(2);
                let pUSD = (priceCOP / TASA_USD_COP).toFixed(2);
                const infoKm = distanciaCalculadaKm ? ` (${distanciaCalculadaKm} Km)` : '';
                
                let msg = `*🚀 SOLICITUD MOTO UBGRIT*%0A*Cliente:* ${user.nombre}%0A*C.I:* ${user.cedula}%0A📍 *De:* ${oText}%0A🏁 *Para:* ${dText}%0A📏 *Distancia:* ${infoKm || 'Ubicación fijada'}%0A💵 *Costo:* ${priceCOP.toLocaleString()} COP | ${pVES} VES | $${pUSD} USD`;
                if(isEnc) msg += `%0A📦 *Lleva:* ${encDetails.queLleva}%0A👤 *Recibe:* ${encDetails.recibe} (${encDetails.telRecibe})`;
                
                window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
                setView('success');
            };

            return (
                <div className="flex flex-col h-full bg-gray-100 fade-in relative w-full">
                    {view !== 'success' && <HeaderNav title={type === 'encomienda' ? 'Ruta Encomienda' : 'Pedir Moto'} onBack={view==='planner'?goBack:()=>setView('planner')} />}
                    
                    {view === 'planner' && (
                        <>
                            <div className="absolute top-20 left-4 right-4 z-[400] space-y-2">
                                <div className="relative">
                                    <div className="flex bg-white rounded-xl shadow-lg border-2 border-gray-100 overflow-hidden">
                                        <span className="p-3 bg-green-50 text-green-500 text-xs flex items-center justify-center w-10"><i className="fa-solid fa-circle-dot"></i></span>
                                        <input placeholder="Origen (Escribe o mueve el pin)" value={oText} onChange={e=>handleTextChange(e, true)} className="flex-1 p-2 text-xs outline-none font-bold text-gray-700" />
                                        <button onClick={()=>forceSearchOnMap(oText, true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 text-xs font-bold transition-colors"><i className="fa-solid fa-search"></i></button>
                                    </div>
                                    {suggestions.type === 'origin' && suggestions.list.length > 0 && (
                                        <ul className="absolute top-full left-0 w-full bg-white mt-1 rounded-xl shadow-xl border border-gray-200 overflow-hidden z-[500] max-h-48 overflow-y-auto">
                                            {suggestions.list.map((s, i) => (
                                                <li key={i} onClick={()=>selectSuggestion(s, true)} className="p-3 border-b text-xs font-bold text-gray-700 hover:bg-blue-50 cursor-pointer flex justify-between">
                                                    <span>{s.isFixed ? '📍 ' : '🗺️ '}{s.name}</span>
                                                    {s.isFixed && <span className="text-blue-600 bg-blue-50 px-2 rounded-full">{s.price} COP</span>}
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                                
                                <div className="relative">
                                    <div className="flex bg-white rounded-xl shadow-lg border-2 border-gray-100 overflow-hidden">
                                        <span className="p-3 bg-red-50 text-red-500 text-xs flex items-center justify-center w-10"><i className="fa-solid fa-location-dot"></i></span>
                                        <input placeholder="Destino (Escribe o mueve el pin)" value={dText} onChange={e=>handleTextChange(e, false)} className="flex-1 p-2 text-xs outline-none font-bold text-gray-700" />
                                        <button onClick={()=>forceSearchOnMap(dText, false)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 text-xs font-bold transition-colors"><i className="fa-solid fa-search"></i></button>
                                    </div>
                                    {suggestions.type === 'dest' && suggestions.list.length > 0 && (
                                        <ul className="absolute top-full left-0 w-full bg-white mt-1 rounded-xl shadow-xl border border-gray-200 overflow-hidden z-[500] max-h-48 overflow-y-auto">
                                            {suggestions.list.map((s, i) => (
                                                <li key={i} onClick={()=>selectSuggestion(s, false)} className="p-3 border-b text-xs font-bold text-gray-700 hover:bg-blue-50 cursor-pointer flex justify-between">
                                                    <span>{s.isFixed ? '📍 ' : '🗺️️ '}{s.name}</span>
                                                    {s.isFixed && <span className="text-blue-600 bg-blue-50 px-2 rounded-full">{s.price} COP</span>}
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            </div>
                            
                            <div className="flex-1 relative z-0">
                                <div ref={mapRef} className="absolute inset-0 w-full h-full" onClick={()=>setSuggestions({type:null, list:[]})}></div>
                            </div>
                            
                            <div className="bg-white p-5 shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-[400] shrink-0 rounded-t-3xl pb-8 text-center relative border-t border-gray-200">
                                {priceCOP > 0 ? (
                                    <div className="mb-4 fade-in">
                                        <div className="flex items-center justify-center gap-2 mb-1">
                                            {precioRutaFija ? (
                                                <span className="text-[9px] font-black uppercase text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">Tarifa de Lista (+ Mapa GPS)</span>
                                            ) : (

                                <button onClick={submitTrip} className={`w-full text-white py-4 rounded-xl font-black shadow-lg transition-all ${priceCOP>0 ? 'bg-blue-600 hover:bg-blue-700 active:scale-95' : 'bg-gray-400 pointer-events-none'}`}>
                                    {type === 'encomienda' ? 'Continuar Encomienda 📦' : 'Pedir Moto Ahora 🏍️'}
                                </button>
                            </div>
                        </>
                    )}

                    {view === 'details' && (
                        <div className="p-5 space-y-4 flex-1">
                            <input placeholder="¿Qué llevas? (Ej: 2 Pizzas, Documentos)" value={encDetails.queLleva} onChange={e=>setEncDetails({...encDetails, queLleva:e.target.value})} className="w-full p-4 rounded-xl border border-gray-300 shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                            <input placeholder="Nombre de quien recibe" value={encDetails.recibe} onChange={e=>setEncDetails({...encDetails, recibe:e.target.value})} className="w-full p-4 rounded-xl border border-gray-300 shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                            <input placeholder="Teléfono destino" type="tel" value={encDetails.telRecibe} onChange={e=>setEncDetails({...encDetails, telRecibe:e.target.value})} className="w-full p-4 rounded-xl border border-gray-300 shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                            <button onClick={submitTrip} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg mt-4 active:scale-95 transition-transform">Confirmar y Solicitar Moto</button>
                        </div>
                    )}

                    {view === 'success' && (
                        <div className="flex flex-col h-full bg-blue-50 fade-in items-center justify-center p-6 text-center w-full absolute inset-0 z-[600]">
                            <div className="bg-white p-8 rounded-3xl shadow-xl w-full border-t-8 border-blue-600">
                                <div className="text-5xl mb-4">✅</div>
                                <h2 className="text-xl font-black text-blue-800 mb-2">¡Solicitud Enviada!</h2>
                                <p className="text-xs text-gray-600 mb-6 font-bold">Hemos redirigido tu solicitud directo al administrador por WhatsApp.</p>
                                <button onClick={()=>{setView('planner');setPriceCOP(0);setDCoords(null);setDText('');}} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow-md hover:bg-blue-700 transition-colors">📍 Pedir otro viaje</button>
                                <button onClick={goBack} className="w-full border-2 border-gray-200 py-3 rounded-xl font-bold text-gray-700 bg-gray-50 hover:bg-gray-100 transition-colors">🏠 Volver al Menú</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DriverDashboard = ({ user, goBack }) => {
            const hasDB = window.db !== null && window.db !== undefined;
            const [driverData, setDriverData] = useState(user);

            useEffect(() => {
                if (hasDB && user?.email) {
                    const unsub = window.fb.onSnapshot(window.fb.doc(window.db, "users", user.email), (doc) => {
                        if (doc.exists()) setDriverData(doc.data());
                    });
                    return () => unsub();
                }
            }, [hasDB, user]);

            const checkPaymentWarning = () => {
                if (!driverData?.nextPaymentDate) return null;
                const now = new Date().getTime();
                const nextDate = new Date(driverData.nextPaymentDate).getTime();
                const daysLeft = Math.ceil((nextDate - now) / (1000 * 60 * 60 * 24));

                if (driverData.subscriptionStatus === 'suspended') {
                    return (
                        <div className="absolute inset-0 z-50 bg-red-600 flex flex-col items-center justify-center text-white p-6 text-center">
                            <i className="fa-solid fa-triangle-exclamation text-6xl mb-4 animate-pulse"></i>
                            <h2 className="text-2xl font-black mb-2">Cuenta Suspendida</h2>
                            <p className="font-bold text-sm mb-6">Tu acceso ha sido bloqueado por falta de pago de la mensualidad o falta de aprobación inicial. Contacta al administrador.</p>
                            <button onClick={goBack} className="bg-white text-red-600 font-bold px-6 py-3 rounded-full shadow-lg active:scale-95 transition-transform">Volver al Menú</button>
                        </div>
                    );
                }

                if (daysLeft <= 2 && daysLeft >= 0) {
                    return (
                        <div className="bg-yellow-500 text-white p-3 text-xs font-bold text-center flex items-center justify-center gap-2 z-40 relative shadow-md">
                            <i className="fa-solid fa-clock"></i> ¡Atención! Faltan {daysLeft} días para tu pago mensual. Prepara tu cuota.
                        </div>
                    );
                } else if (daysLeft < 0) {
                    return (
                        <div className="bg-red-500 text-white p-3 text-xs font-bold text-center flex items-center justify-center gap-2 z-40 relative shadow-md">
                            <i className="fa-solid fa-circle-exclamation"></i> Tu pago mensual está vencido hace {Math.abs(daysLeft)} días. Evita la suspensión.
                        </div>
                    );
                }
                return null;
            };

            return (
                <div className="flex flex-col h-full bg-gray-100 w-full fade-in relative">
                    {checkPaymentWarning()}
                    {driverData?.subscriptionStatus === 'suspended' ? null : (
                        <>
                            <HeaderNav title="Panel Conductor" onBack={goBack} />
                            <div className="flex-1 flex flex-col items-center justify-center p-8 text-center">
                                <i className={`fa-solid fa-helmet-safety text-6xl mb-4 ${hasDB ? 'text-green-500' : 'text-gray-400'}`}></i>
                                <h2 className="font-black text-gray-800 text-lg mb-2">{hasDB ? 'Nube Conectada' : 'Modo WhatsApp Activo'}</h2>
                                <p className="text-xs text-gray-500 mb-6 font-bold">
                                    {hasDB 
                                        ? 'Estás conectado a la base de datos en tiempo real. Esperando viajes...' 
                                        : 'La conexión en tiempo real a Firebase está en pausa. Espera los viajes directamente por WhatsApp.'}
                                </p>
                                <button onClick={goBack} className="w-full border-2 border-gray-300 text-gray-700 py-3 px-6 rounded-xl font-bold hover:bg-gray-200 transition-colors">Volver al Menú</button>
                            </div>
                        </>
                    )}
                </div>
            );
        };
        
        const AdminDashboard = ({ goBack, showToast }) => {
            const hasDB = window.db !== null && window.db !== undefined;
            const [adminView, setAdminView] = useState('main'); // main, users, pending, finances
            const [usersList, setUsersList] = useState([]);

            useEffect(() => {
                if (!hasDB) {
                    setLoadingUsers(false);
                    return;
                }
                const fetchUsers = async () => {
                    setLoadingUsers(true);
                    try {
                        const querySnapshot = await window.fb.getDocs(window.fb.collection(window.db, "users"));
                        const users = [];
                        querySnapshot.forEach((doc) => {
                            users.push({ id: doc.id, ...doc.data() });
                        });
                        setUsersList(users);
                    } catch (error) {
                        console.error("Error fetching users:", error);
                        showToast("Error al cargar datos de Firebase", true);
                    }
                    setLoadingUsers(false);
                };
                
                // Fetch users for any sub-view to ensure we have fresh data
                if(adminView !== 'main') {
                    fetchUsers();
                }
            }, [hasDB, adminView]);

            const exportToExcel = () => {
                if (usersList.length === 0) {
                    showToast("No hay usuarios para exportar", true);
                    return;
                }
                
                const headers = ["Rol", "Nombre", "Cédula", "Teléfono", "Email", "Dirección"];
                const csvContent = [
                    headers.join(","),
                    ...usersList.map(u => [
                        u.role || 'Desconocido',
                        `"${u.nombre || ''}"`,
                        u.cedula || '',
                        `"${u.telefono || ''}"`,
                        u.email || u.id || '',
                        `"${(u.direccion || '').replace(/"/g, '""')}"`
                    ].join(","))
                ].join("\n");

                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }); 
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `Usuarios_MotoUBGrit_${new Date().toLocaleDateString()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Base de datos descargada", false);
            };

            const resetUserPassword = async (userEmail) => {
                const newPass = prompt(`NUEVA CONTRASEÑA\nIngrese la nueva clave para el usuario ${userEmail}:`);
                if (!newPass) return;
                
                if (newPass.length < 6) {
                    showToast("La contraseña debe tener al menos 6 caracteres", true);
                    return;
                }

                try {
                    const userRef = window.fb.doc(window.db, "users", userEmail);
                    await window.fb.updateDoc(userRef, { password: newPass });
                    showToast("Contraseña restablecida exitosamente", false);
                } catch (error) {
                    showToast("Error al actualizar la contraseña en la nube", true);
                }
            };

            const toggleDriverStatus = async (userEmail, currentStatus, action = 'toggle') => {
                let updates = {};
                
                if (action === 'approve') {
                    updates.subscriptionStatus = 'active';
                    updates.status = 'approved'; 
                    const nextMonth = new Date();
                    nextMonth.setDate(nextMonth.getDate() + 30);
                    updates.nextPaymentDate = nextMonth.toISOString();
                } else if (action === 'renew' || (action === 'toggle' && currentStatus === 'suspended')) {
                    updates.subscriptionStatus = 'active';
                    const nextMonth = new Date();
                    nextMonth.setDate(nextMonth.getDate() + 30);
                    updates.nextPaymentDate = nextMonth.toISOString();
                } else {
                    updates.subscriptionStatus = 'suspended';
                }

                try {
                    await window.fb.updateDoc(window.fb.doc(window.db, "users", userEmail), updates);
                    showToast(action === 'approve' ? "Conductor Aprobado" : (action === 'renew' ? "Mes renovado con éxito" : `Chofer ${updates.subscriptionStatus === 'active' ? 'Reactivado' : 'Suspendido'}`), false);
                    setUsersList(usersList.map(u => u.email === userEmail ? { ...u, ...updates } : u));
                } catch (e) {
                    showToast("Error actualizando estado", true);
                }
            };

            const renderMainMenu = () => (
                <div className="flex-1 p-4 pb-20 flex flex-col items-center w-full">
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mb-2 border-4 text-2xl shadow-md ${hasDB ? 'bg-green-100 border-green-500 text-green-500' : 'bg-red-100 border-red-500 text-red-500'}`}>
                        <i className={`fa-solid ${hasDB ? 'fa-cloud-check' : 'fa-shield-halved'}`}></i>
                    </div>
                    <h2 className="font-black text-lg text-gray-800 mb-1">{hasDB ? 'Panel de Control Activo' : 'Conexión a Firebase Pausada'}</h2>
                    <p className="text-[10px] text-gray-500 mb-8 font-bold px-4 text-center">
                        {hasDB ? 'Módulos en línea. Selecciona una categoría para gestionar tu negocio.' : 'Solo funciona en modo WhatsApp.'}
                    </p>

                    <div className="w-full max-w-sm space-y-3">
                        <button onClick={() => setAdminView('users')} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:border-blue-500 flex items-center justify-between transition-colors">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600"><i className="fa-solid fa-users"></i></div>
                                <div className="text-left">
                                    <h3 className="font-bold text-gray-800 text-sm">Base de Datos Usuarios</h3>
                                    <p className="text-[10px] text-gray-500">Ver clientes, choferes y exportar a Excel</p>
                                </div>
                            </div>
                            <i className="fa-solid fa-chevron-right text-gray-300"></i>
                        </button>
                        
                        <button onClick={() => setAdminView('pending')} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:border-orange-500 flex items-center justify-between transition-colors">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center text-orange-600"><i className="fa-solid fa-id-card-clip"></i></div>
                                <div className="text-left">
                                    <h3 className="font-bold text-gray-800 text-sm">Aprobar Choferes</h3>
                                    <p className="text-[10px] text-gray-500">Nuevas solicitudes de conductores</p>
                                </div>
                            </div>
                            <i className="fa-solid fa-chevron-right text-gray-300"></i>
                        </button>

                        <button onClick={() => showToast('Módulo en construcción', false)} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:border-green-500 flex items-center justify-between transition-colors opacity-70">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600"><i className="fa-solid fa-route"></i></div>
                                <div className="text-left">
                                    <h3 className="font-bold text-gray-800 text-sm">Historial de Viajes</h3>
                                    <p className="text-[10px] text-gray-500">Monitoreo de carreras (Próximamente)</p>
                                </div>
                            </div>
                            <i className="fa-solid fa-lock text-gray-300"></i>
                        </button>

                        <button onClick={() => setAdminView('finances')} className="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:border-purple-500 flex items-center justify-between transition-colors">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-purple-600"><i className="fa-solid fa-sack-dollar"></i></div>
                                <div className="text-left">
                                    <h3 className="font-bold text-gray-800 text-sm">Finanzas y Pagos</h3>
                                    <p className="text-[10px] text-gray-500">Ingresos totales y cobro a choferes</p>
                                </div>
                            </div>
                            <i className="fa-solid fa-chevron-right text-gray-300"></i>
                        </button>
                    </div>
                </div>
            );

            const renderUsersDatabase = () => (
                <div className="flex-1 flex flex-col w-full h-full bg-gray-50 p-2">
                    {!hasDB ? (
                        <p className="text-center text-xs text-red-500 py-4 font-bold">Conecta Firebase para ver la base de datos.</p>
                    ) : loadingUsers ? (
                        <p className="text-center text-xs text-gray-500 py-4 font-bold"><i className="fa-solid fa-spinner fa-spin mr-1"></i> Cargando usuarios...</p>
                    ) : usersList.length === 0 ? (
                        <p className="text-center text-xs text-gray-500 py-4 font-bold">Aún no hay usuarios registrados.</p>
                    ) : (
                        <ul className="space-y-2 pb-20">
                            {usersList.map((u, i) => (
                                <li key={i} className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm flex flex-col gap-1 relative">
                                    <div className="flex justify-between items-start">
                                        <span className={`text-[9px] font-black uppercase px-2 py-0.5 rounded ${u.role==='driver'?'bg-blue-100 text-blue-700':u.role==='admin'?'bg-red-100 text-red-700':u.role==='store'?'bg-purple-100 text-purple-700':'bg-gray-100 text-gray-700'}`}>{u.role || 'Usuario'}</span>
                                        <button onClick={()=>resetUserPassword(u.email || u.id)} className="text-blue-500 hover:bg-blue-50 p-1 rounded text-[10px] border border-transparent hover:border-blue-200"><i className="fa-solid fa-key"></i> Restaurar Clave</button>
                                    </div>
                                    <p className="font-bold text-sm text-gray-800">{u.nombre || 'Sin Nombre'}</p>
                                    <p className="text-[10px] text-gray-500"><i className="fa-solid fa-envelope w-4 text-center"></i> {u.email || u.id}</p>
                                    {u.telefono && <p className="text-[10px] text-gray-500"><i className="fa-solid fa-phone w-4 text-center"></i> {u.telefono}</p>}
                                    {u.cedula && <p className="text-[10px] text-gray-500"><i className="fa-solid fa-id-card w-4 text-center"></i> C.I: {u.cedula}</p>}
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );

            const renderPendingDrivers = () => {
                const pendingDrivers = usersList.filter(u => u.role === 'driver' && u.status === 'pending');
                return (
                    <div className="flex-1 flex flex-col w-full h-full bg-gray-50 p-4 overflow-y-auto">
                        <h3 className="font-black text-gray-800 mb-3"><i className="fa-solid fa-id-card-clip text-orange-400 mr-1"></i> Solicitudes Pendientes</h3>
                        <div className="space-y-3 pb-20">
                            {loadingUsers ? (
                                <p className="text-center text-xs text-gray-500 py-4 font-bold"><i className="fa-solid fa-spinner fa-spin mr-1"></i> Cargando...</p>
                            ) : pendingDrivers.length === 0 ? (
                                <p className="text-xs text-center text-gray-500 font-bold bg-white p-4 rounded-xl border border-gray-200">No hay solicitudes pendientes.</p>
                            ) : (
                                pendingDrivers.map(d => (
                                    <div key={d.id} className="bg-white p-4 rounded-xl border border-orange-200 shadow-sm relative">
                                        <div className="flex justify-between items-center mb-2">
                                            <p className="font-black text-sm text-gray-800">{d.nombre}</p>
                                            <span className="text-[9px] px-2 py-0.5 rounded font-black uppercase bg-orange-100 text-orange-700">En Revisión</span>
                                        </div>
                                        <p className="text-[10px] text-gray-500 font-bold mb-1">C.I: {d.cedula}</p>
                                        <p className="text-[10px] text-gray-500 font-bold mb-3"><i className="fa-brands fa-whatsapp text-green-500"></i> {d.whatsapp || d.telefono}</p>
                                        <button onClick={() => toggleDriverStatus(d.email, null, 'approve')} className="w-full bg-green-500 hover:bg-green-600 text-white text-xs font-black py-2 rounded-lg shadow-md transition-transform active:scale-95"><i className="fa-solid fa-check mr-1"></i> Aprobar Conductor</button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                );
            };

            const renderFinances = () => {
                const drivers = usersList.filter(u => u.role === 'driver' && u.status !== 'pending');
                return (
                    <div className="flex-1 flex flex-col w-full h-full bg-gray-50 p-4 overflow-y-auto">
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 text-center">
                            <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide">Ingreso Bruto Mensual (Carreras)</h3>
                            <div className="text-3xl font-black text-green-600 mt-1 flex items-center justify-center gap-2">
                                0 <span className="text-sm font-bold text-gray-400">COP</span>
                            </div>
                            <p className="text-[9px] text-gray-400 mt-1 italic">Conectando contador de viajes...</p>
                            <div className="flex justify-between items-center mt-3 pt-3 border-t border-gray-100">
                                <span className="text-xs font-bold text-gray-600">Porcentaje Administrador:</span>
                                <span className="text-sm font-black text-purple-600">-- %</span>
                            </div>
                        </div>

                        <h3 className="font-black text-gray-800 mb-3"><i className="fa-solid fa-helmet-safety text-gray-400 mr-1"></i> Control Mensualidad de Choferes</h3>
                        <div className="space-y-3 pb-20">
                            {loadingUsers ? (
                                <p className="text-center text-xs text-gray-500 py-4 font-bold"><i className="fa-solid fa-spinner fa-spin mr-1"></i> Cargando choferes...</p>
                            ) : drivers.length === 0 ? (
                                <p className="text-xs text-center text-gray-500 font-bold bg-white p-4 rounded-xl border border-gray-200">Aún no hay choferes aprobados.</p>
                            ) : (
                                drivers.map(d => {
                                    const now = new Date().getTime();
                                    const nextDate = d.nextPaymentDate ? new Date(d.nextPaymentDate).getTime() : now;
                                    const daysLeft = Math.ceil((nextDate - now) / (1000 * 60 * 60 * 24));
                                    const isSuspended = d.subscriptionStatus === 'suspended';
                                    const isOverdue = daysLeft < 0;

                                    return (
                                        <div key={d.id} className={`p-4 rounded-xl border-2 ${isSuspended ? 'bg-red-50 border-red-200' : isOverdue ? 'bg-yellow-50 border-yellow-400' : 'bg-white border-gray-100'} shadow-sm relative overflow-hidden`}>
                                            <div className="flex justify-between items-center mb-1">
                                                <p className="font-black text-sm text-gray-800">{d.nombre}</p>
                                                <span className={`text-[9px] px-2 py-0.5 rounded font-black uppercase tracking-wider ${isSuspended ? 'bg-red-600 text-white shadow-sm' : isOverdue ? 'bg-yellow-500 text-white shadow-sm' : 'bg-green-100 text-green-700'}`}>
                                                    {isSuspended ? 'Suspendido' : isOverdue ? 'Vencido' : 'Activo'}
                                                </span>
                                            </div>
                                            <p className="text-[10px] text-gray-500 font-bold mb-3">C.I: {d.cedula} • {d.telefono}</p>

                                            <div className={`text-[10px] p-2 rounded-lg font-bold mb-3 flex items-center gap-2 ${isOverdue && !isSuspended ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-50 text-gray-600'}`}>
                                                <i className="fa-regular fa-calendar-check text-lg"></i>
                                                <div>
                                                    <p>Próximo corte: <span className="text-gray-800">{d.nextPaymentDate ? new Date(d.nextPaymentDate).toLocaleDateString() : 'No definido'}</span></p>
                                                    {!isSuspended && (daysLeft >= 0 ? <p className="text-green-600">Quedan {daysLeft} días de suscripción</p> : <p className="text-red-600">Suscripción vencida hace {Math.abs(daysLeft)} días</p>)}
                                                </div>
                                            </div>
                                            
                                            <div className="flex gap-2">
                                                {isSuspended ? (
                                                    <button onClick={() => toggleDriverStatus(d.email, d.subscriptionStatus, 'renew')} className="flex-1 bg-green-500 hover:bg-green-600 text-white text-[10px] font-black py-2.5 rounded-lg shadow-md transition-transform active:scale-95"><i className="fa-solid fa-check-double mr-1"></i> Confirmar Pago y Reactivar</button>
                                                ) : (
                                                    <>
                                                        <button onClick={() => toggleDriverStatus(d.email, d.subscriptionStatus, 'toggle')} className="flex-1 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-[10px] font-black py-2 rounded-lg transition-transform active:scale-95"><i className="fa-solid fa-ban mr-1"></i> Suspender</button>
                                                        <button onClick={() => toggleDriverStatus(d.email, d.subscriptionStatus, 'renew')} className="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-[10px] font-black py-2 rounded-lg transition-transform active:scale-95"><i className="fa-solid fa-hand-holding-dollar mr-1"></i> Renovar 1 Mes</button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-gray-100 w-full fade-in relative">
                    <HeaderNav 
                        title={adminView === 'main' ? "Panel Maestro" : adminView === 'users' ? "Base de Datos" : adminView === 'pending' ? "Aprobar Choferes" : "Finanzas y Pagos"} 
                        onBack={adminView === 'main' ? goBack : () => setAdminView('main')} 
                        right={adminView === 'users' ? (
                            <button onClick={exportToExcel} disabled={!hasDB || usersList.length===0} className="text-[10px] font-bold bg-green-500 hover:bg-green-600 text-white px-2 py-1.5 rounded shadow disabled:opacity-50 transition-colors"><i className="fa-solid fa-file-excel"></i> Excel</button>
                        ) : null}
                    />
                    <div className="flex-1 overflow-y-auto">
                        {adminView === 'main' ? renderMainMenu() : adminView === 'users' ? renderUsersDatabase() : adminView === 'pending' ? renderPendingDrivers() : adminView === 'finances' ? renderFinances() : null}
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('splash');
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('');
            const [form, setForm] = useState({});
            const [toast, setToast] = useState(null);

            useEffect(() => {
                const u = localStorage.getItem('motoubgrit_current'); 
                if(u) setUser(JSON.parse(u));
                setTimeout(() => { if(view === 'splash') setView('menu'); }, 3000);
            }, []);

            const showToast = (msg, isError) => { setToast({msg, isError}); setTimeout(()=>setToast(null), 3500); };
            const handleLogout = () => { localStorage.removeItem('motoubgrit_current'); setUser(null); showToast("Sesión cerrada", false); setView('menu'); };
            const handleInputChange = (e) => setForm({...form, [e.target.name]: e.target.value});

            const nav = (u) => { 
                if(u.role==='admin') setView('admin');
                else if(u.role==='driver') setView('driver_dash'); 
                else if(u.role==='market') setView('market'); 
                else if(u.role==='store') setView('enco'); 
                else setView('client'); 
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                if(role === 'admin') { 
                    if(form.email === ADMIN_EMAIL && form.password === ADMIN_PASS) { nav({role: 'admin', email: ADMIN_EMAIL}); } 
                    else showToast("Credenciales inválidas", true); 
                    return; 
                }
                const isNewUser = !!(form.nombre && form.cedula);
                const authEmail = form.email;
                const authPass = form.password;

                if (!authEmail || !authPass) return showToast("Correo y contraseña son obligatorios", true);

                if (window.db) {
                    try {
                        const userRef = window.fb.doc(window.db, "users", authEmail);
                        if (isNewUser) {
                            const userData = { email: authEmail, password: authPass, nombre: form.nombre, cedula: form.cedula, telefono: form.telefono || "", direccion: form.direccion || "", role: role, createdAt: new Date().toISOString() };
                            if (role === 'driver') {
                                userData.status = 'pending';
                                userData.subscriptionStatus = 'suspended'; 
                            } else {
                                userData.status = 'active'; 
                            }
                            await window.fb.setDoc(userRef, userData);
                            
                            if (role === 'driver') {
                                showToast("Registro exitoso. Esperando aprobación.", false);
                                setView('menu'); 
                            } else {
                                setUser(userData);
                                localStorage.setItem('motoubgrit_current', JSON.stringify(userData));
                                showToast("Registrado y conectado", false);
                                nav(userData);
                            }

                        } else {
                            const docSnap = await window.fb.getDocs(window.fb.query(window.fb.collection(window.db, "users"), window.fb.where("email", "==", authEmail), window.fb.where("password", "==", authPass)));
                            if (!docSnap.empty) {
                                const dbUser = docSnap.docs[0].data();
                                if(dbUser.role === 'driver' && dbUser.status === 'pending') {
                                    Swal.fire('Cuenta Pendiente', 'Tu solicitud aún está siendo revisada por el administrador.', 'info');
                                    return; 
                                }
                                setUser(dbUser);
                                localStorage.setItem('motoubgrit_current', JSON.stringify(dbUser));
                                showToast("Bienvenido", false);
                                nav(dbUser);
                            } else { showToast("Correo o contraseña incorrectos", true); }
                        }
                    } catch (error) { showToast("Error de conexión con Firebase", true); }
                } else {
                    let nu = isNewUser ? { ...form, role: role } : { email: authEmail, nombre: "Usuario Autenticado", role: role };
                    setUser(nu); localStorage.setItem('motoubgrit_current', JSON.stringify(nu));
                    showToast("Modo Offline Activo", false); nav(nu);
                }
            };

            const handleMarketClick = () => {
                const formatter = new Intl.DateTimeFormat('en-US', { timeZone: "America/Caracas", hourCycle: "h23", weekday: 'short', hour: 'numeric' });
                const parts = formatter.formatToParts(new Date());
                const weekDay = parts.find(p => p.type === 'weekday').value; 
                const hour = parseInt(parts.find(p => p.type === 'hour').value, 10);

                let isAvailable = false;
                if (weekDay === 'Thu' && hour >= 12) isAvailable = true;
                if (weekDay === 'Fri') isAvailable = true;
                if (weekDay === 'Sat' && hour < 12) isAvailable = true;

                if (isAvailable) {
                    setRole('client'); 
                    if (user) {
                        setView('market'); 
                    } else {
                        setView('auth'); 
                    }
                } else {
                    Swal.fire({
                        icon: 'warning',
                        title: 'HORARIO CERRADO',
                        text: 'Para garantizar la distribución de rubros frescos y de calidad en la puerta de su casa, solo laboraremos en este horario: Jueves a partir del mediodía (12:00 PM) hasta el Sábado a mediodía (12:00 PM).',
                        confirmButtonColor: '#16a34a',
                        confirmButtonText: 'Entendido'
                    });
                }
            };

            if(view === 'splash') return (
                <div className="fixed inset-0 bg-[#0b0f19] flex flex-col items-center justify-center z-50 text-center">
                    <div className="w-28 h-28 bg-red-600 rounded-full flex items-center justify-center mb-6 animate-logo border-4 border-red-500"><i className="fa-solid fa-motorcycle text-5xl text-white"></i></div>
                    <h1 className="text-5xl font-black text-white mb-2 tracking-tighter">Moto UBGrit</h1>
                    <div className="bg-black/40 border border-gray-800 p-4 rounded-2xl mt-4 w-10/12 backdrop-blur-sm">
                        <p className="text-[11px] text-gray-300 font-black uppercase tracking-widest leading-relaxed">Tu Traslado / Encomienda<br/>Mercado / Medicamento</p>
                        <div className="mt-3 bg-red-600/20 border border-red-500/50 rounded-lg py-1.5"><p className="text-red-500 font-black text-[10px] tracking-[0.2em]">RÁPIDO Y SEGURO</p></div>
                    </div>
                </div>
            );
            
            if(view === 'menu') return (
                <div className="flex flex-col h-full bg-[#0b0f19] w-full p-5 text-center relative overflow-y-auto">
                    {toast && <Toast msg={toast.msg} isError={toast.isError} />}
                    <div className="absolute top-4 right-4 flex gap-2 z-20">
                        <button onClick={()=>{setRole('admin');setView('auth');}} className="bg-white/10 text-white px-3 py-2 rounded-lg text-[10px] font-black border border-white/20 hover:bg-white/20"><i className="fa-solid fa-shield-halved"></i> Admin</button>
                        {user && <button onClick={handleLogout} className="bg-red-600 text-white px-3 py-2 rounded-lg text-[10px] font-black shadow-md hover:bg-red-700"><i className="fa-solid fa-right-from-bracket"></i> Salir</button>}
                    </div>
                    <div className="mt-10 mb-6 flex flex-col items-center">
                        <div className="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center mb-4 shadow-[0_0_30px_rgba(220,38,38,0.4)] border-2 border-red-500"><i className="fa-solid fa-motorcycle text-3xl text-white"></i></div>
                        <h1 className="text-3xl font-black text-white mb-2 tracking-tight">Moto UBGrit</h1>
                        <p className="text-[9px] text-gray-400 font-black uppercase tracking-widest leading-relaxed">Tu Traslado / Encomienda<br/>Mercado / Medicamento</p>
                        <p className="text-red-500 font-black tracking-[0.2em] mt-2 text-[9px] bg-red-500/10 border border-red-500/30 px-3 py-1 rounded-full">RÁPIDO Y SEGURO</p>
                    </div>
                    <div className="space-y-3 w-full max-w-sm mx-auto pb-8">
                        <button onClick={()=>{setRole('client'); user?.role==='client'?nav(user):setView('auth');}} className="w-full bg-white text-black font-black py-4 rounded-xl text-sm shadow-xl flex items-center justify-center gap-3 transition-transform active:scale-95"><div className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><i className="fa-solid fa-person-biking text-gray-700"></i></div> Pedir Moto (Pasajero)</button>
                        <button onClick={()=>{setRole('store'); user?.role==='store'?nav(user):setView('auth');}} className="w-full bg-blue-600 text-white font-black py-4 rounded-xl text-sm shadow-xl flex items-center justify-center gap-3 transition-transform active:scale-95"><div className="w-8 h-8 bg-blue-700 rounded-full flex items-center justify-center"><i className="fa-solid fa-box text-white"></i></div> Local / Encomiendas</button>
                        
                        <button onClick={handleMarketClick} className="w-full bg-green-600 text-white font-black py-3 rounded-xl text-sm shadow-xl flex flex-col items-center justify-center gap-1 transition-transform active:scale-95">
                            <div className="flex items-center justify-center gap-3">
                                <div className="w-8 h-8 bg-green-700 rounded-full flex items-center justify-center"><i className="fa-solid fa-basket-shopping text-white"></i></div> 
                                <span>Mercado en Casa</span>
                            </div>
                            <span className="text-[10px] font-normal opacity-90 tracking-wide">(Entrada Directa Sin Registro)</span>
                        </button>
                        
                        <button onClick={()=>showToast('Módulo de Farmacia en desarrollo', false)} className="w-full bg-purple-600 text-white font-black py-4 rounded-xl text-sm shadow-xl opacity-90 flex items-center justify-center gap-3 transition-transform active:scale-95"><div className="w-8 h-8 bg-purple-700 rounded-full flex items-center justify-center"><i className="fa-solid fa-pills text-white"></i></div> Farmacia (Próximamente)</button>
                        <div className="pt-6 mt-6 border-t border-gray-800/50">
                            <button onClick={()=>{setRole('driver'); user?.role==='driver'?nav(user):setView('auth');}} className="w-full bg-[#1a1a1a] text-gray-400 border-2 border-gray-800 hover:border-gray-600 py-4 rounded-xl font-black text-xs transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-helmet-safety"></i> Panel Conductor</button>
                        </div>
                    </div>
                </div>
            );

            const [isLoginTab, setIsLoginTab] = useState(true);

            if(view === 'auth') return (
                <div className="flex flex-col h-full bg-[#0b0f19] w-full overflow-y-auto">
                    <HeaderNav title={role==='admin'?"Acceso Administrador": "Ingreso Seguro"} onBack={()=>setView('menu')} />
                    <div className="p-5 pb-20">
                        {role !== 'admin' && (
                            <div className="flex bg-gray-800 rounded-xl p-1 mb-4 shadow-inner">
                                <button onClick={()=>setIsLoginTab(true)} className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${isLoginTab ? 'bg-red-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-200'}`}>Ya tengo cuenta</button>
                                <button onClick={()=>setIsLoginTab(false)} className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${!isLoginTab ? 'bg-red-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-200'}`}>Soy Nuevo</button>
                            </div>
                        )}
                        <form onSubmit={handleAuth} className="bg-white p-6 rounded-3xl space-y-4 shadow-2xl relative border-t-8 border-red-600">
                            <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 w-12 h-12 bg-red-600 rounded-full flex items-center justify-center shadow-lg border-4 border-[#0b0f19]"><i className="fa-solid fa-lock text-white"></i></div>
                            <h2 className="text-center font-black text-lg text-gray-800 mt-2 mb-1">Tus Datos</h2>
                            <p className="text-[10px] text-center text-gray-500 font-bold mb-4">{role === 'admin' ? 'Solo personal autorizado.' : (isLoginTab ? 'Ingresa tus credenciales.' : 'Llena todos los datos.')}</p>
                            
                            <div className="space-y-3">
                                <input required name="email" type="email" placeholder="Correo electrónico" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                <input required name="password" type="password" placeholder="Contraseña" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                            </div>

                            {role !== 'admin' && !isLoginTab && (
                                <div className="border-t border-dashed border-gray-300 pt-4 mt-2 space-y-3 fade-in">
                                    <input name="nombre" required placeholder="Nombre completo o Local" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                    <input name="cedula" required type="number" placeholder="Cédula de Identidad" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                    <input name="telefono" required type="tel" placeholder="WhatsApp (Ej: 584141234567)" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                    <textarea name="direccion" required placeholder="Dirección exacta en La Grita" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-xs h-20 outline-none font-bold text-gray-700 focus:border-red-500 focus:bg-white transition-colors" />
                                </div>
                            )}
                            <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-xl font-black text-sm shadow-lg mt-4 transition-transform active:scale-95">Ingresar / Registrar</button>
                        </form>
                    </div>
                </div>
            );

            if(view === 'client') return <TripPlanner user={user} type="client" goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'enco') return <TripPlanner user={user} type="encomienda" goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'market') return <MercadoDashboard user={user} goBack={()=>setView('menu')} showToast={showToast} />;
            if(view === 'driver_dash') return <DriverDashboard user={user} goBack={()=>setView('menu')} />;
            if(view === 'admin') return <AdminDashboard goBack={()=>setView('menu')} showToast={showToast} />;
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
