<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Moto UBGrit</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; touch-action: manipulation; }
        ::-webkit-scrollbar { display: none; }
        #mobile-container { width: 100%; max-width: 430px; height: 100%; max-height: 100dvh; background-color: #f9fafb; position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseLogo { 0% { transform: scale(1); box-shadow: 0 0 20px rgba(220,38,38,0.5); } 50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(220,38,38,0.8); } 100% { transform: scale(1); box-shadow: 0 0 20px rgba(220,38,38,0.5); } }
        .animate-logo { animation: pulseLogo 2s infinite; }
        .custom-pin { filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5)); font-size: 34px; line-height: 34px; text-align: center; cursor: pointer; transition: transform 0.1s; }
        .custom-pin:active { transform: scale(1.2) translateY(-5px); }
        @keyframes ringBell { 0%, 50%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(15deg); } 20%, 40% { transform: rotate(-15deg); } }
        .animate-ring { animation: ringBell 1s infinite; }
        .radar-box { position: relative; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; margin: 0 auto; }
        .radar-box::before, .radar-box::after { content: ''; position: absolute; border-radius: 50%; border: 2px solid #3b82f6; width: 100%; height: 100%; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .radar-box::after { animation-delay: 1s; }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>
    <div id="mobile-container">
        <div id="root" class="w-full h-full"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const initCloudDB = async () => {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'moto-ubgrit-app';
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Exponer a React mediante variables globales seguras
                window.fb = { db, auth, appId, doc, getDoc, setDoc, updateDoc, onSnapshot, collection };
                window.dispatchEvent(new Event('firebase-ready'));
                console.log("Nube de Moto UBGrit conectada exitosamente.");
            } catch (error) {
                console.error("Error conectando a la nube:", error);
            }
        };
        initCloudDB();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TASA_USD_COP = 3000;
        const TASA_VES_COP = 3.0;
        const ADMIN_EMAIL = "motoubgrit@gmail.com";
        const ADMIN_PASS = "Universal11!!";
        const ADMIN_PHONE = "584140792843";

        // Funciones auxiliares para acceder a las rutas estrictas de la nube
        const getCol = (colName) => window.fb.collection(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', colName);
        const getDoc = (colName, docId) => window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', colName, String(docId));

        // INVENTARIO COMPRIMIDO (Para evitar cortes de código)
        const inventarioTexto = "Hortalizas y Verduras:Tomate|4000|🍅,Cebolla|3500|🧅,Ajo|12000|🧄,Zanahoria|3000|🥕,Remolacha|3000|🍠,Repollo|2500|🥬,Coliflor|4000|🥦,Acelga|2000|🥬,Pepino|2500|🥒,Brócoli|4500|🥦,Calabacín|2500|🥒,Pimentón|5000|🫑,Espinaca|3000|🥬,Ají dulce|4000|🌶️,Ají picante|5000|🔥,Apio España|3000|🥬;Tubérculos y Vituallas:Auyama|1500|🎃,Papa|3500|🥔,Yuca|2000|🍠,Plátano Verde|3000|🍌,Plátano Maduro|3000|🍌,Apio|4000|🌿;Frutas:Lechoza|2500|🍈,Melón|3000|🍈,Guanábana|4500|🍐,Guayaba|3000|🍏,Parchita|4000|🟡,Manzana|8000|🍎,Cambur|2000|🍌,Naranja|2500|🍊,Fresa|8000|🍓,Uva|10000|🍇,Piña|3500|🍍,Patilla|2000|🍉,Limón|3000|🍋,Mango|2500|🥭,Pera|8000|🍐;Ramas, Hierbas y Especias:Cilantro|2000|🌿,Perejil|2000|🌿,Ajoporro|2500|🌱,Matadera|2000|☘️,Albahaca|2000|🌱,Romero|2500|🌿,Tomillo|2500|🌿,Menta|2000|🍃,Orégano|2000|🌿,Cebollín|2000|🌱,Comino|2000|🧂,Paprica|2500|🌶️,Ajo en polvo|3000|🧄,Clavito|2000|🟤,Guayabita|2500|🫒,Canela|3000|🪵,Canela en polvo|3000|🫙,Pimienta|3000|🧂,Anís estrellado|3000|🌟,Hoja de laurel|2000|🍃;Proteínas y Huevos:Cartón de Huevos|16000|🥚";
        const inventory = [];
        inventarioTexto.split(';').forEach(catStr => { const [cName, itemsStr] = catStr.split(':'); itemsStr.split(',').forEach(itemStr => { const [n, p, i] = itemStr.split('|'); inventory.push({ c: cName, n, p: parseInt(p), i }); }); });

        const catStyles = { "Hortalizas y Verduras": { bg: "bg-green-600", text: "text-green-700", border: "border-green-500", light: "bg-green-50" }, "Tubérculos y Vituallas": { bg: "bg-amber-600", text: "text-amber-700", border: "border-amber-500", light: "bg-amber-50" }, "Frutas": { bg: "bg-orange-500", text: "text-orange-700", border: "border-orange-500", light: "bg-orange-50" }, "Ramas, Hierbas y Especias": { bg: "bg-teal-600", text: "text-teal-700", border: "border-teal-500", light: "bg-teal-50" }, "Proteínas y Huevos": { bg: "bg-red-500", text: "text-red-700", border: "border-red-500", light: "bg-red-50" } };
        const catList = Object.keys(catStyles);

        /* Componentes Globales UI */
        const HeaderNav = ({ title, onBack, right }) => (
            <div className="bg-black text-white p-4 sticky top-0 z-50 flex items-center justify-between shadow-md h-16 shrink-0 w-full">
                {onBack ? ( <button onClick={onBack} className="text-xs font-bold bg-white/20 px-3 py-2 rounded hover:bg-white/30 transition-colors"><i className="fa-solid fa-arrow-left"></i> Volver</button> ) : <div className="w-16"></div>}
                <h2 className="text-sm font-black truncate flex-1 text-center px-2">{title}</h2>
                <div className="w-16 flex justify-end">{right}</div>
            </div>
        );

        const Toast = ({ msg, isError }) => (
            <div className={`absolute top-20 left-1/2 transform -translate-x-1/2 z-[999] w-11/12 max-w-xs fade-in ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-4 py-3 rounded-xl shadow-2xl font-bold text-xs text-center pointer-events-none`}>
                {msg}
            </div>
        );

        const DriverTrackingCard = ({ assignedDriver, goBack }) => (
            <div className="bg-white p-6 rounded-3xl shadow-xl w-full border-t-8 border-green-500 text-center fade-in">
                <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3 border-4 border-green-500"><i className="fa-solid fa-user-check text-2xl text-green-600"></i></div>
                <h2 className="text-xl font-black text-gray-800 mb-1">¡Chofer Asignado!</h2>
                <p className="text-xs text-gray-500 mb-4">Tu conductor va en camino.</p>
                <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 text-left space-y-2 mb-4 shadow-inner">
                    <p className="text-sm"><i className="fa-solid fa-id-card text-blue-500 w-5 text-center"></i> <strong>Nombre:</strong> {assignedDriver.driverName}</p>
                    <p className="text-sm"><i className="fa-solid fa-fingerprint text-purple-500 w-5 text-center"></i> <strong>Cédula:</strong> {assignedDriver.driverCedula}</p>
                    <p className="text-sm"><i className="fa-solid fa-motorcycle text-red-500 w-5 text-center"></i> <strong>Moto:</strong> <span className="bg-yellow-300 px-2 py-0.5 rounded font-black text-black border border-yellow-500">{assignedDriver.driverPlaca}</span></p>
                </div>
                <button onClick={() => window.open(`https://wa.me/${assignedDriver.driverPhone}?text=Hola,%20soy%20el%20cliente%20de%20Moto%20UBGrit.%20Te%20estoy%20esperando.`, '_blank')} className="w-full bg-[#25D366] text-white py-3 rounded-xl font-bold shadow-lg mb-3 flex items-center justify-center gap-2 transition-transform active:scale-95"><i className="fa-brands fa-whatsapp text-xl"></i> Escribir al Chofer</button>
                <button onClick={goBack} className="w-full border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-bold bg-gray-50 hover:bg-gray-100 transition-colors">🏠 Volver al Menú</button>
            </div>
        );

        const MercadoDashboard = ({ user, goBack, showToast }) => {
            const [view, setView] = useState('shop');
            const [catIdx, setCatIdx] = useState(0);
            const [cart, setCart] = useState({});
            const [currency, setCurrency] = useState('COP');
            
            const [orderId, setOrderId] = useState(null);
            const [assignedDriver, setAssignedDriver] = useState(null);

            const currentCat = catList[catIdx];
            const products = inventory.filter(p => p.c === currentCat);

            const formatQty = (q, name) => {
                const isEgg = name.toLowerCase().includes("huevo");
                if (q === 0.25) return isEgg ? "1/4 Cartón" : "250g";
                if (q === 0.5) return isEgg ? "Medio Cartón" : "Medio Kg";
                if (q === 0.75) return isEgg ? "3/4 Cartón" : "750g";
                if (q === 1) return isEgg ? "1 Cartón" : "1 Kg";
                return `${q} ${isEgg ? 'Cartones' : 'Kg/Und'}`;
            };

            const updateCart = (name, q, price) => {
                const cleanQ = Math.max(0, Math.round(q * 100) / 100);
                let finalPrice = price;
                if (name.toLowerCase().includes("huevo")) {
                    if (cleanQ === 0.25) finalPrice = 4000;
                    else if (cleanQ === 0.5) finalPrice = 8000;
                    else if (cleanQ === 0.75) finalPrice = 12000;
                    else finalPrice = 16000;
                }
                setCart(prev => {
                    const newCart = { ...prev };
                    if (cleanQ <= 0) delete newCart[name];
                    else newCart[name] = { q: cleanQ, p: finalPrice };
                    return newCart;
                });
            };

            const cartSubtotal = Object.values(cart).reduce((sum, item) => sum + (item.p * item.q), 0);
            const deliveryFee = 5000; 
            const totalCOP = cartSubtotal > 0 ? cartSubtotal + deliveryFee : 0;
            const totalVES = (totalCOP / TASA_VES_COP).toFixed(2);
            const totalUSD = (totalCOP / TASA_USD_COP).toFixed(2);

            const submitOrder = async () => {
                if(totalCOP === 0 || !window.fb) return;
                
                const newId = Date.now().toString();
                setOrderId(newId);

                // Escribir en Firestore (Nube)
                try {
                    await window.fb.setDoc(getDoc('trips', newId), {
                        id: newId, cliente: user.nombre, telefono: user.telefono, cedula: user.cedula,
                        origen: "Mercado Central", destino: user.direccion, precio: totalCOP,
                        tipo: 'Mercado', status: 'pending', time: Date.now()
                    });

                    let payDetails = currency === 'COP' ? `${totalCOP.toLocaleString()} COP` : currency === 'VES' ? `${totalVES} VES` : `$${totalUSD} USD`;
                    let wsMsg = `*🛒 MERCADO EN CASA*%0A*Cliente:* ${user.nombre}%0A*C.I:* ${user.cedula}%0A*Tel:* ${user.telefono}%0A*Dir:* ${user.direccion}%0A%0A*PEDIDO:*%0A`;
                    Object.keys(cart).forEach(n => wsMsg += `▪ ${formatQty(cart[n].q, n)} de ${n} - ${(cart[n].p * cart[n].q).toLocaleString()} COP%0A`);
                    wsMsg += `🛵 *Delivery:* ${deliveryFee.toLocaleString()} COP%0A💵 *TOTAL:* ${payDetails}`;
                    
                    window.open(`https://wa.me/${ADMIN_PHONE}?text=${wsMsg}`, '_blank');
                    setCart({});
                    setView('success');
                } catch(e) {
                    showToast("Error conectando al servidor.", true);
                }
            };

            // Listener en tiempo real para asignación de chofer
            useEffect(() => {
                if (!orderId || view !== 'success' || assignedDriver || !window.fb) return;
                const unsub = window.fb.onSnapshot(getDoc('trips', orderId), (snap) => {
                    if (snap.exists() && snap.data().status === 'accepted') {
                        setAssignedDriver(snap.data());
                    }
                }, (err) => console.log(err));
                return () => unsub();
            }, [orderId, view, assignedDriver]);

            if (view === 'shop') return (
                <div className="flex flex-col h-full bg-gray-50 fade-in w-full overflow-hidden">
                    <HeaderNav title="Mercado en Casa" onBack={goBack} right={<button onClick={()=>setView('cart')} className="bg-white text-green-700 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm border border-green-200">🛒 {Object.keys(cart).length}</button>} />
                    <div className={`p-3 flex items-center justify-between shadow-sm shrink-0 ${catStyles[currentCat].light} border-b-4 ${catStyles[currentCat].border} z-10 relative`}>
                        <button onClick={()=>setCatIdx(Math.max(0, catIdx-1))} disabled={catIdx===0} className="p-2 text-xl opacity-70 disabled:opacity-30">⬅️</button>
                        <h2 className={`text-sm font-black text-center ${catStyles[currentCat].text}`}>{currentCat}</h2>
                        <button onClick={()=>setCatIdx(Math.min(catList.length-1, catIdx+1))} disabled={catIdx===catList.length-1} className="p-2 text-xl opacity-70 disabled:opacity-30">➡️</button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 pb-24 scroll-smooth bg-gray-50">
                        <div className="grid grid-cols-2 gap-3">
                            {products.map(p => {
                                const q = cart[p.n]?.q || 0;
                                const isEgg = p.n.toLowerCase().includes("huevo");
                                const displayPrice = isEgg ? 16000 : p.p;
                                const style = catStyles[currentCat];
                                return (
                                    <div key={p.n} className="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center justify-between">
                                        <div className="text-4xl mb-2">{p.i}</div>
                                        <h3 className="font-bold text-xs text-center h-8 flex items-center">{p.n}</h3>
                                        <p className={`${style.text} font-black text-[11px] my-2`}>{displayPrice.toLocaleString()} COP {isEgg?'/Cartón':'/Kg'}</p>
                                        {q === 0 ? (
                                            <button onClick={()=>{updateCart(p.n, 0.25, displayPrice); showToast(`${p.n} agregado`, false)}} className={`w-full ${style.light} ${style.text} border ${style.border} py-1.5 rounded-lg text-xs font-bold transition-transform active:scale-95`}>➕ Agregar</button>
                                        ) : (
                                            <div className="flex justify-between items-center w-full bg-gray-50 rounded-lg p-1 border">
                                                <button onClick={()=>updateCart(p.n, q-0.25, displayPrice)} className="px-2 text-red-500 font-bold active:scale-90">-</button>
                                                <span className="font-bold text-[10px] text-center w-full">{formatQty(q, p.n)}</span>
                                                <button onClick={()=>updateCart(p.n, q+0.25, displayPrice)} className={`px-2 ${style.text} font-bold active:scale-90`}>+</button>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        {catIdx < catList.length - 1 ? (
                            <button onClick={()=>{document.querySelector('.overflow-y-auto').scrollTo(0,0); setCatIdx(catIdx+1)}} className={`w-full mt-6 py-4 rounded-xl font-bold shadow-sm border-2 ${catStyles[catList[catIdx+1]].text} ${catStyles[catList[catIdx+1]].border} bg-white transition-transform active:scale-95`}>Avanzar a {catList[catIdx+1]} ↓</button>
                        ) : (
                            <button onClick={()=>setView('cart')} className="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg transition-transform active:scale-95">Ir al Carrito 🛒</button>
                        )}
                    </div>
                </div>
            );

            if (view === 'cart') return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full relative">
                    <HeaderNav title="Carrito de Compras" onBack={()=>setView('shop')} />
                    <div className="flex-1 overflow-y-auto p-4 pb-32">
                        <div className="bg-white rounded-xl shadow-sm p-4 mb-4 border border-gray-200">
                            {Object.keys(cart).length === 0 ? <p className="text-center text-gray-500 text-sm font-bold">Carrito vacío</p> : null}
                            {Object.keys(cart).map(n => (
                                <div key={n} className="flex justify-between items-center py-2 border-b text-xs border-dashed">
                                    <span>{formatQty(cart[n].q, n)} {n}</span><span className="font-bold text-gray-700">{(cart[n].p * cart[n].q).toLocaleString()} COP</span>
                                </div>
                            ))}
                            {cartSubtotal > 0 && (
                                <div className="flex justify-between items-center py-3 text-xs text-orange-600 font-bold">
                                    <span>Delivery (La Grita)</span><span>+{deliveryFee.toLocaleString()} COP</span>
                                </div>
                            )}
                        </div>
                        
                        <div className="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-200">
                            <h3 className="font-bold text-xs text-center mb-3 text-gray-700">Seleccione Moneda de Pago</h3>
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                {['COP', 'VES', 'USD'].map(c => (
                                    <button key={c} onClick={()=>setCurrency(c)} className={`py-2 rounded-lg font-bold text-xs border-2 transition-colors ${currency === c ? 'bg-green-100 border-green-500 text-green-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>{c}</button>
                                ))}
                            </div>
                            <div className="p-4 bg-gray-50 rounded-xl text-center border border-gray-200 shadow-inner">
                                <p className="text-[10px] font-bold text-gray-500 mb-1">TOTAL A PAGAR</p>
                                {currency === 'COP' && <p className="font-black text-green-700 text-3xl">{totalCOP.toLocaleString()} <span className="text-sm">COP</span></p>}
                                {currency === 'VES' && <p className="font-black text-blue-700 text-3xl">{totalVES} <span className="text-sm">VES</span></p>}
                                {currency === 'USD' && <p className="font-black text-emerald-700 text-3xl">${totalUSD} <span className="text-sm">USD</span></p>}
                            </div>
                        </div>
                    </div>
                    <div className="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-50">
                        <button onClick={submitOrder} disabled={totalCOP===0} className="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 text-sm disabled:opacity-50 transition-transform active:scale-95">📲 Confirmar y Enviar Pedido</button>
                    </div>
                </div>
            );

            if (view === 'success') return (
                <div className="flex flex-col h-full bg-green-50 fade-in w-full items-center justify-center p-6 text-center">
                    {assignedDriver ? (
                        <DriverTrackingCard assignedDriver={assignedDriver} goBack={goBack} />
                    ) : (
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full border-t-8 border-green-600">
                            <div className="radar-box mb-6"><i className="fa-solid fa-satellite-dish text-3xl text-blue-500 absolute z-10"></i></div>
                            <h2 className="text-xl font-black text-green-800 mb-2">Pedido Registrado</h2>
                            <p className="text-xs text-gray-600 mb-6 font-bold">Buscando chofer disponible para su entrega... Por favor espere aquí.</p>
                            <div className="space-y-3">
                                <button onClick={()=>{setCart({}); setView('shop');}} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-green-700 transition-colors">🛒 Hacer otro pedido</button>
                                <button onClick={goBack} className="w-full border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-bold bg-gray-50 hover:bg-gray-100 transition-colors">🏠 Volver al Menú</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const TripPlanner = ({ user, type, goBack, showToast }) => {
            const mapRef = useRef(null);
            const mapInst = useRef(null);
            const routeLayer = useRef(null);
            const originMarker = useRef(null);
            const destMarker = useRef(null);

            const [view, setView] = useState('planner');
            const [oText, setOText] = useState('');
            const [dText, setDText] = useState('');
            const [oCoords, setOCoords] = useState(null);
            const [dCoords, setDCoords] = useState(null);
            const [priceCOP, setPriceCOP] = useState(0);
            const [currency, setCurrency] = useState('COP');
            const [encDetails, setEncDetails] = useState({ queLleva: '', recibe: '', telRecibe: '' });
            
            const [orderId, setOrderId] = useState(null);
            const [assignedDriver, setAssignedDriver] = useState(null);

            useEffect(() => {
                if (mapRef.current && !mapInst.current && view === 'planner') {
                    mapInst.current = L.map(mapRef.current, { zoomControl: false }).setView([8.1333, -71.9833], 15);
                    // Mapas de alta calidad Esri (No se bloquean como OpenStreetMap)
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { 
                        maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; MotoUBGrit' 
                    }).addTo(mapInst.current);
                }
            }, [view]);

            useEffect(() => {
                if(!mapInst.current) return;
                const getReverseGeocode = async (lat, lng, isOrigin) => {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                        const data = await res.json();
                        let name = data && data.address ? (data.address.road || data.display_name.split(',')[0]) : "Ubicación fijada";
                        if(isOrigin) setOText(name); else setDText(name);
                    } catch(err) { 
                        if(isOrigin) setOText("Ubicación fijada en mapa"); else setDText("Ubicación fijada en mapa"); 
                    }
                };

                if (oCoords) {
                    if (originMarker.current) mapInst.current.removeLayer(originMarker.current);
                    originMarker.current = L.marker(oCoords, { draggable: true, icon: L.divIcon({ className: 'custom-pin text-green-500', html: '<i class="fa-solid fa-location-dot"></i>', iconSize:[30,30], iconAnchor:[15,30] }) }).addTo(mapInst.current);
                    originMarker.current.on('dragend', (e) => { const { lat, lng } = e.target.getLatLng(); setOCoords([lat, lng]); getReverseGeocode(lat, lng, true); });
                }
                
                if (dCoords) {
                    if (destMarker.current) mapInst.current.removeLayer(destMarker.current);
                    destMarker.current = L.marker(dCoords, { draggable: true, icon: L.divIcon({ className: 'custom-pin text-red-600', html: '<i class="fa-solid fa-location-dot"></i>', iconSize:[30,30], iconAnchor:[15,30] }) }).addTo(mapInst.current);
                    destMarker.current.on('dragend', (e) => { const { lat, lng } = e.target.getLatLng(); setDCoords([lat, lng]); getReverseGeocode(lat, lng, false); });
                }
                if (oCoords && dCoords) calcRoute(oCoords, dCoords);
            }, [oCoords, dCoords]);

            const geocode = async (text, isOrigin) => {
                if(!text) return showToast("Escribe una dirección para buscar", true);
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(text + ', La Grita, Tachira')}`);
                    const data = await res.json();
                    if(data && data.length > 0) {
                        const c = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                        if(isOrigin) { setOCoords(c); setOText(data[0].name || text); } else { setDCoords(c); setDText(data[0].name || text); }
                        mapInst.current.setView(c, 16);
                    } else {
                        const center = mapInst.current.getCenter();
                        if(isOrigin) { setOCoords([center.lat, center.lng]); setOText("Mueve el pin verde"); } 
                        else { setDCoords([center.lat, center.lng]); setDText("Mueve el pin rojo"); }
                        showToast("Dirección no encontrada. Arrastra el pin en el mapa.", false);
                    }
                } catch(e) { showToast("Error de conexión", true); }
            };

            const calcRoute = async (c1, c2) => {
                try {
                    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${c1[1]},${c1[0]};${c2[1]},${c2[0]}?overview=full&geometries=geojson`);
                    const data = await res.json();
                    if(data.routes && data.routes.length > 0) {
                        if(routeLayer.current) mapInst.current.removeLayer(routeLayer.current);
                        routeLayer.current = L.geoJSON(data.routes[0].geometry, { style: { color: '#3b82f6', weight: 5, opacity: 0.9 } }).addTo(mapInst.current);
                        mapInst.current.fitBounds(routeLayer.current.getBounds(), { padding: [40, 40] });
                        
                        const dist = data.routes[0].distance;
                        let p = 5000; 
                        // Ampliado a 5 Kilómetros como rango plano para cobrar 5000 COP
                        if(dist > 5000) p += Math.ceil((dist - 5000) / 1000) * 1500; 
                        setPriceCOP(p);
                    }
                } catch(e){}
            };

            const submitTrip = async () => {
                if(!oCoords || !dCoords) return showToast("Debes fijar Origen y Destino", true);
                if(type === 'encomienda' && view === 'planner') return setView('details');
                if(!window.fb) return;
                
                const newId = Date.now().toString();
                setOrderId(newId);
                const isEnc = type === 'encomienda';

                try {
                    await window.fb.setDoc(getDoc('trips', newId), { 
                        id: newId, cliente: user.nombre, telefono: user.telefono, cedula: user.cedula,
                        origen: oText, destino: dText, precio: priceCOP, 
                        tipo: isEnc ? 'Encomienda' : 'Pasajero', detalles: isEnc ? encDetails : null, 
                        coords: {o: oCoords, d: dCoords}, status: 'pending', time: Date.now() 
                    });

                    let pVES = (priceCOP / TASA_VES_COP).toFixed(2);
                    let pUSD = (priceCOP / TASA_USD_COP).toFixed(2);
                    let msg = `*🚀 SOLICITUD MOTO UBGRIT*%0A*Cliente:* ${user.nombre}%0A*C.I:* ${user.cedula}%0A📍 *De:* ${oText}%0A🏁 *Para:* ${dText}%0A💵 *Costo:* ${priceCOP} COP | ${pVES} VES | $${pUSD} USD`;
                    if(isEnc) msg += `%0A📦 *Lleva:* ${encDetails.queLleva}%0A👤 *Recibe:* ${encDetails.recibe} (${encDetails.telRecibe})`;
                    
                    window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
                    setView('success');
                } catch (e) {
                    showToast("Error conectando a la base de datos", true);
                }
            };

            // Listener en tiempo real de Firebase para el Cliente
            useEffect(() => {
                if (!orderId || view !== 'success' || assignedDriver || !window.fb) return;
                const unsub = window.fb.onSnapshot(getDoc('trips', orderId), (snap) => {
                    if (snap.exists() && snap.data().status === 'accepted') {
                        setAssignedDriver(snap.data());
                    }
                }, (err) => console.log(err));
                return () => unsub();
            }, [orderId, view, assignedDriver]);

            if(view === 'planner') return (
                <div className="flex flex-col h-full bg-gray-100 fade-in relative w-full">
                    <HeaderNav title={type === 'encomienda' ? 'Ruta Encomienda' : 'Pedir Moto'} onBack={goBack} />
                    
                    <div className="absolute top-20 left-4 right-4 z-[400] space-y-2">
                        <div className="flex bg-white rounded-xl shadow-lg border-2 border-gray-100 overflow-hidden">
                            <span className="p-3 bg-green-50 text-green-500 text-xs flex items-center justify-center w-10"><i className="fa-solid fa-circle-dot"></i></span>
                            <input placeholder="Origen (O toca el mapa)" value={oText} onChange={e=>setOText(e.target.value)} onFocus={()=>{if(!oCoords) setOCoords([8.1333, -71.9833])}} className="flex-1 p-2 text-xs outline-none font-bold text-gray-700" />
                            <button onClick={()=>geocode(oText, true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 text-xs font-bold transition-colors">Buscar</button>
                        </div>
                        <div className="flex bg-white rounded-xl shadow-lg border-2 border-gray-100 overflow-hidden">
                            <span className="p-3 bg-red-50 text-red-500 text-xs flex items-center justify-center w-10"><i className="fa-solid fa-location-dot"></i></span>
                            <input placeholder="Destino (O toca el mapa)" value={dText} onChange={e=>setDText(e.target.value)} onFocus={()=>{if(!dCoords) setDCoords([8.1333, -71.9833])}} className="flex-1 p-2 text-xs outline-none font-bold text-gray-700" />
                            <button onClick={()=>geocode(dText, false)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 text-xs font-bold transition-colors">Buscar</button>
                        </div>
                    </div>
                    
                    <div className="flex-1 relative z-0">
                        <div ref={mapRef} className="absolute inset-0 w-full h-full"></div>
                    </div>
                    
                    <div className="bg-white p-5 shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-[400] shrink-0 rounded-t-3xl pb-8 text-center relative border-t border-gray-200">
                        {priceCOP > 0 ? (
                            <div className="mb-4 fade-in">
                                <div className="flex justify-center gap-2 mb-2">
                                    {['COP','VES','USD'].map(c => <button key={c} onClick={()=>setCurrency(c)} className={`px-4 py-1.5 rounded-full text-[10px] font-bold transition-all ${currency===c?'bg-black text-white shadow-md scale-105':'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>{c}</button>)}
                                </div>
                                <h3 className="text-3xl font-black text-blue-600 tracking-tight">
                                    {currency==='COP' ? `${priceCOP.toLocaleString()} COP` : currency==='VES' ? `${(priceCOP/TASA_VES_COP).toFixed(2)} VES` : `$${(priceCOP/TASA_USD_COP).toFixed(2)} USD`}
                                </h3>
                            </div>
                        ) : (
                            <p className="text-xs font-bold text-gray-500 mb-4 bg-gray-50 p-3 rounded-xl border border-gray-200 shadow-inner">Escribe la calle o arrastra los pines en el mapa.</p>
                        )}
                        <button onClick={submitTrip} className={`w-full text-white py-4 rounded-xl font-black shadow-lg transition-all ${priceCOP>0 ? 'bg-blue-600 hover:bg-blue-700 active:scale-95' : 'bg-gray-400 pointer-events-none'}`}>
                            {type === 'encomienda' ? 'Continuar Encomienda 📦' : 'Pedir Moto Ahora 🏍️'}
                        </button>
                    </div>
                </div>
            );

            if (view === 'details') return (
                <div className="flex flex-col h-full bg-gray-50 fade-in w-full">
                    <HeaderNav title="Datos Encomienda" onBack={()=>setView('planner')} />
                    <div className="p-5 space-y-4">
                        <input placeholder="¿Qué llevas? (Ej: 2 Pizzas, Documentos)" value={encDetails.queLleva} onChange={e=>setEncDetails({...encDetails, queLleva:e.target.value})} className="w-full p-4 rounded-xl border border-gray-300 shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        <input placeholder="Nombre de quien recibe" value={encDetails.recibe} onChange={e=>setEncDetails({...encDetails, recibe:e.target.value})} className="w-full p-4 rounded-xl border border-gray-300 shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        <input placeholder="Teléfono destino" type="tel" value={encDetails.telRecibe} onChange={e=>setEncDetails({...encDetails, telRecibe:e.target.value})} className="w-full p-4 rounded-xl border border-gray-300 shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        <button onClick={submitTrip} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg mt-4 active:scale-95 transition-transform">Confirmar y Solicitar Moto</button>
                    </div>
                </div>
            );

            if (view === 'success') return (
                <div className="flex flex-col h-full bg-blue-50 fade-in items-center justify-center p-6 text-center w-full">
                    {assignedDriver ? (
                        <DriverTrackingCard assignedDriver={assignedDriver} goBack={()=>{setView('planner');setPriceCOP(0);setOCoords(null);setDCoords(null);setOText('');setDText(''); goBack();}} />
                    ) : (
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full border-t-8 border-blue-600">
                            <div className="radar-box mb-6"><i className="fa-solid fa-motorcycle text-4xl text-blue-500 absolute z-10"></i></div>
                            <h2 className="text-xl font-black text-blue-800 mb-2">¡Solicitud Enviada!</h2>
                            <p className="text-xs text-gray-600 mb-6 font-bold">Rastreando conductores en la nube... El sistema está asignando tu viaje.</p>
                            <button onClick={()=>{setView('planner');setPriceCOP(0);setOCoords(null);setDCoords(null);setOText('');setDText('');}} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-3 shadow-md hover:bg-blue-700 transition-colors">📍 Pedir otro viaje</button>
                            <button onClick={goBack} className="w-full border-2 border-gray-200 py-3 rounded-xl font-bold text-gray-700 bg-gray-50 hover:bg-gray-100 transition-colors">🏠 Volver al Menú</button>
                        </div>
                    )}
                </div>
            );
        };

        const DriverDashboard = ({ user, goBack, showToast }) => {
            const [view, setView] = useState('dash');
            const [activeTrip, setActiveTrip] = useState(null);
            const [pendingTrip, setPendingTrip] = useState(null);
            const [history, setHistory] = useState([]);
            const [timeLeft, setTimeLeft] = useState(60);
            const [ignoredTrips, setIgnoredTrips] = useState([]);

            // Escuchar viajes en la Nube
            useEffect(() => {
                if(!window.fb) return;
                const unsub = window.fb.onSnapshot(getCol('trips'), (snap) => {
                    const allTrips = snap.docs.map(d => d.data());
                    
                    // Buscar viaje activo de este chofer
                    const myActive = allTrips.find(t => t.status === 'accepted' && t.driverEmail === user.email);
                    setActiveTrip(myActive || null);

                    // Buscar historial del chofer
                    const myHistory = allTrips.filter(t => t.status === 'completed' && t.driverEmail === user.email).sort((a,b) => b.time - a.time);
                    setHistory(myHistory);

                    // Buscar viajes pendientes nuevos (ignora los que dejó pasar 60s)
                    if(!myActive) {
                        const newPending = allTrips.find(t => t.status === 'pending' && !ignoredTrips.includes(t.id));
                        setPendingTrip(newPending || null);
                    } else {
                        setPendingTrip(null);
                    }
                }, (err) => console.log(err));
                return () => unsub();
            }, [ignoredTrips, user.email]);

            // Temporizador de 60 Segundos para aceptar viaje
            useEffect(() => {
                let t;
                if(pendingTrip && !activeTrip) {
                    setTimeLeft(60);
                    t = setInterval(() => {
                        setTimeLeft(prev => {
                            if(prev <= 1) { 
                                clearInterval(t); 
                                setIgnoredTrips([...ignoredTrips, pendingTrip.id]); // Lo pasa al siguiente chofer
                                setPendingTrip(null); 
                                showToast("Tiempo agotado. Viaje reasignado.", true); 
                                return 0; 
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(t);
            }, [pendingTrip, activeTrip]);

            const acceptTrip = async () => {
                if(!pendingTrip || !window.fb) return;
                try {
                    await window.fb.updateDoc(getDoc('trips', pendingTrip.id), { 
                        status: 'accepted', driverEmail: user.email, driverName: user.nombre, 
                        driverPhone: user.telefono, driverPlaca: user.placa, driverCedula: user.cedula 
                    });
                    showToast("¡Viaje Aceptado! El cliente fue notificado.", false);
                } catch (e) { showToast("Alguien tomó este viaje", true); }
            };

            const finishTrip = async () => {
                if(!activeTrip || !window.fb) return;
                try {
                    await window.fb.updateDoc(getDoc('trips', activeTrip.id), { status: 'completed' });
                    showToast("✅ Viaje completado.", false);
                } catch (e) { showToast("Error al finalizar", true); }
            };

            const totalGen = history.reduce((s, t) => s + t.precio, 0);

            if(view === 'wallet') return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full">
                    <HeaderNav title="Mi Billetera" onBack={()=>setView('dash')} />
                    <div className="p-5 flex-1 overflow-y-auto pb-20">
                        <div className="bg-black p-5 rounded-3xl text-white text-center shadow-2xl mb-6 border-t-4 border-yellow-400">
                            <p className="text-[10px] uppercase font-bold text-gray-400 mb-1 tracking-widest">Total Generado</p>
                            <h3 className="text-4xl font-black text-green-400 mb-4">{totalGen.toLocaleString()} COP</h3>
                            <div className="bg-red-500/20 border border-red-500/50 p-4 rounded-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 bg-red-600 text-white text-[9px] font-black px-2 py-1 rounded-bl-lg">DEUDA</div>
                                <p className="text-xs font-bold text-red-300 mb-1">A PAGAR ADMIN (10%)</p>
                                <p className="text-3xl font-black text-red-400">{(totalGen * 0.1).toLocaleString()} COP</p>
                            </div>
                        </div>
                        <h3 className="font-bold text-sm mb-3 px-2 text-gray-700 flex items-center gap-2"><i className="fa-solid fa-list-check text-blue-500"></i> Historial de Viajes</h3>
                        {history.length === 0 ? <p className="text-xs text-center text-gray-400 bg-white p-4 rounded-xl border border-dashed">Aún no tienes viajes completados.</p> : null}
                        {history.map((t,i) => (
                            <div key={i} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-3 text-xs">
                                <div className="flex justify-between font-black border-b border-gray-100 pb-2 mb-2">
                                    <span className="text-gray-800">{t.tipo}</span><span className="text-green-600 bg-green-50 px-2 py-1 rounded">+{t.precio.toLocaleString()} COP</span>
                                </div>
                                <p className="text-[11px] text-gray-500 mb-1"><i className="fa-solid fa-circle-dot text-green-500 w-4"></i> {t.origen}</p>
                                <p className="text-[11px] text-gray-500"><i className="fa-solid fa-location-dot text-red-500 w-4"></i> {t.destino}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full bg-gray-100 fade-in w-full relative">
                    <div className="bg-black text-white p-4 sticky top-0 z-20 flex justify-between items-center shadow-lg">
                        <div><h1 className="font-black text-sm tracking-wide">Panel Chofer</h1><p className="text-[10px] text-green-400 font-bold flex items-center gap-1.5 mt-0.5"><span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> {user.nombre}</p></div>
                        <button onClick={()=>setView('wallet')} className="text-xs bg-gray-800 px-4 py-2 rounded-xl font-bold border border-gray-700 hover:bg-gray-700 shadow-inner flex items-center gap-2"><i className="fa-solid fa-wallet text-yellow-400"></i> Billetera</button>
                    </div>
                    <div className="p-4 flex-1 overflow-y-auto pb-20">
                        {activeTrip ? (
                            <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-500 mb-6 relative">
                                <div className="bg-blue-600 p-3 text-white text-center font-black text-xs tracking-widest flex items-center justify-center gap-2"><i className="fa-solid fa-motorcycle animate-bounce"></i> VIAJE EN CURSO</div>
                                <div className="p-5 space-y-4 text-sm">
                                    <div className="flex items-center justify-between border-b pb-3">
                                        <div>
                                            <p className="font-black text-gray-800"><i className="fa-solid fa-user text-gray-400 mr-1"></i> {activeTrip.cliente}</p>
                                            <p className="text-[10px] text-gray-500 mt-1 font-bold">C.I: {activeTrip.cedula}</p>
                                        </div>
                                        <a href={`https://wa.me/${activeTrip.telefono}`} target="_blank" className="bg-[#25D366] text-white p-3 rounded-full shadow-md hover:scale-105 transition-transform"><i className="fa-brands fa-whatsapp text-xl"></i></a>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-2 relative shadow-inner">
                                        <p className="font-bold text-xs"><i className="fa-solid fa-circle-dot text-green-500 w-4"></i> {activeTrip.origen}</p>
                                        <div className="w-0.5 h-4 bg-gray-300 ml-1.5"></div>
                                        <p className="font-bold text-xs"><i className="fa-solid fa-location-dot text-red-500 w-4"></i> {activeTrip.destino}</p>
                                        {activeTrip.detalles && <div className="mt-3 bg-purple-100 p-3 rounded-lg border border-purple-200"><p className="font-black text-purple-800 text-[10px] uppercase mb-1">📦 Lleva Encomienda:</p><p className="font-bold text-xs text-purple-900">{activeTrip.detalles.queLleva}</p></div>}
                                    </div>
                                    <div className="text-center bg-green-50 p-4 rounded-xl border border-green-200 shadow-sm">
                                        <p className="text-[10px] font-black text-gray-500 uppercase mb-1">Cobrar al cliente</p>
                                        <p className="text-3xl font-black text-green-700">{activeTrip.precio.toLocaleString()} <span className="text-sm">COP</span></p>
                                    </div>
                                    <button onClick={finishTrip} className="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-black mt-4 shadow-xl text-sm transition-transform active:scale-95"><i className="fa-solid fa-check-double mr-2"></i> FINALIZAR VIAJE</button>
                                </div>
                            </div>
                        ) : pendingTrip ? (
                            <div className="bg-yellow-400 rounded-3xl shadow-2xl p-6 text-center border-4 border-white animate-pulse">
                                <div className="text-4xl mb-2">🔔</div>
                                <h3 className="font-black text-2xl mb-1 text-black tracking-tight">¡NUEVO VIAJE!</h3>
                                <p className="text-xs font-black text-white mb-4 bg-red-600 rounded-full inline-block px-4 py-1.5 shadow-inner">Aceptar en: {timeLeft}s</p>
                                <div className="bg-white p-4 rounded-xl text-left text-xs mb-6 shadow-md border-b-4 border-gray-200">
                                    <p className="mb-2 flex items-start gap-2"><i className="fa-solid fa-circle-dot text-green-500 mt-0.5"></i> <span className="font-bold text-gray-700">{pendingTrip.origen}</span></p>
                                    <p className="flex items-start gap-2"><i className="fa-solid fa-location-dot text-red-500 mt-0.5"></i> <span className="font-bold text-gray-700">{pendingTrip.destino}</span></p>
                                    <div className="mt-4 pt-3 border-t border-dashed border-gray-300 text-center">
                                        <p className="text-[10px] text-gray-400 font-bold uppercase mb-1">Tarifa Estimada</p>
                                        <p className="font-black text-green-600 text-3xl">{pendingTrip.precio.toLocaleString()} <span className="text-sm">COP</span></p>
                                    </div>
                                </div>
                                <button onClick={acceptTrip} className="w-full bg-black text-white py-5 rounded-2xl font-black shadow-xl text-lg hover:bg-gray-900 transition-transform active:scale-95"><i className="fa-solid fa-bolt text-yellow-400 mr-2"></i> ACEPTAR VIAJE</button>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-[60vh] opacity-60">
                                <div className="relative mb-6">
                                    <i className="fa-solid fa-satellite-dish text-7xl text-blue-500 z-10 relative"></i>
                                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-blue-400 rounded-full opacity-20 animate-ping"></div>
                                </div>
                                <p className="font-black text-lg text-gray-800 text-center tracking-tight">Buscando viajes...</p>
                                <p className="font-bold text-xs text-gray-500 text-center mt-1">Estás En Línea en la Nube y listo para recibir solicitudes.</p>
                            </div>
                        )}
                    </div>
                    <div className="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] pb-8">
                        <button onClick={goBack} className="w-full border-2 border-gray-300 text-gray-600 py-3.5 rounded-xl font-bold text-xs bg-gray-50 hover:bg-gray-100 transition-colors"><i className="fa-solid fa-arrow-right-from-bracket mr-2"></i> Salir al Menú Principal</button>
                    </div>
                </div>
            );
