<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto UBGrit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4RaeKy1IjcAKK6tJtSD5-hxAbhra6wEU",
            authDomain: "moto-ubgrit.firebaseapp.com",
            projectId: "moto-ubgrit",
            storageBucket: "moto-ubgrit.firebasestorage.app",
            messagingSenderId: "1079394065391",
            appId: "1:1079394065391:web:6744ccdaa2a26a344bf41a"
        };
        const app = initializeApp(firebaseConfig);
        const db = window.db = getFirestore(app);
    </script>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [view, setView] = useState('menu');

            const handleMercadoClick = () => {
                // Configuramos el reloj estrictamente a la zona horaria de Venezuela
                const formatter = new Intl.DateTimeFormat('en-US', { 
                    timeZone: "America/Caracas", 
                    hourCycle: "h23", 
                    weekday: 'short', 
                    hour: 'numeric' 
                });
                
                const parts = formatter.formatToParts(new Date());
                const weekDay = parts.find(p => p.type === 'weekday').value; 
                const hour = parseInt(parts.find(p => p.type === 'hour').value, 10);

                let isAvailable = false;

                // Jueves desde las 12, Viernes completo, Sábado hasta las 11:59 AM
                if (weekDay === 'Thu' && hour >= 12) isAvailable = true;
                if (weekDay === 'Fri') isAvailable = true;
                if (weekDay === 'Sat' && hour < 12) isAvailable = true;

                if (isAvailable) {
                    setView('mercado');
                } else {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Horario de Mercado en Casa',
                        text: 'Para garantizar la distribución de rubros de calidad en la puerta de su casa, solo laboraremos en este horario: Jueves a partir del mediodía (12:00 PM) hasta el Sábado a mediodía (12:00 PM).',
                        confirmButtonColor: '#ef4444',
                        confirmButtonText: 'Entendido'
                    });
                }
            };

            return (
                <div className="min-h-screen max-w-md mx-auto bg-gray-50 shadow-2xl relative overflow-hidden">
                    {/* Barra Superior */}
                    <div className="bg-red-600 text-white p-4 shadow-md flex justify-between items-center rounded-b-2xl">
                        <div className="flex items-center space-x-2">
                            <i className="fas fa-motorcycle text-2xl"></i>
                            <h1 className="text-xl font-bold italic">Moto UBGrit</h1>
                        </div>
                        {view !== 'menu' && (
                            <button onClick={() => setView('menu')} className="bg-red-700 px-4 py-2 rounded-full hover:bg-red-800 text-sm font-bold transition-colors">
                                <i className="fas fa-arrow-left"></i> Volver
                            </button>
                        )}
                    </div>

                    {/* Contenido Dinámico */}
                    <div className="p-4 pb-24">
                        {view === 'menu' && (
                            <div className="space-y-4 mt-6">
                                <h2 className="text-gray-700 font-bold text-lg text-center mb-6">¿Qué servicio necesitas hoy?</h2>
                                
                                <button onClick={() => setView('moto')} className="w-full bg-white p-6 rounded-2xl shadow-sm border-2 border-transparent hover:border-red-500 flex items-center space-x-4 transition-all">
                                    <div className="bg-red-100 p-4 rounded-full">
                                        <i className="fas fa-motorcycle text-3xl text-red-600"></i>
                                    </div>
                                    <div className="text-left">
                                        <h3 className="font-bold text-gray-800 text-xl">Moto Taxi</h3>
                                        <p className="text-sm text-gray-500">Viaja rápido y seguro (Base: 4000 COP)</p>
                                    </div>
                                </button>

                                <button onClick={handleMercadoClick} className="w-full bg-white p-6 rounded-2xl shadow-sm border-2 border-transparent hover:border-green-500 flex items-center space-x-4 transition-all">
                                    <div className="bg-green-100 p-4 rounded-full flex-shrink-0">
                                        <span className="text-3xl">🛒</span>
                                    </div>
                                    <div className="text-left">
                                        <h3 className="font-bold text-gray-800 text-xl">Mercado en Casa</h3>
                                        <p className="text-xs text-gray-500 font-medium leading-tight mt-1">
                                            (Frutas, Verduras, Hortalizas, Legumbres y Especies)
                                        </p>
                                    </div>
                                </button>
                                
                                <button onClick={() => Swal.fire('Próximamente', 'Módulo de encomiendas en desarrollo', 'info')} className="w-full bg-white p-6 rounded-2xl shadow-sm border-2 border-transparent hover:border-blue-500 flex items-center space-x-4 transition-all opacity-70">
                                    <div className="bg-blue-100 p-4 rounded-full flex-shrink-0">
                                        <i className="fas fa-box text-3xl text-blue-600"></i>
                                    </div>
                                    <div className="text-left">
                                        <h3 className="font-bold text-gray-800 text-xl">Encomiendas</h3>
                                        <p className="text-sm text-gray-500">Envíos rápidos</p>
                                    </div>
                                </button>
                            </div>
                        )}

                        {view === 'mercado' && (
                            <div className="bg-white p-8 rounded-xl shadow-lg text-center mt-10 border-t-4 border-green-500">
                                <span className="text-6xl block mb-4">🛒</span>
                                <h2 className="text-2xl font-bold mt-4 text-green-600">¡Mercado Abierto!</h2>
                                <p className="text-gray-500 mt-2">Bienvenido a la sección de compras. Podrás ver la lista completa de frutas y verduras aquí.</p>
                            </div>
                        )}

                        {view === 'moto' && (
                            <div className="bg-white p-8 rounded-xl shadow-lg text-center mt-10 border-t-4 border-red-500">
                                <i className="fas fa-map-marker-alt text-6xl text-red-500 block mb-4"></i>
                                <h2 className="text-2xl font-bold mt-4 text-red-600">Calculadora de Viajes</h2>
                                <p className="text-gray-500 mt-2">Aquí aparecerá el mapa y la lista de precios fijos conectada a Firebase.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
