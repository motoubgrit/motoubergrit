        const formatQuantity = (qty, itemName = "") => {
            const isEgg = itemName.toLowerCase().includes("huevo");
            if (qty === 0.25) return isEgg ? "1/4 Cartón" : "250g";
            if (qty === 0.5) return isEgg ? "Medio Cartón" : "Medio Kg";
            if (qty === 0.75) return isEgg ? "3/4 Cartón" : "750g";
            if (qty === 1) return isEgg ? "1 Cartón" : "1 Kg";
            if (qty === 1.5) return isEgg ? "1.5 Cartones" : "1.5 Kg";
            return `${qty} ${isEgg ? 'Cartones' : 'Kg/Und/Paq'}`;
        };

        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c * 1.35; // Factor urbano
        };

                            <textarea required placeholder="Dirección Exacta" className="w-full p-3 border rounded-xl bg-gray-50 text-xs h-20" onChange={e=>setFormData({...formData, address: e.target.value})}></textarea>
                            
                            <div className="pt-2 border-t border-gray-100">
                                <label className="block text-[10px] font-bold text-gray-500 mb-1">CREAR CREDENCIALES</label>
                                <input required type="email" placeholder="Correo Electrónico" className="w-full p-3 mb-3 border rounded-xl bg-gray-50 text-xs" onChange={e=>setFormData({...formData, email: e.target.value})}/>
                                <input required type="password" placeholder="Crear Contraseña" className="w-full p-3 border rounded-xl bg-gray-50 text-xs" onChange={e=>setFormData({...formData, password: e.target.value})}/>
                            </div>
                            
                            <button type="submit" className="w-full bg-grita-red hover:bg-grita-darkred text-white font-bold py-3.5 rounded-xl shadow-lg mt-4 transition text-sm">
                                Completar Registro
                            </button>
                        </form>
                    </div>
                );
            };

            const MercadoDashboard = ({ user, onLogout, onOrderComplete }) => {
                const [internalView, setInternalView] = useState('shop'); // shop, cart, checkout
                const [cart, setCart] = useState({});
                const [categoryIdx, setCategoryIdx] = useState(0);
                const [paymentCurrency, setPaymentCurrency] = useState('COP');
                
                // Delivery/Checkout state
                const [dropoffLocation, setDropoffLocation] = useState(null);
                const [exactDropoff, setExactDropoff] = useState(user.address || '');
                const [routeInfo, setRouteInfo] = useState(null);

                const mapRef = useRef(null);
                const mapInstance = useRef(null);
                const markerDestino = useRef(null);

                const currentCat = mercadoCategories[categoryIdx];
                const currentProducts = mercadoInventory.filter(p => p.category === currentCat);
                const totalItems = Object.keys(cart).length;
                const cartSubtotalCOP = Object.values(cart).reduce((sum, item) => sum + (item.price * item.quantity), 0);

                const updateCart = (name, qty, price) => {
                    const cleanQty = Math.max(0, Math.round(qty * 100) / 100);
                    setCart(prev => {
                        const newCart = { ...prev };
                        if (cleanQty <= 0) delete newCart[name];
                        else newCart[name] = { quantity: cleanQty, price };
                        return newCart;
                    });
                };

                const setupMap = () => {
                    if (!mapInstance.current && mapRef.current) {
                        mapInstance.current = L.map(mapRef.current, { zoomControl: false }).setView(LA_GRITA_COORDS, 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance.current);
                        
                        mapInstance.current.on('click', (e) => {
                            setDropoffLocation(e.latlng);
                            const distKm = calculateDistance(LA_GRITA_COORDS[0], LA_GRITA_COORDS[1], e.latlng.lat, e.latlng.lng);
                            const fares = calculateFares(distKm);
                            setRouteInfo({ distance: distKm.toFixed(1), ...fares });
                        });
                    }
                };

                useEffect(() => {
                    if (internalView === 'checkout') setTimeout(setupMap, 100);
                }, [internalView]);

                useEffect(() => {
                    if (!mapInstance.current) return;
                    const redIcon = L.divIcon({ html: `<div class="w-4 h-4 bg-red-600 rounded-full border-2 border-white shadow-lg"></div>`, className: '' });
                    if (dropoffLocation) {
                        if(!markerDestino.current) markerDestino.current = L.marker(dropoffLocation, {icon: redIcon}).addTo(mapInstance.current);
                        else markerDestino.current.setLatLng(dropoffLocation);
                    }
                }, [dropoffLocation]);

                const submitMarketOrder = async () => {
                    if (!dropoffLocation || !exactDropoff) {
                        showAlert("Por favor, marca tu ubicación en el mapa y escribe la dirección exacta.");
                        return;
                    }

                    const deliveryFee = routeInfo.cop;
                    const grandTotalCOP = cartSubtotalCOP + deliveryFee;
                    
                    let orderText = Object.keys(cart).map(k => `${formatQuantity(cart[k].quantity, k)} ${k}`).join(", ");
                    const linkDestino = `https://www.google.com/maps/search/?api=1&query=${dropoffLocation.lat},${dropoffLocation.lng}`;
                    
                    const rawText = `🛒 *NUEVO PEDIDO: MERCADO EN CASA*\n\n*Cliente:* ${user.name}\n*Tel:* ${user.phone}\n\n*PRODUCTOS:*\n${orderText}\n\n*Subtotal:* ${cartSubtotalCOP.toLocaleString()} COP\n*Delivery:* ${deliveryFee.toLocaleString()} COP\n💰 *TOTAL A PAGAR:* ${grandTotalCOP.toLocaleString()} COP\n💵 *Moneda de pago:* ${paymentCurrency}\n📈 *Comisión Admin (12% del delivery):* ${routeInfo.admin.toLocaleString()} COP\n\n📍 *ENTREGA:* ${exactDropoff}\n${linkDestino}`;
                    const encodedText = encodeURIComponent(rawText);

                    // Send to Sheets
                    try {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST', mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({
                                action: 'new_ride',
                                passenger: `MERCADO - ${user.name}`,
                                phone: user.phone,
                                pickup: "Mercado Central",
                                dropoff: exactDropoff,
                                distance: routeInfo.distance,
                                cop: grandTotalCOP, 
                                ves: (grandTotalCOP / TASA_VES_COP).toFixed(2),
                                adminCut: routeInfo.admin // Admin cut ONLY on delivery fee
                            })
                        });
                    } catch (e) { console.log(e); }

                    window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodedText}`, '_blank');
                    onOrderComplete();
                };

                return (
                    <div className="flex flex-col h-full bg-gray-50 w-full overflow-hidden">
                        {/* Header */}
                        <div className="bg-green-600 text-white p-3 flex justify-between items-center shadow-md z-10 shrink-0">
                            <div className="flex items-center gap-2" onClick={() => setInternalView('shop')}>
                                <i className="fa-solid fa-basket-shopping text-xl"></i>
                                <div>
                                    <h1 className="text-sm font-black leading-none">MERCADO</h1>
                                    <span className="text-[9px] font-medium opacity-80">{user.name.split(' ')[0]}</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setInternalView('cart')} className="relative bg-green-700 p-2 rounded-full shadow-inner">
                                    <i className="fa-solid fa-cart-shopping text-sm"></i>
                                    {totalItems > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full border border-white">{totalItems}</span>}
                                </button>
                                <button onClick={onLogout} className="bg-black/30 p-2 rounded-full text-xs"><i className="fa-solid fa-right-from-bracket"></i></button>
                            </div>
                        </div>

                        {internalView === 'shop' && (
                            <div className="flex-1 overflow-y-auto p-3">
                                {/* Categories */}
                                <div className="flex items-center justify-between bg-white p-3 rounded-2xl shadow-sm mb-4 border border-green-100">
                                    <button onClick={() => setCategoryIdx(Math.max(0, categoryIdx-1))} disabled={categoryIdx===0} className="text-green-600 disabled:opacity-30"><i className="fa-solid fa-chevron-left text-lg"></i></button>
                                    <h2 className="text-[11px] font-black text-green-800 uppercase tracking-widest text-center px-1">{currentCat}</h2>
                                    <button onClick={() => setCategoryIdx(Math.min(mercadoCategories.length-1, categoryIdx+1))} disabled={categoryIdx===mercadoCategories.length-1} className="text-green-600 disabled:opacity-30"><i className="fa-solid fa-chevron-right text-lg"></i></button>
                                </div>
                                {/* Products Grid */}
                                <div className="grid grid-cols-2 gap-3 pb-6">
                                    {currentProducts.map(p => {
                                        const qty = cart[p.name]?.quantity || 0;
                                        return (
                                            <div key={p.name} className="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
                                                <div className="text-3xl mb-1">{p.icon}</div>
                                                <h3 className="font-bold text-gray-800 text-[11px] leading-tight mb-1 h-6 flex items-center justify-center">{p.name}</h3>
                                                <p className="text-green-700 font-black text-[11px] mb-3">{p.price.toLocaleString()} COP</p>
                                                
                                                {qty === 0 ? (
                                                    <button onClick={() => updateCart(p.name, 0.25, p.price)} className="w-full bg-green-50 text-green-700 border border-green-200 py-1.5 rounded-lg text-xs font-bold">Agregar</button>
                                                ) : (
                                                    <div className="flex items-center justify-between w-full bg-gray-50 rounded-lg p-1 border">
                                                        <button onClick={() => updateCart(p.name, qty-0.25, p.price)} className="w-6 h-6 bg-white rounded text-red-500 shadow-sm font-bold">-</button>
                                                        <span className="font-bold text-[10px]">{formatQuantity(qty, p.name)}</span>
                                                        <button onClick={() => updateCart(p.name, qty+0.25, p.price)} className="w-6 h-6 bg-white rounded text-green-600 shadow-sm font-bold">+</button>
                                                    </div>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {internalView === 'cart' && (
                            <div className="flex-1 overflow-y-auto p-4 flex flex-col">
                                <h2 className="text-base font-black text-gray-800 mb-3 border-b pb-2">Tu Carrito</h2>
                                {totalItems === 0 ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-gray-400">
                                        <i className="fa-solid fa-basket-shopping text-5xl mb-3 opacity-50"></i>
                                        <p className="text-xs font-bold">El carrito está vacío</p>
                                        <button onClick={()=>setInternalView('shop')} className="mt-4 bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-bold">Volver al Mercado</button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 mb-4 p-2">
                                            {Object.keys(cart).map(name => (
                                                <div key={name} className="flex justify-between items-center p-2 border-b last:border-0 border-gray-50">
                                                    <div>
                                                        <p className="font-bold text-xs text-gray-800">{name}</p>
                                                        <p className="text-[10px] text-gray-500">{formatQuantity(cart[name].quantity, name)}</p>
                                                    </div>
                                                    <p className="font-black text-xs text-green-700">{(cart[name].price * cart[name].quantity).toLocaleString()} COP</p>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex justify-between items-center bg-green-50 p-3 rounded-xl border border-green-200 mb-6">
                                            <span className="font-bold text-sm text-green-900">Subtotal</span>
                                            <span className="font-black text-lg text-green-700">{cartSubtotalCOP.toLocaleString()} COP</span>
                                        </div>
                                        <button onClick={()=>setInternalView('checkout')} className="w-full bg-green-600 text-white font-black py-3.5 rounded-xl shadow-lg mt-auto text-sm">
                                            Continuar (Envío) <i className="fa-solid fa-arrow-right ml-1"></i>
                                        </button>
                                    </>
                                )}
                            </div>
                        )}

                        {internalView === 'checkout' && (
                            <div className="flex-1 flex flex-col relative">
                                <div className="bg-white p-3 shadow-md z-10 shrink-0 space-y-2 relative">
                                    <p className="text-xs font-bold text-gray-600"><i className="fa-solid fa-location-dot text-red-500"></i> Marca en el mapa tu casa</p>
                                    <input type="text" placeholder="Escribe detalles (Ej. Casa amarilla)" className="w-full p-2.5 border rounded-lg bg-amber-50 border-amber-300 text-xs font-medium"
                                        value={exactDropoff} onChange={e => setExactDropoff(e.target.value)} />
                                </div>
                                <div className="flex-1 relative min-h-[200px]">
                                    <div ref={mapRef} className="h-full w-full absolute inset-0 z-0"></div>
                                </div>
                                {routeInfo && (
                                    <div className="bg-white p-4 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-10 shrink-0 overflow-y-auto max-h-[50vh]">
                                        <div className="flex justify-between mb-1 text-xs">
                                            <span className="text-gray-500">Subtotal Productos</span>
                                            <span className="font-bold">{cartSubtotalCOP.toLocaleString()} COP</span>
                                        </div>
                                        <div className="flex justify-between mb-3 text-xs border-b pb-2">
                                            <span className="text-gray-500">Delivery ({routeInfo.distance} km)</span>
                                            <span className="font-bold text-orange-500">+{routeInfo.cop.toLocaleString()} COP</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="font-black text-sm">TOTAL</span>
                                            <div className="text-right">
                                                <span className="font-black text-lg text-green-700">{(cartSubtotalCOP + routeInfo.cop).toLocaleString()} COP</span>
                                                <p className="text-[9px] text-gray-400">Admin Cut: {routeInfo.admin.toLocaleString()} COP</p>
                                            </div>
                                        </div>
                                        
                                        <h3 className="font-bold text-center mb-2 text-xs text-gray-800">Seleccione Moneda de Pago</h3>
                                        <div className="grid grid-cols-3 gap-2 mb-2">
                                            {['COP', 'VES', 'USD'].map(c => (
                                                <button key={c} onClick={() => setPaymentCurrency(c)} className={`py-1.5 rounded-lg text-xs font-bold border ${paymentCurrency === c ? 'bg-green-100 border-green-500 text-green-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>{c}</button>
                                            ))}
                                        </div>
                                        
                                        {/* Modificación solicitada: Eliminación de datos bancarios de pago móvil para VES */}
                                        {paymentCurrency === 'VES' && (
                                            <div className="mb-4 p-3 bg-blue-50 rounded-xl border border-blue-200 text-sm shadow-inner">
                                                <p className="font-black uppercase mb-1 flex items-center justify-center gap-1 text-blue-900 text-xs">Pago en Bolívares (VES)</p>
                                                <p className="text-blue-800 bg-blue-100 p-2 rounded-lg font-bold text-center">Monto a cancelar:<br/><span className="text-base text-blue-900">{((cartSubtotalCOP + routeInfo.cop) / TASA_VES_COP).toLocaleString(undefined, {maximumFractionDigits: 2})} VES</span></p>
                                            </div>
                                        )}
                                        {paymentCurrency === 'USD' && (
                                            <div className="mb-4 p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-sm shadow-inner">
                                                <p className="font-black uppercase mb-1 flex items-center justify-center gap-1 text-emerald-900 text-xs">Pago en Dólares (USD)</p>
                                                <p className="text-emerald-800 bg-emerald-100 p-2 rounded-lg font-bold text-center">Monto a cancelar:<br/><span className="text-base text-emerald-900">${((cartSubtotalCOP + routeInfo.cop) / TASA_USD_COP).toFixed(2)} USD</span></p>
                                            </div>
                                        )}

                                        <button onClick={submitMarketOrder} className="w-full bg-green-600 text-white font-black py-3 rounded-xl shadow-lg text-sm flex justify-center items-center gap-2 mt-2">
                                            <i className="fa-brands fa-whatsapp text-lg"></i> Pedir por WhatsApp
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            const ClientDashboard = ({ user, onLogout }) => (
                <div className="flex flex-col h-full bg-gray-50 items-center justify-center p-6 text-center">
                    <div className="w-16 h-16 bg-red-100 text-grita-red rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-user text-2xl"></i></div>
                    <h2 className="text-lg font-bold mb-1">Hola, {user.name}</h2>
                    <p className="text-xs text-gray-500 mb-6">Panel de Pasajero Activo</p>
                    <button onClick={() => window.open(`https://wa.me/${ADMIN_PHONE}?text=Hola Admin, necesito un Moto UBGrit...`, '_blank')} className="w-full bg-grita-red text-white font-bold py-3.5 rounded-xl shadow mb-3 text-sm flex items-center justify-center gap-2">
                        <i className="fa-brands fa-whatsapp"></i> Solicitar Moto Rápido
                    </button>
                    <button onClick={onLogout} className="text-xs font-bold text-gray-400 underline">Cerrar Sesión</button>
                </div>
            );

            const StoreDashboard = ({ user, onLogout }) => (
                <div className="flex flex-col h-full bg-gray-50 items-center justify-center p-6 text-center">
                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-store text-2xl"></i></div>
                    <h2 className="text-lg font-bold mb-1">{user.storeName}</h2>
                    <p className="text-xs text-gray-500 mb-6">Panel de Encomiendas</p>
                    <button onClick={() => window.open(`https://wa.me/${ADMIN_PHONE}?text=Hola Admin, tengo una encomienda en ${user.storeName}...`, '_blank')} className="w-full bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow mb-3 text-sm flex items-center justify-center gap-2">
                        <i className="fa-brands fa-whatsapp"></i> Enviar Encomienda
                    </button>
                    <button onClick={onLogout} className="text-xs font-bold text-gray-400 underline">Cerrar Sesión</button>
                </div>
            );

            const DriverDashboard = ({ user, onLogout }) => (
                <div className="flex flex-col h-full bg-gray-50 items-center justify-center p-6 text-center">
                    <div className="w-16 h-16 bg-gray-200 text-gray-700 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-motorcycle text-2xl"></i></div>
                    <h2 className="text-lg font-bold mb-1">{user.name}</h2>
                    <p className="text-xs text-green-600 font-bold mb-6 flex items-center justify-center gap-1"><span className="w-2 h-2 bg-green-500 rounded-full inline-block"></span> En Línea</p>
                    <button onClick={() => window.open(`https://wa.me/${ADMIN_PHONE}?text=Hola Admin, soy conductor activo.`, '_blank')} className="w-full bg-green-500 text-white font-bold py-3.5 rounded-xl shadow mb-3 text-sm flex items-center justify-center gap-2">
                        <i className="fa-brands fa-whatsapp"></i> Chat Administrador
                    </button>
                    <button onClick={onLogout} className="text-xs font-bold text-gray-400 underline">Cerrar Sesión</button>
                </div>
            );

            const AdminDashboard = () => (
                <div className="flex flex-col h-full bg-gray-100 items-center justify-center p-6 text-center">
                    <div className="w-16 h-16 bg-grita-dark text-white rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-shield-halved text-2xl"></i></div>
                    <h2 className="text-lg font-bold mb-1">Panel de Control</h2>
                    <p className="text-xs text-gray-500 mb-6">Todos los pedidos llegan a Google Sheets y WhatsApp.</p>
                    <button onClick={logout} className="text-xs font-bold text-gray-400 border py-2 px-4 rounded-lg">Cerrar Sesión Admin</button>
                </div>
            );

            return (
                <div id="root-container">
                    {alert && <AlertBox msg={alert.msg} type={alert.type} />}
                    {showPostOrderModal && <PostOrderModal onExit={logout} onNewOrder={() => setShowPostOrderModal(false)} />}
                    
                    {view === 'landing' && <Landing />}
                    {view === 'registerClient' && <RegisterForm role="client" />}
                    {view === 'registerStore' && <RegisterForm role="store" />}
                    {view === 'registerDriver' && <RegisterForm role="driver" />}
                    
                    {view === 'clientDash' && <ClientDashboard user={user} onLogout={logout} />}
                    {view === 'storeDash' && <StoreDashboard user={user} onLogout={logout} />}
                    {view === 'driverDash' && <DriverDashboard user={user} onLogout={logout} />}
                    {view === 'mercadoDash' && <MercadoDashboard user={user} onLogout={logout} onOrderComplete={handleOrderComplete} />}
                    
                    {view === 'adminDash' && <AdminDashboard />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
