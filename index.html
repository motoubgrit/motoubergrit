            const isEgg = itemName.toLowerCase().includes("huevo");
            if (qty === 0.25) return isEgg ? "1/4 Cartón" : "250g";
            if (qty === 0.5) return isEgg ? "Medio Cartón" : "Medio Kg";
            if (qty === 0.75) return isEgg ? "3/4 Cartón" : "750g";
            if (qty === 1) return isEgg ? "1 Cartón" : "1 Kg";
            if (qty === 1.5) return isEgg ? "1.5 Cartones" : "1.5 Kg";
            return `${qty} ${isEgg ? 'Cartones' : 'Kg/Und/Paq'}`;
        };

        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c * 1.35; // Factor urbano
        };

                // Redondeo inteligente a los 500 pesos más cercanos para dar un cobro justo y manejable en efectivo

            let vesPrice = (copPrice / TASA_VES_COP).toFixed(2);

                };

                return (
                    <div className="flex flex-col h-full bg-[#0b0f19] text-white">
                        <HeaderNav title={`Acceso - ${title}`} onBack={() => setView('landing')} />
                        
                        <div className="flex-1 overflow-y-auto p-6 flex flex-col items-center justify-center">
                            <div className="bg-white text-gray-900 rounded-3xl max-w-[320px] w-full p-6 shadow-2xl">
                                
                                {mode === 'login' && (
                                    <>
                                        <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-grita-red text-xl"><i className="fa-solid fa-lock"></i></div>
                                        <h3 className="text-xl font-black mb-1 text-center">Iniciar Sesión</h3>
                                        <p className="text-gray-500 text-xs mb-6 text-center leading-tight">Ingresa tus datos de {title}</p>
                                        
                                        <form onSubmit={submitLogin}>
                                            <input type="email" placeholder="Correo Electrónico" required className="w-full p-3 mb-3 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-grita-red outline-none transition" value={email} onChange={e=>setEmail(e.target.value)}/>
                                            <input type="password" placeholder="Contraseña" required className="w-full p-3 mb-2 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-grita-red outline-none transition" value={pass} onChange={e=>setPass(e.target.value)}/>
                                            
                                            <div className="text-right mb-5">
                                                <button type="button" onClick={() => setMode('forgot')} className="text-[11px] text-grita-red font-bold hover:underline">¿Olvidaste tu contraseña?</button>
                                            </div>
                                            <button type="submit" className="w-full bg-grita-red hover:bg-grita-darkred text-white font-bold py-3.5 rounded-xl shadow-lg transition text-sm mb-4">
                                                Entrar
                                            </button>
                                        </form>
                                        <div className="text-center pt-4 border-t border-gray-100">
                                            <p className="text-xs text-gray-500 mb-2">¿No tienes cuenta?</p>
                                            <button onClick={() => setMode('register')} className="w-full bg-gray-100 text-gray-800 font-bold py-3 rounded-xl hover:bg-gray-200 transition border border-gray-300 text-sm">
                                                Registrarse como {title}
                                            </button>
                                        </div>
                                    </>
                                )}

                                {mode === 'register' && (
                                    <>
                                        <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600 text-xl"><i className="fa-solid fa-user-plus"></i></div>
                                        <h3 className="text-xl font-black mb-4 text-center">Registro Nuevo</h3>
                                        
                                        <form onSubmit={submitRegister} className="space-y-3">
                                            {isStore && <input required placeholder="Nombre del Local / Empresa" className="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm" onChange={e=>setFormData({...formData, storeName: e.target.value})}/>}
                                            <input required placeholder="Nombre y Apellido" className="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm" onChange={e=>setFormData({...formData, name: e.target.value})}/>
                                            <input required type="tel" placeholder="WhatsApp (Ej: 0414...)" className="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm" onChange={e=>setFormData({...formData, phone: e.target.value})}/>
                                            <textarea required placeholder="Dirección Exacta" className="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm h-16" onChange={e=>setFormData({...formData, address: e.target.value})}></textarea>
                                            
                                            <div className="pt-2 border-t border-gray-100">
                                                <input required type="email" placeholder="Correo Electrónico" className="w-full p-3 mb-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-grita-red" onChange={e=>setFormData({...formData, email: e.target.value})}/>
                                                <input required type="password" placeholder="Crear Contraseña" className="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-grita-red" onChange={e=>setFormData({...formData, password: e.target.value})}/>
                                            </div>
                                            
                                            <button type="submit" className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-sm mb-4">
                                                Completar Registro
                                            </button>
                                        </form>
                                        <div className="text-center pt-4 border-t border-gray-100">
                                            <p className="text-xs text-gray-500 mb-2">¿Ya estás registrado?</p>
                                            <button onClick={() => setMode('login')} className="w-full bg-gray-100 text-gray-800 font-bold py-3 rounded-xl hover:bg-gray-200 transition border border-gray-300 text-sm">
                                                Iniciar Sesión
                                            </button>
                                        </div>
                                    </>
                                )}

                                {mode === 'forgot' && (
                                    <>
                                        <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-600 text-xl"><i className="fa-solid fa-envelope"></i></div>
                                        <h3 className="text-xl font-black mb-1 text-center">Recuperar Clave</h3>
                                        <p className="text-gray-500 text-[10px] mb-6 text-center">Se notificará al administrador para que la envíe desde motoubgrit@gmail.com</p>
                                        
                                        <input type="email" placeholder="Tu correo registrado" className="w-full p-3 mb-4 border border-gray-200 rounded-xl text-sm bg-gray-50" value={recoverEmail} onChange={e=>setRecoverEmail(e.target.value)} />
                                        
                                        <button onClick={handleRecoverPassword} className="w-full bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow text-sm mb-3">
                                            Notificar al Admin
                                        </button>
                                        <button onClick={() => setMode('login')} className="w-full bg-gray-100 text-gray-700 font-bold py-3 rounded-xl text-xs">
                                            Cancelar y Volver
                                        </button>
                                    </>
                                )}

                            </div>
                        </div>
                    </div>
                );
            };

            const Dashboard = ({ role, title, icon, color, bg }) => {
                const handleServiceRequest = () => {
                    let msg = "";
                    let actionType = "";
                    if(role === 'client') { msg = "Hola Admin, necesito un traslado (Soy Cliente). ¿Me puedes enviar una moto a mi ubicación registrada?"; actionType = "Traslado"; }
                    if(role === 'store') { msg = "Hola Admin, tengo una encomienda lista para enviar..."; actionType = "Encomienda"; }
                    if(role === 'driver') { msg = "Hola Admin, estoy activo y en línea para recibir viajes."; actionType = "Conductor_Activo"; }

                    // Enviar copia a Sheets
                    logToSheets({
                        action: 'service_request',
                        passenger: user.name,
                        phone: user.phone,
                        type: actionType,
                        date: new Date().toLocaleString()
                    });

                    // Abrir WhatsApp con el número oficial único
                    window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
                    handleOrderComplete();
                };

                return (
                    <div className="flex flex-col h-full bg-gray-50">
                        <HeaderNav title={`Panel de ${title}`} onBack={() => setView('landing')} />
                        <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
                            <div className={`w-20 h-20 ${bg} ${color} rounded-full flex items-center justify-center mb-4 shadow-inner border border-white`}><i className={`fa-solid ${icon} text-3xl`}></i></div>
                            <h2 className="text-xl font-black text-gray-800 mb-1">{user.storeName || user.name}</h2>
                            {role === 'driver' && <p className="text-xs text-green-600 font-bold mb-6 flex items-center justify-center gap-1"><span className="w-2 h-2 bg-green-500 rounded-full inline-block animate-pulse"></span> Conectado</p>}
                            {role !== 'driver' && <p className="text-xs text-gray-500 font-medium mb-8 bg-gray-200 px-3 py-1 rounded-full">{user.email}</p>}
                            
                            <button onClick={handleServiceRequest} className={`w-full max-w-[280px] ${role === 'store' ? 'bg-amber-600' : (role === 'driver' ? 'bg-green-600' : 'bg-grita-red')} text-white font-bold py-4 rounded-xl shadow-lg mb-3 text-sm flex items-center justify-center gap-2 transition hover:scale-105`}>
                                <i className="fa-brands fa-whatsapp text-lg"></i> {role === 'driver' ? 'Reportarse con Central' : 'Solicitar Servicio / Moto'}
                            </button>
                            
                            {role !== 'driver' && role !== 'admin' && (
                                <button onClick={() => setView('mercadoDash')} className="w-full max-w-[280px] bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg text-sm flex items-center justify-center gap-2 transition hover:scale-105">
                                    <i className="fa-solid fa-basket-shopping text-lg"></i> Ir al Mercado en Casa
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            const MercadoDashboard = () => {
                const [internalView, setInternalView] = useState('shop'); 
                const [cart, setCart] = useState({});
                const [categoryIdx, setCategoryIdx] = useState(0);
                const [paymentCurrency, setPaymentCurrency] = useState('COP');
                
                const [dropoffLocation, setDropoffLocation] = useState(null);
                const [exactDropoff, setExactDropoff] = useState(user.address || '');
                const [routeInfo, setRouteInfo] = useState(null);

                const mapRef = useRef(null);
                const mapInstance = useRef(null);
                const markerDestino = useRef(null);

                const currentCat = mercadoCategories[categoryIdx];
                const currentProducts = mercadoInventory.filter(p => p.category === currentCat);
                const totalItems = Object.keys(cart).length;
                const cartSubtotalCOP = Object.values(cart).reduce((sum, item) => sum + (item.price * item.quantity), 0);

                const updateCart = (name, qty, price) => {
                    const cleanQty = Math.max(0, Math.round(qty * 100) / 100);
                    setCart(prev => {
                        const newCart = { ...prev };
                        if (cleanQty <= 0) delete newCart[name];
                        else newCart[name] = { quantity: cleanQty, price };
                        return newCart;
                    });
                };

                const setupMap = () => {
                    if (!mapInstance.current && mapRef.current) {
                        mapInstance.current = L.map(mapRef.current, { zoomControl: false }).setView(LA_GRITA_COORDS, 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance.current);
                        mapInstance.current.on('click', (e) => {
                            setDropoffLocation(e.latlng);
                            const distKm = calculateDistance(LA_GRITA_COORDS[0], LA_GRITA_COORDS[1], e.latlng.lat, e.latlng.lng);
                            const fares = calculateFares(distKm);
                            setRouteInfo({ distance: distKm.toFixed(1), ...fares });
                        });
                    }
                };

                useEffect(() => { if (internalView === 'checkout') setTimeout(setupMap, 100); }, [internalView]);

                useEffect(() => {
                    if (!mapInstance.current) return;
                    const redIcon = L.divIcon({ html: `<div class="w-4 h-4 bg-red-600 rounded-full border-2 border-white shadow-lg"></div>`, className: '' });
                    if (dropoffLocation) {
                        if(!markerDestino.current) markerDestino.current = L.marker(dropoffLocation, {icon: redIcon}).addTo(mapInstance.current);
                        else markerDestino.current.setLatLng(dropoffLocation);
                    }
                }, [dropoffLocation]);

                const submitMarketOrder = async () => {
                    if (!dropoffLocation || !exactDropoff) {
                        showAlert("Por favor, marca tu ubicación en el mapa y escribe la dirección.");
                        return;
                    }
                    const deliveryFee = routeInfo.cop;
                    const grandTotalCOP = cartSubtotalCOP + deliveryFee;
                    let orderText = Object.keys(cart).map(k => `${formatQuantity(cart[k].quantity, k)} ${k}`).join(", ");
                    const linkDestino = `https://www.google.com/maps/search/?api=1&query=${dropoffLocation.lat},${dropoffLocation.lng}`;
                    
                    const rawText = `🛒 *MERCADO EN CASA - UBGRIT*\n\n*Cliente:* ${user.name}\n*Tel:* ${user.phone}\n\n*PRODUCTOS:*\n${orderText}\n\n*Subtotal:* ${cartSubtotalCOP.toLocaleString()} COP\n*Delivery:* ${deliveryFee.toLocaleString()} COP\n💰 *TOTAL A PAGAR:* ${grandTotalCOP.toLocaleString()} COP\n💵 *Moneda de pago:* ${paymentCurrency}\n\n📍 *ENTREGA:* ${exactDropoff}\n${linkDestino}`;
                    
                    // Enviar copia a Sheets con 12% admin cut
                    await logToSheets({
                        action: 'new_ride',
                        passenger: `MERCADO - ${user.name}`,
                        phone: user.phone,
                        pickup: "Mercado Central",
                        dropoff: exactDropoff,
                        distance: routeInfo.distance,
                        cop: grandTotalCOP,
                        ves: (grandTotalCOP / TASA_VES_COP).toFixed(2),
                        adminCut: routeInfo.admin // 12% del delivery va a Sheets
                    });

                    // Notificar al admin por WA
                    window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(rawText)}`, '_blank');
                    handleOrderComplete();
                };

                return (
                    <div className="flex flex-col h-full bg-gray-50">
                        {internalView === 'shop' && <HeaderNav title="Mercado en Casa" onBack={() => {
                            if(user.role === 'client') setView('clientDash');
                            else if (user.role === 'store') setView('storeDash');
                            else setView('landing');
                        }} />}
                        {internalView === 'cart' && <HeaderNav title="Carrito" onBack={() => setInternalView('shop')} />}
                        {internalView === 'checkout' && <HeaderNav title="Fijar Envío" onBack={() => setInternalView('cart')} />}
                        
                        {internalView === 'shop' && (
                            <div className="flex-1 overflow-y-auto p-4 flex flex-col relative pb-24">
                                <div className="flex items-center justify-between bg-white p-3 rounded-2xl shadow-sm mb-4 border border-green-100 sticky top-0 z-10">
                                    <button onClick={() => setCategoryIdx(Math.max(0, categoryIdx-1))} disabled={categoryIdx===0} className="text-green-600 disabled:opacity-30 p-2"><i className="fa-solid fa-chevron-left text-lg"></i></button>
                                    <h2 className="text-[11px] font-black text-green-800 uppercase tracking-widest text-center px-1 flex-1">{currentCat}</h2>
                                    <button onClick={() => setCategoryIdx(Math.min(mercadoCategories.length-1, categoryIdx+1))} disabled={categoryIdx===mercadoCategories.length-1} className="text-green-600 disabled:opacity-30 p-2"><i className="fa-solid fa-chevron-right text-lg"></i></button>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    {currentProducts.map(p => {
                                        const qty = cart[p.name]?.quantity || 0;
                                        return (
                                            <div key={p.name} className="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
                                                <div className="text-3xl mb-1">{p.icon}</div>
                                                <h3 className="font-bold text-gray-800 text-[11px] leading-tight mb-1 h-6 flex items-center justify-center">{p.name}</h3>
                                                <p className="text-green-700 font-black text-[11px] mb-3">{p.price.toLocaleString()} COP</p>
                                                {qty === 0 ? (
                                                    <button onClick={() => updateCart(p.name, 0.25, p.price)} className="w-full bg-green-50 text-green-700 border border-green-200 py-1.5 rounded-lg text-xs font-bold shadow-sm">Agregar</button>
                                                ) : (
                                                    <div className="flex items-center justify-between w-full bg-gray-50 rounded-lg p-1 border">
                                                        <button onClick={() => updateCart(p.name, qty-0.25, p.price)} className="w-6 h-6 bg-white rounded text-red-500 shadow-sm font-bold">-</button>
                                                        <span className="font-bold text-[10px]">{formatQuantity(qty, p.name)}</span>
                                                        <button onClick={() => updateCart(p.name, qty+0.25, p.price)} className="w-6 h-6 bg-white rounded text-green-600 shadow-sm font-bold">+</button>
                                                    </div>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                        
                        {internalView === 'shop' && totalItems > 0 && (
                            <div className="absolute bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-sm border-t border-gray-200 z-20">
                                <button onClick={()=>setInternalView('cart')} className="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-[0_10px_20px_rgba(22,101,52,0.4)] text-sm flex justify-between px-6 items-center animate-bounce">
                                    <span className="bg-white text-green-700 px-2 py-1 rounded-md text-xs">{totalItems} ítems</span>
                                    <span>Ir al Carrito <i className="fa-solid fa-arrow-right ml-1"></i></span>
                                </button>
                            </div>
                        )}

                        {internalView === 'cart' && (
                            <div className="flex-1 overflow-y-auto p-4 flex flex-col pb-24 relative">
                                {totalItems === 0 ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-gray-400">
                                        <i className="fa-solid fa-basket-shopping text-5xl mb-3 opacity-50"></i>
                                        <p className="text-xs font-bold mb-4">El carrito está vacío</p>
                                        <button onClick={()=>setInternalView('shop')} className="bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-bold">Volver al Mercado</button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 mb-4 p-2">
                                            {Object.keys(cart).map(name => (
                                                <div key={name} className="flex justify-between items-center p-3 border-b last:border-0 border-gray-50">
                                                    <div>
                                                        <p className="font-bold text-xs text-gray-800">{name}</p>
                                                        <p className="text-[10px] text-gray-500">{formatQuantity(cart[name].quantity, name)}</p>
                                                    </div>
                                                    <p className="font-black text-xs text-green-700">{(cart[name].price * cart[name].quantity).toLocaleString()} COP</p>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex justify-between items-center bg-green-50 p-4 rounded-xl border border-green-200 mb-6">
                                            <span className="font-black text-sm text-green-900">Subtotal Productos</span>
                                            <span className="font-black text-xl text-green-700">{cartSubtotalCOP.toLocaleString()} COP</span>
                                        </div>
                                        <button onClick={()=>setInternalView('checkout')} className="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-lg mt-auto text-sm">
                                            Continuar (Fijar Envío) <i className="fa-solid fa-map-location-dot ml-2"></i>
                                        </button>
                                    </>
                                )}
                            </div>
                        )}
                        
                        {internalView === 'cart' && totalItems > 0 && (
                            <div className="absolute bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-sm border-t border-gray-200 z-20">
                                <button onClick={()=>setInternalView('checkout')} className="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-lg text-sm">
                                    Continuar (Fijar Envío) <i className="fa-solid fa-map-location-dot ml-2"></i>
                                </button>
                            </div>
                        )}

                        {internalView === 'checkout' && (
                            <div className="flex-1 flex flex-col relative">
                                <div className="bg-white p-3 shadow-md z-10 shrink-0 space-y-2">
                                    <p className="text-xs font-bold text-gray-600"><i className="fa-solid fa-location-dot text-red-500"></i> Marca en el mapa tu casa</p>
                                    <input type="text" placeholder="Escribe detalles (Ej. Casa amarilla)" className="w-full p-3 border rounded-lg bg-gray-50 border-gray-200 text-xs font-medium focus:ring-2 focus:ring-green-500" value={exactDropoff} onChange={e => setExactDropoff(e.target.value)} />
                                </div>
                                <div className="flex-1 relative min-h-[200px]">
                                    <div ref={mapRef} className="h-full w-full absolute inset-0 z-0"></div>
                                </div>
                                {routeInfo && (
                                    <div className="bg-white p-4 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-10 shrink-0 overflow-y-auto max-h-[50vh]">
                                        <div className="flex justify-between mb-1 text-xs">
                                            <span className="text-gray-500">Subtotal Productos</span>
                                            <span className="font-bold text-gray-800">{cartSubtotalCOP.toLocaleString()} COP</span>
                                        </div>
                                        <div className="flex justify-between mb-3 text-xs border-b pb-2">
                                            <span className="text-gray-500">Delivery ({routeInfo.distance} km)</span>
                                            <span className="font-bold text-orange-600">+{routeInfo.cop.toLocaleString()} COP</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-4">
                                            <span className="font-black text-sm">TOTAL A PAGAR</span>
                                            <div className="text-right">
                                                <span className="font-black text-xl text-green-700">{(cartSubtotalCOP + routeInfo.cop).toLocaleString()} COP</span>
                                            </div>
                                        </div>
                                        
                                        <h3 className="font-bold text-center mb-2 text-xs text-gray-800 uppercase tracking-widest">Moneda de Pago</h3>
                                        <div className="grid grid-cols-3 gap-2 mb-4">
                                            {['COP', 'VES', 'USD'].map(c => (
                                                <button key={c} onClick={() => setPaymentCurrency(c)} className={`py-2 rounded-lg text-xs font-black border-2 transition ${paymentCurrency === c ? 'bg-green-50 border-green-500 text-green-700' : 'bg-white border-gray-100 text-gray-400'}`}>{c}</button>
                                            ))}
                                        </div>
                                        
                                        {/* Montos actualizados dividiendo entre 3.0 para VES y 3000 para USD, sin datos bancarios */}
                                        {paymentCurrency === 'VES' && (
                                            <div className="mb-4 p-3 bg-blue-50 rounded-xl border border-blue-200 text-center shadow-inner">
                                                <p className="font-bold text-blue-900 text-[10px] uppercase mb-1">Monto equivalente en Bolívares</p>
                                                <p className="font-black text-lg text-blue-800">{((cartSubtotalCOP + routeInfo.cop) / TASA_VES_COP).toLocaleString(undefined, {maximumFractionDigits: 2})} VES</p>
                                            </div>
                                        )}
                                        {paymentCurrency === 'USD' && (
                                            <div className="mb-4 p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-center shadow-inner">
                                                <p className="font-bold text-emerald-900 text-[10px] uppercase mb-1">Monto equivalente en Dólares</p>
                                                <p className="font-black text-lg text-emerald-800">${((cartSubtotalCOP + routeInfo.cop) / TASA_USD_COP).toFixed(2)} USD</p>
                                            </div>
                                        )}

                                        <button onClick={submitMarketOrder} className="w-full bg-green-600 hover:bg-green-700 text-white font-black py-3.5 rounded-xl shadow-lg text-sm flex justify-center items-center gap-2">
                                            <i className="fa-brands fa-whatsapp text-lg"></i> Enviar Pedido
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div id="root-container">
                    {alert && <AlertBox msg={alert.msg} type={alert.type} />}
                    {showPostOrderModal && <PostOrderModal onExit={() => { setShowPostOrderModal(false); setView('landing'); }} onNewOrder={() => setShowPostOrderModal(false)} />}
                    
                    {view === 'landing' && <Landing />}
                    {view === 'adminLogin' && <AdminLoginView />}
                    
                    {/* Flujo Unificado de Auth por Servicio */}
                    {view === 'auth_client' && <AuthHub role="client" title="Cliente" targetView="clientDash" />}
                    {view === 'auth_store' && <AuthHub role="store" title="Local / Empresa" targetView="storeDash" />}
                    {view === 'auth_driver' && <AuthHub role="driver" title="Conductor" targetView="driverDash" />}
                    {view === 'auth_mercado' && <AuthHub role="mercado" title="Mercado en Casa" targetView="mercadoDash" />}
                    
                    {view === 'clientDash' && <Dashboard role="client" title="Cliente" icon="fa-user" bg="bg-red-100" color="text-grita-red" />}
                    {view === 'storeDash' && <Dashboard role="store" title="Local" icon="fa-store" bg="bg-amber-100" color="text-amber-600" />}
                    {view === 'driverDash' && <Dashboard role="driver" title="Conductor" icon="fa-motorcycle" bg="bg-green-100" color="text-green-600" />}
                    
                    {view === 'mercadoDash' && <MercadoDashboard />}
                    
                    {view === 'adminDash' && (
                        <div className="flex flex-col h-full bg-gray-100">
                            <HeaderNav title="Panel Administrador" onBack={logout} />
                            <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">

                        </div>
                    )}

            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
