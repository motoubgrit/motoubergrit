<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Moto UBGrit</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { extend: { colors: { grita: { red: '#dc2626', black: '#000000', dark: '#111111' } } } } 
        }
    </script>
    
    <!-- Leaflet CSS y JS para mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #0b0f19; margin: 0; padding: 0; touch-action: manipulation; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; }
        ::-webkit-scrollbar { display: none; } 
        #mobile-container { width: 100%; max-width: 430px; height: 100%; max-height: 100dvh; background-color: #f9fafb; position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseLogo { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,38,38, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(220,38,38, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,38,38, 0); } }
        .animate-logo { animation: pulseLogo 2s infinite; }
        .leaflet-container { z-index: 10; font-family: 'Inter', sans-serif; }
        .custom-pin { filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5)); font-size: 30px; line-height: 30px; text-align: center; }
    </style>
</head>
<body>
    <div id="mobile-container">
        <div id="root" class="w-full h-full"></div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const TASA_USD_COP = 3000; 
        const TASA_VES_COP = 3.0;  
        const ADMIN_PHONE = "584140792843";

        // INVENTARIO COMPLETO MERCADO
        const inventory = [
            { category: "Hortalizas y Verduras", name: "Tomate", price: 4000, icon: "🍅" },
            { category: "Hortalizas y Verduras", name: "Cebolla", price: 3500, icon: "🧅" },
            { category: "Hortalizas y Verduras", name: "Ajo", price: 12000, icon: "🧄" },
            { category: "Hortalizas y Verduras", name: "Zanahoria", price: 3000, icon: "🥕" },
            { category: "Hortalizas y Verduras", name: "Pimentón", price: 5000, icon: "🫑" },
            { category: "Tubérculos y Vituallas", name: "Papa", price: 3500, icon: "🥔" },
            { category: "Tubérculos y Vituallas", name: "Yuca", price: 2000, icon: "🍠" },
            { category: "Tubérculos y Vituallas", name: "Plátano Maduro", price: 3000, icon: "🍌" },
            { category: "Frutas", name: "Lechoza", price: 2500, icon: "🍈" },
            { category: "Frutas", name: "Manzana", price: 8000, icon: "🍎" },
            { category: "Frutas", name: "Fresa", price: 8000, icon: "🍓" },
            { category: "Ramas, Hierbas y Especias", name: "Cilantro", price: 2000, icon: "🌿" },
            { category: "Ramas, Hierbas y Especias", name: "Cebollín", price: 2000, icon: "🌱" },
            { category: "Proteínas y Huevos", name: "Cartón de Huevos", price: 16000, icon: "🥚" }
        ];
        
        const categoriesList = ["Hortalizas y Verduras", "Tubérculos y Vituallas", "Frutas", "Ramas, Hierbas y Especias", "Proteínas y Huevos"];
        
        const categoryStyles = {
            "Hortalizas y Verduras": { bg: "bg-green-600", text: "text-green-700", lightBg: "bg-green-50", border: "border-green-500" },
            "Tubérculos y Vituallas": { bg: "bg-amber-600", text: "text-amber-700", lightBg: "bg-amber-50", border: "border-amber-500" },
            "Frutas": { bg: "bg-orange-500", text: "text-orange-700", lightBg: "bg-orange-50", border: "border-orange-500" },
            "Ramas, Hierbas y Especias": { bg: "bg-teal-600", text: "text-teal-700", lightBg: "bg-teal-50", border: "border-teal-500" },
            "Proteínas y Huevos": { bg: "bg-red-500", text: "text-red-700", lightBg: "bg-red-50", border: "border-red-500" }
        };

        const formatQuantity = (qty, itemName = "") => {
            const isEgg = itemName.toLowerCase().includes("huevo");
            if (qty === 0.25) return isEgg ? "1/4 Cartón" : "250g";
            if (qty === 0.5) return isEgg ? "Medio Cartón" : "Medio Kg";
            if (qty === 0.75) return isEgg ? "3/4 Cartón" : "750g";
            if (qty === 1) return isEgg ? "1 Cartón" : "1 Kg";
            return `${qty} ${isEgg ? 'Cartones' : 'Kg'}`;
        };

        // --- COMPONENTES BASE ---
        const HeaderNav = ({ title, onBack, rightContent, bgClass = "bg-black" }) => (
            <div className={`${bgClass} text-white p-4 sticky top-0 z-20 flex items-center justify-between shadow-md shrink-0 w-full h-16`}>
                {onBack ? (
                    <button onClick={onBack} className="text-xs font-bold bg-white/20 px-3 py-2 rounded-lg hover:bg-white/30 transition">
                        <i className="fa-solid fa-arrow-left"></i> Volver
                    </button>
                ) : <div className="w-16"></div>}
                <h2 className="text-sm font-black truncate flex-1 text-center">{title}</h2>
                <div className="w-16 flex justify-end">{rightContent}</div>
            </div>
        );

        const MercadoDashboard = ({ user, goBack, triggerToast }) => {
            const [view, setView] = useState('shop');
            const [cart, setCart] = useState({});
            const [currentCatIdx, setCurrentCatIdx] = useState(0);
            const [paymentCurrency, setPaymentCurrency] = useState('COP');
            const [deliveryFee, setDeliveryFee] = useState(5000); // Fijo en La Grita por defecto

            const updateCart = (name, qty, price) => {
                const cleanQty = Math.max(0, Math.round(qty * 100) / 100);
                setCart(prev => { const n = { ...prev }; if (cleanQty <= 0) delete n[name]; else n[name] = { quantity: cleanQty, price }; return n; });
            };

            const cartSubtotal = Object.values(cart).reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalCOP = cartSubtotal > 0 ? cartSubtotal + deliveryFee : 0;
            const totalUSD = (totalCOP / TASA_USD_COP).toFixed(2);
            const totalVES = (totalCOP / TASA_VES_COP).toFixed(2);
            
            const currentCatName = categoriesList[currentCatIdx];
            const products = inventory.filter(p => p.category === currentCatName);

            const handleWhatsAppCheckout = () => {
                let msg = `*🛒 MERCADO EN CASA 🛒*%0A%0A*Cliente:* ${user?.nombre}%0A*Tel:* ${user?.telefono}%0A*Dir:* ${user?.direccion}%0A%0A*PEDIDO:*%0A`;
                Object.keys(cart).forEach(name => { msg += `▪ ${formatQuantity(cart[name].quantity, name)} de ${name} - ${(cart[name].price * cart[name].quantity).toLocaleString()} COP%0A`; });
                msg += `🛵 *Delivery:* ${deliveryFee.toLocaleString()} COP%0A💵 *TOTAL:* ${totalCOP.toLocaleString()} COP%0A`;
                
                msg += `%0A*MÉTODO DE PAGO SELECCIONADO:*%0A`;
                if (paymentCurrency === 'COP') msg += `🇨🇴 Pesos (Efectivo): ${totalCOP.toLocaleString()} COP`;
                if (paymentCurrency === 'USD') msg += `💵 Dólares (Efectivo): $${totalUSD} USD`;
                if (paymentCurrency === 'VES') msg += `🇻🇪 Bolívares (Transferencia): ${totalVES} VES`;
                
                window.open(`https://wa.me/${ADMIN_PHONE}?text=${msg}`, '_blank');
                setCart({}); setView('success');
            };

            if (view === 'shop') {
                return (
                    <div className="flex flex-col h-full bg-gray-100 fade-in w-full relative">
                        <HeaderNav title="Mercado en Casa" onBack={goBack} bgClass="bg-green-700" rightContent={<button onClick={() => setView('cart')} className="bg-white text-green-700 px-3 py-1.5 rounded-full font-bold text-xs shadow">🛒 {Object.keys(cart).length}</button>} />
                        
                        <div className={`p-3 border-b-4 flex items-center justify-between shadow-sm shrink-0 ${categoryStyles[currentCatName].lightBg} ${categoryStyles[currentCatName].border}`}>
                            <button onClick={() => setCurrentCatIdx(Math.max(0, currentCatIdx - 1))} disabled={currentCatIdx === 0} className="text-xs font-bold text-gray-600 bg-white px-3 py-2 rounded shadow disabled:opacity-50">← Ant</button>
                            <h2 className={`text-sm font-black ${categoryStyles[currentCatName].text}`}>{currentCatName}</h2>
                            <button onClick={() => setCurrentCatIdx(Math.min(categoriesList.length - 1, currentCatIdx + 1))} disabled={currentCatIdx === categoriesList.length - 1} className="text-xs font-bold text-gray-600 bg-white px-3 py-2 rounded shadow disabled:opacity-50">Sig →</button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 pb-24">
                            <div className="grid grid-cols-2 gap-3">
                                {products.map(p => {
                                    const qty = cart[p.name]?.quantity || 0;
                                    const style = categoryStyles[currentCatName];
                                    return (
                                        <div key={p.name} className="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center">
                                            <div className="text-4xl mb-2">{p.icon}</div>
                                            <h3 className="font-bold text-xs text-center text-gray-800">{p.name}</h3>
                                            <p className={`${style.text} font-black text-xs my-2`}>{p.price.toLocaleString()} COP</p>
                                            {qty === 0 ? (
                                                <button onClick={() => { updateCart(p.name, 0.25, p.price); triggerToast(`${p.name} agregado`, 'success'); }} className={`w-full ${style.lightBg} ${style.text} py-2 rounded-lg text-xs font-bold`}>➕ Agregar</button>
                                            ) : (
                                                <div className="flex justify-between items-center w-full bg-gray-50 rounded-lg p-1 border">
                                                    <button onClick={() => updateCart(p.name, qty - 0.25, p.price)} className="px-2 py-1 bg-white text-red-500 rounded font-bold shadow-sm">-</button>
                                                    <span className="font-bold text-[10px]">{formatQuantity(qty, p.name)}</span>
                                                    <button onClick={() => updateCart(p.name, qty + 0.25, p.price)} className={`px-2 py-1 bg-white ${style.text} rounded font-bold shadow-sm`}>+</button>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            
                            {currentCatIdx < categoriesList.length - 1 ? (
                                <button onClick={() => { document.querySelector('.overflow-y-auto').scrollTo(0,0); setCurrentCatIdx(currentCatIdx + 1); }} className="w-full mt-6 bg-white border-2 border-green-500 text-green-700 py-3 rounded-xl font-bold shadow-sm">
                                    Siguiente: {categoriesList[currentCatIdx + 1]} ↓
                                </button>
                            ) : (
                                <button onClick={() => setView('cart')} className="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg">Ir al Carrito 🛒</button>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'cart') {
                return (
                    <div className="flex flex-col h-full bg-gray-100 fade-in w-full">
                        <HeaderNav title="Tu Carrito" onBack={() => setView('shop')} bgClass="bg-green-700" />
                        <div className="flex-1 overflow-y-auto p-4 pb-6">
                            <div className="bg-white rounded-2xl shadow-sm p-4 mb-4">
                                {Object.keys(cart).length === 0 ? <p className="text-center text-gray-500 text-sm py-4">El carrito está vacío</p> : null}
                                {Object.keys(cart).map(name => (
                                    <div key={name} className="flex justify-between items-center py-2 border-b border-gray-100 text-xs">
                                        <span>{formatQuantity(cart[name].quantity, name)} {name}</span>
                                        <span className="font-bold">{(cart[name].price * cart[name].quantity).toLocaleString()} COP</span>
                                    </div>
                                ))}
                                <div className="flex justify-between items-center py-3 text-xs text-orange-600 font-bold border-b border-gray-100">
                                    <span>Delivery Básico (Casco Central)</span>
                                    <span>+{deliveryFee.toLocaleString()} COP</span>
                                </div>
                                <div className="flex justify-between py-3 text-lg text-green-700 font-black"><span>TOTAL COP</span><span>{totalCOP.toLocaleString()} COP</span></div>
                            </div>

                            <div className="bg-white p-4 rounded-2xl shadow-sm mb-6">
                                <h3 className="font-bold text-xs text-center text-gray-500 mb-3">Moneda de Pago</h3>
                                <div className="grid grid-cols-3 gap-2 mb-4">
                                    <button onClick={() => setPaymentCurrency('COP')} className={`py-3 rounded-lg font-bold text-xs border-2 ${paymentCurrency === 'COP' ? 'bg-green-100 border-green-500 text-green-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>COP</button>
                                    <button onClick={() => setPaymentCurrency('VES')} className={`py-3 rounded-lg font-bold text-xs border-2 ${paymentCurrency === 'VES' ? 'bg-blue-100 border-blue-500 text-blue-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>VES</button>
                                    <button onClick={() => setPaymentCurrency('USD')} className={`py-3 rounded-lg font-bold text-xs border-2 ${paymentCurrency === 'USD' ? 'bg-emerald-100 border-emerald-500 text-emerald-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>USD</button>
                                </div>
                                
                                <div className="p-4 bg-gray-50 rounded-xl text-center border border-gray-200">
                                    <p className="text-[10px] uppercase font-bold text-gray-500 mb-1">Monto Exacto a Pagar</p>
                                    {paymentCurrency === 'COP' && <p className="font-black text-green-700 text-2xl">{totalCOP.toLocaleString()} COP</p>}
                                    {paymentCurrency === 'VES' && <p className="font-black text-blue-700 text-2xl">{totalVES} VES <span className="text-[10px] block font-normal text-gray-500 mt-1">(Tasa: {TASA_VES_COP})</span></p>}
                                    {paymentCurrency === 'USD' && <p className="font-black text-emerald-700 text-2xl">${totalUSD} USD <span className="text-[10px] block font-normal text-gray-500 mt-1">(Tasa: {TASA_USD_COP})</span></p>}
                                </div>
                            </div>

                            <button onClick={handleWhatsAppCheckout} disabled={totalCOP === 0} className="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 disabled:opacity-50">
                                <i className="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido y Facturar
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'success') {
                return (
                    <div className="flex flex-col h-full bg-green-50 fade-in w-full items-center justify-center p-6 text-center">
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border-t-8 border-green-600">
                            <div className="text-6xl mb-4">✅</div>
                            <h2 className="text-2xl font-black text-green-800 mb-2">¡Pedido Enviado!</h2>
                            <p className="text-gray-600 mb-8 text-sm font-medium">El cajero ha recibido tu orden y se coordinará el envío a tu dirección de inmediato.</p>
                            <div className="space-y-3">
                                <button onClick={() => setView('shop')} className="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold shadow-md">🛒 Hacer otro pedido</button>
                                <button onClick={goBack} className="w-full border-2 border-gray-200 text-gray-700 py-3.5 rounded-xl font-bold bg-gray-50">🏠 Volver al Menú Principal</button>
                            </div>
                        </div>
                    </div>
                );
            }
        };

        const TripPlanner = ({ user, type, onBack, triggerToast }) => {
            const mapRef = useRef(null);
            const mapInst = useRef(null);
            const routeLayer = useRef(null);
            const markers = useRef([]);

            const [view, setView] = useState('planner'); 
            const [originText, setOriginText] = useState('');
            const [destText, setDestText] = useState('');
            const [originCoords, setOriginCoords] = useState(null);
            const [destCoords, setDestCoords] = useState(null);
            
            const [priceCOP, setPriceCOP] = useState(0);
            const [isSearching, setIsSearching] = useState(false);
            
            // Campos de encomienda
            const [encDetails, setEncDetails] = useState({ queLleva: '', recibe: '', telRecibe: '' });

            // Inicializar Mapa CON GOOGLE MAPS (Solución definitiva al error 403)
            useEffect(() => {
                if (mapRef.current && !mapInst.current && view === 'planner') {
                    mapInst.current = L.map(mapRef.current, { zoomControl: false }).setView([8.1333, -71.9833], 15);
                    
                    // AQUI ESTA LA MAGIA: Mapas de Google directamente para evitar bloqueos
                    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                        maxZoom: 19, attribution: '© Google Maps'
                    }).addTo(mapInst.current);
                }
            }, [view]);

            const geocodeAddress = async (text, isOrigin) => {
                if (!text) return triggerToast("Escribe una referencia primero", "error");
                setIsSearching(true);
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(text + ', La Grita, Táchira')}`);
                    const data = await res.json();
                    if (data && data.length > 0) {
                        const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                        if (isOrigin) { setOriginCoords(coords); triggerToast("Origen fijado 📍", "success"); }
                        else { setDestCoords(coords); triggerToast("Destino fijado 🏁", "success"); }
                        
                        mapInst.current.setView(coords, 16);
                        
                        const iconHtml = isOrigin ? '🟢' : '🔴';
                        const marker = L.marker(coords, {
                            icon: L.divIcon({ className: 'custom-pin', html: iconHtml, iconSize: [30,30], iconAnchor: [15,30] })
                        }).addTo(mapInst.current);
                        markers.current.push(marker);

                        if (isOrigin && destCoords) calculateRoute(coords, destCoords);
                        else if (!isOrigin && originCoords) calculateRoute(originCoords, coords);
                    } else {
                        triggerToast("Lugar no encontrado. Sé más específico.", "error");
                    }
                } catch (e) { triggerToast("Error de red", "error"); }
                setIsSearching(false);
            };

            const calculateRoute = async (c1, c2) => {
                try {
                    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${c1[1]},${c1[0]};${c2[1]},${c2[0]}?overview=full&geometries=geojson`);
                    const data = await res.json();
                    
                    if (data.routes && data.routes.length > 0) {
                        if (routeLayer.current) mapInst.current.removeLayer(routeLayer.current);
                        
                        const geojson = data.routes[0].geometry;
                        routeLayer.current = L.geoJSON(geojson, { style: { color: '#2563eb', weight: 5, opacity: 0.9 } }).addTo(mapInst.current);
                        mapInst.current.fitBounds(routeLayer.current.getBounds(), { padding: [40, 40] });

                        const dist = data.routes[0].distance;
                        
                        let p = 5000;
                        if (dist > 2000) {
                            const extraKm = Math.ceil((dist - 2000) / 1000);
                            p += (extraKm * 1500);
                        }
                        setPriceCOP(p);
                    }
                } catch(e) { console.log(e); }
            };

            const confirmRide = () => {
                if (!originCoords || !destCoords) return triggerToast("Busca Origen y Destino en el mapa para calcular", "error");
                if (type === 'encomienda') setView('details'); 
                else submitToSystem(); 
            };

            const submitToSystem = () => {
                const isEnc = type === 'encomienda';
                const totalVES = (priceCOP / TASA_VES_COP).toFixed(2);
                const totalUSD = (priceCOP / TASA_USD_COP).toFixed(2);
                
                const gMapsOrg = `https://www.google.com/maps?q=${originCoords[0]},${originCoords[1]}`;
                const gMapsDst = `https://www.google.com/maps?q=${destCoords[0]},${destCoords[1]}`;

                // Simular envío a Firebase para el Chofer
                const tripData = {
                    id: Date.now(),
                    cliente: user.nombre,
                    telefono: user.telefono,
                    origen: originText,
                    destino: destText,
                    precio: priceCOP,
                    tipo: isEnc ? 'Encomienda' : 'Pasajero',
                    detalles: isEnc ? encDetails : null,
                    coords: { o: originCoords, d: destCoords },
                    fecha: new Date().toLocaleString()
                };

                let pending = JSON.parse(localStorage.getItem('ubgrit_pending_trips') || '[]');
                pending.push(tripData);
                localStorage.setItem('ubgrit_pending_trips', JSON.stringify(pending));

                let msg = `*🚀 NUEVA SOLICITUD DE ${isEnc ? 'ENCOMIENDA' : 'MOTO'} 🚀*%0A%0A`;
                msg += `*Cliente/Local:* ${user.nombre}%0A*Teléfono:* ${user.telefono}%0A%0A`;
                msg += `📍 *De:* ${originText}%0A🏁 *Para:* ${destText}%0A`;
                if (isEnc) {
                    msg += `%0A📦 *Lleva:* ${encDetails.queLleva}%0A👤 *Recibe:* ${encDetails.recibe} (${encDetails.telRecibe})%0A`;
                }
                msg += `%0A💵 *Costo Traslado:*%0A▪ ${priceCOP.toLocaleString()} COP%0A▪ ${totalVES} VES%0A▪ $${totalUSD} USD%0A`;
                msg += `%0A🗺️ *GPS Origen:* ${gMapsOrg}%0A🗺️ *GPS Destino:* ${gMapsDst}`;

                window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
                setView('success');
            };

            if (view === 'planner') {
                return (
                    <div className="flex flex-col h-full bg-gray-100 fade-in w-full relative">
                        <HeaderNav title={type === 'encomienda' ? 'Ruta Encomienda' : 'Pedir Moto'} onBack={onBack} bgClass="bg-blue-600" />
                        
                        <div className="absolute top-20 left-4 right-4 z-[400] space-y-3">
                            <div className="flex bg-white rounded-xl shadow-lg border-2 border-gray-200 overflow-hidden">
                                <span className="p-3 bg-gray-50 text-green-500 font-black"><i className="fa-solid fa-circle-dot"></i></span>
                                <input placeholder="¿Dónde estás? Ej: Plaza Bolívar" value={originText} onChange={e => setOriginText(e.target.value)} className="flex-1 p-3 text-sm outline-none font-medium text-gray-800" />
                                <button onClick={() => geocodeAddress(originText, true)} disabled={isSearching} className="bg-blue-600 text-white px-4 font-bold text-xs hover:bg-blue-700">Buscar</button>
                            </div>
                            
                            <div className="flex bg-white rounded-xl shadow-lg border-2 border-gray-200 overflow-hidden">
                                <span className="p-3 bg-gray-50 text-red-500 font-black"><i className="fa-solid fa-location-dot"></i></span>
                                <input placeholder="¿A dónde vas?" value={destText} onChange={e => setDestText(e.target.value)} className="flex-1 p-3 text-sm outline-none font-medium text-gray-800" />
                                <button onClick={() => geocodeAddress(destText, false)} disabled={isSearching} className="bg-blue-600 text-white px-4 font-bold text-xs hover:bg-blue-700">Buscar</button>
                            </div>
                        </div>

                        <div className="flex-1 relative z-0 bg-gray-200">
                            <div ref={mapRef} className="absolute inset-0 w-full h-full"></div>
                        </div>

                        <div className="bg-white p-6 shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-[400] shrink-0 rounded-t-3xl">
                            {priceCOP > 0 ? (
                                <div className="mb-4 text-center">
                                    <p className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Costo Estimado Traslado</p>
                                    <h3 className="text-3xl font-black text-green-600">{priceCOP.toLocaleString()} COP</h3>
                                    <div className="flex justify-center gap-4 mt-2 text-xs font-bold text-gray-600">
                                        <span>{(priceCOP / TASA_VES_COP).toFixed(2)} VES</span>
                                        <span>|</span>
                                        <span>${(priceCOP / TASA_USD_COP).toFixed(2)} USD</span>
                                    </div>
                                </div>
                            ) : (
                                <p className="text-center text-xs font-bold text-gray-500 mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">Busca origen y destino para ver el precio.</p>
                            )}
                            <button onClick={confirmRide} className="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg">
                                {type === 'encomienda' ? 'Datos de Encomienda →' : 'Pedir Moto Ahora'}
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'details') {
                return (
                    <div className="flex flex-col h-full bg-gray-50 fade-in w-full">
                        <HeaderNav title="Datos de Encomienda" onBack={() => setView('planner')} bgClass="bg-blue-600" />
                        <div className="flex-1 p-5 overflow-y-auto">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                                <div className="bg-blue-50 p-3 rounded-lg text-xs font-bold text-blue-800 text-center mb-2">Tarifa Traslado: {priceCOP.toLocaleString()} COP.<br/>(El producto se cobra aparte)</div>
                                
                                <div><label className="block text-xs font-black text-gray-500 uppercase mb-1">¿Qué se envía?</label>
                                <input placeholder="Ej: Zapatos, Comida" value={encDetails.queLleva} onChange={e=>setEncDetails({...encDetails, queLleva: e.target.value})} className="w-full p-3 rounded-xl bg-gray-50 border-2 border-gray-200 outline-none" /></div>
                                
                                <div><label className="block text-xs font-black text-gray-500 uppercase mb-1 mt-2">Quién Recibe</label>
                                <input placeholder="Nombre y Apellido" value={encDetails.recibe} onChange={e=>setEncDetails({...encDetails, recibe: e.target.value})} className="w-full p-3 rounded-xl bg-gray-50 border-2 border-gray-200 outline-none" /></div>
                                
                                <div><label className="block text-xs font-black text-gray-500 uppercase mb-1 mt-2">Teléfono destino</label>
                                <input placeholder="Ej: 04141234567" type="tel" value={encDetails.telRecibe} onChange={e=>setEncDetails({...encDetails, telRecibe: e.target.value})} className="w-full p-3 rounded-xl bg-gray-50 border-2 border-gray-200 outline-none" /></div>
                                
                                <button onClick={submitToSystem} className="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg mt-6">Confirmar Envío</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'success') {
                return (
                    <div className="flex flex-col h-full bg-blue-50 fade-in w-full items-center justify-center p-6 text-center">
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full border-t-8 border-blue-600">
                            <div className="text-6xl mb-4">🏍️</div>
                            <h2 className="text-2xl font-black text-blue-800 mb-2">¡Solicitud Enviada!</h2>
                            <p className="text-gray-600 mb-8 text-sm font-medium">Un chofer recibirá la alerta en su pantalla y pasará por ti.</p>
                            <div className="space-y-3">
                                <button onClick={() => { setView('planner'); setOriginText(''); setDestText(''); setPriceCOP(0); setOriginCoords(null); setDestCoords(null); }} className="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold shadow-md">📍 Pedir otro viaje</button>
                                <button onClick={onBack} className="w-full border-2 border-gray-200 text-gray-700 py-3.5 rounded-xl font-bold bg-gray-50">🏠 Volver al Menú</button>
                            </div>
                        </div>
                    </div>
                );
            }
        };

        const DriverDashboard = ({ user, goBack, triggerToast }) => {
            const [activeTrip, setActiveTrip] = useState(null);
            const [history, setHistory] = useState([]);
            const [pendingTrip, setPendingTrip] = useState(null);
            const [view, setView] = useState('dash'); 

            useEffect(() => {
                const storedHistory = JSON.parse(localStorage.getItem(`ubgrit_history_${user.nombre}`) || '[]');
                const storedActive = JSON.parse(localStorage.getItem(`ubgrit_active_${user.nombre}`) || 'null');
                setHistory(storedHistory);
                setActiveTrip(storedActive);

                const pollTimer = setInterval(() => {
                    const pendings = JSON.parse(localStorage.getItem('ubgrit_pending_trips') || '[]');
                    if (pendings.length > 0 && !storedActive && !activeTrip) {
                        setPendingTrip(pendings[0]); 
                    } else {
                        setPendingTrip(null);
                    }
                }, 3000);
                return () => clearInterval(pollTimer);
            }, [activeTrip]);

            const acceptTrip = () => {
                if (!pendingTrip) return;
                let pendings = JSON.parse(localStorage.getItem('ubgrit_pending_trips') || '[]');
                pendings = pendings.filter(t => t.id !== pendingTrip.id);
                localStorage.setItem('ubgrit_pending_trips', JSON.stringify(pendings));

                setActiveTrip(pendingTrip);
                localStorage.setItem(`ubgrit_active_${user.nombre}`, JSON.stringify(pendingTrip));
                setPendingTrip(null);
                triggerToast("¡Viaje Aceptado! Se guardó en tu pantalla.", "success");
            };

            const finishTrip = () => {
                if (!activeTrip) return;
                const updatedHistory = [activeTrip, ...history];
                setHistory(updatedHistory);
                localStorage.setItem(`ubgrit_history_${user.nombre}`, JSON.stringify(updatedHistory));
                
                setActiveTrip(null);
                localStorage.removeItem(`ubgrit_active_${user.nombre}`);
                triggerToast("Viaje completado y guardado en Billetera.", "success");
            };

            const totalGenerado = history.reduce((sum, t) => sum + t.precio, 0);
            const totalDeuda = totalGenerado * 0.10; 

            if (view === 'history') {
                return (
                    <div className="flex flex-col h-full bg-gray-100 w-full fade-in">
                        <HeaderNav title="Mi Billetera" onBack={() => setView('dash')} bgClass="bg-black" />
                        <div className="p-5 flex-1 overflow-y-auto">
                            <div className="bg-black p-5 rounded-2xl text-white shadow-lg mb-6">
                                <p className="text-[10px] uppercase font-bold text-gray-400 mb-1">Total Generado (Ventas)</p>
                                <h3 className="text-3xl font-black text-green-400 mb-4">{totalGenerado.toLocaleString()} COP</h3>
                                <div className="bg-red-500/20 border border-red-500/50 p-3 rounded-xl">
                                    <p className="text-[10px] uppercase font-bold text-red-300">Deuda Admin (10%)</p>
                                    <p className="text-xl font-black text-red-400">{totalDeuda.toLocaleString()} COP</p>
                                </div>
                            </div>
                            <h3 className="font-bold text-gray-800 mb-3 text-sm">Viajes Completados</h3>
                            <div className="space-y-3">
                                {history.map(t => (
                                    <div key={t.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                        <div className="flex justify-between border-b pb-2 mb-2">
                                            <span className="font-bold text-xs">{t.tipo}</span>
                                            <span className="font-black text-green-700 text-xs">{t.precio.toLocaleString()} COP</span>
                                        </div>
                                        <p className="text-[10px] text-gray-500 truncate">De: {t.origen}</p>
                                        <p className="text-[10px] text-gray-500 truncate">A: {t.destino}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full bg-gray-100 w-full fade-in relative">
                    <div className="bg-black text-white p-4 sticky top-0 z-20 flex justify-between items-center shadow-md">
                        <div><h1 className="font-black text-lg leading-none">Chofer</h1><p className="text-[9px] text-gray-400 font-bold uppercase">{user.nombre}</p></div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setView('history')} className="text-xs bg-gray-800 px-3 py-1.5 rounded-lg font-bold border border-gray-700">💰 Billetera</button>
                            <button onClick={goBack} className="text-red-400 text-xl"><i className="fa-solid fa-power-off"></i></button>
                        </div>
                    </div>

                    <div className="p-4 flex-1 overflow-y-auto">
                        {activeTrip ? (
                            <div className="bg-white rounded-3xl shadow-xl overflow-hidden border-2 border-blue-500 mb-6">
                                <div className="bg-blue-600 p-3 text-white text-center font-black text-sm uppercase">Viaje Activo</div>
                                <div className="p-4 space-y-3 text-sm">
                                    <p className="font-bold text-gray-800">👤 {activeTrip.cliente} <a href={`tel:${activeTrip.telefono}`} className="text-blue-500 ml-2 underline">Llamar</a></p>
                                    <div className="bg-gray-50 p-3 rounded-xl border border-gray-200">
                                        <p className="font-bold text-gray-700 text-xs mb-2">📍 Origen: {activeTrip.origen}</p>
                                        <p className="font-bold text-gray-700 text-xs">🏁 Destino: {activeTrip.destino}</p>
                                    </div>
                                    {activeTrip.tipo === 'Encomienda' && (
                                        <div className="bg-orange-50 border border-orange-200 p-3 rounded-xl">
                                            <p className="font-black text-orange-800 text-xs mb-1">📦 Encomienda</p>
                                            <p className="text-xs text-gray-700">Lleva: {activeTrip.detalles.queLleva}</p>
                                            <p className="text-xs text-gray-700">Recibe: {activeTrip.detalles.recibe} ({activeTrip.detalles.telRecibe})</p>
                                        </div>
                                    )}
                                    <div className="text-center bg-green-50 p-3 rounded-xl border border-green-200">
                                        <p className="text-[10px] font-black text-gray-400 uppercase">Cobrar</p>
                                        <p className="text-2xl font-black text-green-700">{activeTrip.precio.toLocaleString()} COP</p>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => window.open(`https://www.google.com/maps?q=${activeTrip.coords.o[0]},${activeTrip.coords.o[1]}`, '_blank')} className="bg-gray-800 text-white py-3 rounded-xl font-bold text-xs"><i className="fa-solid fa-location-arrow"></i> Navegar Origen</button>
                                        <button onClick={() => window.open(`https://www.google.com/maps?q=${activeTrip.coords.d[0]},${activeTrip.coords.d[1]}`, '_blank')} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-xs"><i className="fa-solid fa-flag-checkered"></i> Navegar Destino</button>
                                    </div>
                                    <button onClick={finishTrip} className="w-full bg-green-500 text-white py-4 rounded-xl font-black mt-2">✅ Finalizar y Guardar Viaje</button>
                                </div>
                            </div>
                        ) : pendingTrip ? (
                            <div className="bg-yellow-400 rounded-3xl shadow-xl p-6 text-center animate-pulse border-4 border-white">
                                <h3 className="font-black text-xl mb-4 text-black">NUEVO VIAJE</h3>
                                <div className="bg-white p-4 rounded-xl text-left text-xs mb-4 font-medium">
                                    <p><strong>De:</strong> {pendingTrip.origen}</p>
                                    <p><strong>Para:</strong> {pendingTrip.destino}</p>
                                    <p className="font-black text-green-600 text-lg mt-2 text-center border-t pt-2">{pendingTrip.precio.toLocaleString()} COP</p>
                                </div>
                                <button onClick={acceptTrip} className="w-full bg-black text-white py-4 rounded-xl font-black text-lg shadow-lg">Aceptar (60s)</button>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-64 opacity-50">
                                <i className="fa-solid fa-satellite-dish text-5xl mb-4"></i>
                                <p className="font-bold text-gray-500 text-center">Buscando viajes...<br/>Mantén la app abierta.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('splash');
            const [user, setUser] = useState(null);
            const [authRole, setAuthRole] = useState(''); 
            const [formData, setFormData] = useState({});
            const [toast, setToast] = useState(null);

            useEffect(() => {
                const savedUser = localStorage.getItem('motoubgrit_user');
                if (savedUser) setUser(JSON.parse(savedUser));
                setTimeout(() => { if (view === 'splash') setView('menu'); }, 3000);
            }, []);

            // Corrección al error de registro (handleInputChange)
            const handleInputChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
            
            const triggerToast = (message, type = 'info') => {
                setToast({ message, type }); setTimeout(() => setToast(null), 3500);
            };

            const handleRegister = (e) => {
                e.preventDefault();
                const finalUser = { ...formData, role: authRole, createdAt: new Date().getTime(), email: formData.email || `user_${Date.now()}` };
                setUser(finalUser); localStorage.setItem('motoubgrit_user', JSON.stringify(finalUser));
                
                if (authRole === 'driver') setView('driver_rules');
                else if (authRole === 'market') setView('market_view');
                else if (authRole === 'store') setView('encomienda_view');
                else setView('client_view');
            };

            const ToastComponent = () => {
                if (!toast) return null;
                const bg = toast.type === 'error' ? 'bg-red-600' : toast.type === 'success' ? 'bg-green-600' : 'bg-gray-800';
                return (
                    <div className="absolute top-4 left-1/2 transform -translate-x-1/2 z-[999] w-11/12 max-w-sm fade-in pointer-events-none">
                        <div className={`${bg} text-white px-4 py-3 rounded-xl shadow-2xl font-bold text-xs text-center border-2 border-white/20`}>{toast.message}</div>
                    </div>
                );
            };

            if (view === 'splash') {
                return (
                    <div className="flex flex-col items-center justify-center h-full bg-[#0b0f19] fade-in w-full relative overflow-hidden">
                        {/* Efecto de luz de fondo */}
                        <div className="absolute inset-0 flex items-center justify-center opacity-10">
                            <div className="w-96 h-96 bg-grita-red rounded-full blur-3xl animate-pulse"></div>
                        </div>
                        
                        <div className="z-10 flex flex-col items-center">
                            <div className="w-28 h-28 bg-grita-red rounded-full flex items-center justify-center mb-6 animate-logo shadow-[0_0_30px_rgba(220,38,38,0.5)] border-4 border-white/10">
                                <i className="fa-solid fa-motorcycle text-5xl text-white"></i>
                            </div>
                            <h1 className="text-4xl font-black mb-4 text-white tracking-tight drop-shadow-lg">Moto UBGrit</h1>
                            
                            <div className="bg-black/50 backdrop-blur-md p-5 rounded-2xl border border-white/10 mx-6 shadow-2xl">
                                <p className="text-[10px] font-black text-gray-300 uppercase tracking-[0.15em] text-center leading-relaxed">
                                    Tu traslado / Encomienda /<br/>Mercado / Medicamento
                                    <span className="text-grita-red mt-2 block text-xs tracking-widest font-black drop-shadow-md">RÁPIDO Y SEGURO</span>
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'menu') {
                return (
                    <div className="flex flex-col h-full bg-[#0b0f19] fade-in w-full relative">
                        <ToastComponent />
                        <div className="flex-grow flex flex-col items-center justify-center p-6 text-center">
                            <div className="w-20 h-20 bg-grita-red rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(220,38,38,0.5)] border-2 border-white/20 animate-logo"><i className="fa-solid fa-motorcycle text-3xl text-white"></i></div>
                            <h1 className="text-3xl font-black mb-1 text-white tracking-tight">Moto UBGrit</h1>
                            <p className="text-[10px] text-gray-300 font-bold mb-6 tracking-widest uppercase leading-relaxed text-center">
                                Tu Traslado / Encomienda / Mercado / Medicamento<br/>
                                <span className="text-grita-red text-xs mt-1 block drop-shadow-md">Rápido y Seguro</span>
                            </p>
                            
                            <div className="space-y-3 w-full">
                                <button onClick={() => { setAuthRole('client'); setView(user?.role==='client'?'client_view':'auth'); }} className="w-full bg-white text-black font-black py-4 rounded-2xl shadow-md text-xs hover:scale-[1.02] transition flex justify-center items-center gap-2"><i className="fa-solid fa-user"></i> Soy Cliente</button>
                                <button onClick={() => { setAuthRole('store'); setView(user?.role==='store'?'encomienda_view':'auth'); }} className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-md text-xs hover:scale-[1.02] transition flex justify-center items-center gap-2"><i className="fa-solid fa-box"></i> Local (Encomiendas)</button>
                                <button onClick={() => { setAuthRole('market'); setView(user?.role==='market'?'market_view':'auth'); }} className="w-full bg-green-600 text-white font-bold py-4 rounded-2xl shadow-md text-xs hover:scale-[1.02] transition flex justify-center items-center gap-2"><i className="fa-solid fa-basket-shopping"></i> Mercado en Casa</button>
                                
                                <button onClick={() => { triggerToast('Módulo de Farmacia en desarrollo.', 'info'); }} className="w-full bg-purple-600 text-white font-bold py-4 rounded-2xl shadow-md text-xs hover:bg-purple-500 transition flex justify-center items-center gap-2"><i className="fa-solid fa-notes-medical"></i> Farmacia (Próximamente)</button>
                                
                                <button onClick={() => { setAuthRole('driver'); setView(user?.role==='driver'?'driver_dashboard':'auth'); }} className="w-full bg-[#1a1a1a] border border-gray-800 text-gray-300 py-4 rounded-2xl font-bold mt-6 text-xs transition flex justify-center items-center gap-2"><i className="fa-solid fa-motorcycle"></i> Panel Conductor</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'auth') {
                return (
                    <div className="flex flex-col h-full bg-[#0b0f19] fade-in w-full">
                        <HeaderNav title="Registro" onBack={() => setView('menu')} />
                        <div className="flex-1 p-6 flex flex-col justify-center overflow-y-auto">
                            <form onSubmit={handleRegister} className="bg-white p-6 rounded-3xl shadow-xl space-y-4">
                                <h3 className="font-black text-center text-xl text-black mb-4">{authRole === 'store' ? 'Datos del Local' : 'Tus Datos'}</h3>
                                <input required name="email" type="email" placeholder="Correo electrónico" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 text-sm outline-none" />
                                <input required name="password" type="password" placeholder="Contraseña" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 text-sm outline-none" />
                                <input required name="nombre" placeholder={authRole === 'store' ? "Nombre del Local" : "Nombre completo"} onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 text-sm outline-none" />
                                <input required name="telefono" type="tel" placeholder="WhatsApp" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 text-sm outline-none" />
                                
                                {authRole === 'driver' && (
                                    <div className="p-4 bg-gray-50 rounded-2xl border border-gray-200 space-y-3">
                                        <p className="text-[10px] font-black text-gray-500 uppercase text-center">Vehículo</p>
                                        <input required name="placa" placeholder="Placa de la Moto" onChange={handleInputChange} className="w-full p-3 border-b border-gray-300 bg-transparent text-sm outline-none" />
                                        <input required name="modelo" placeholder="Modelo y Año" onChange={handleInputChange} className="w-full p-3 border-b border-gray-300 bg-transparent text-sm outline-none" />
                                    </div>
                                )}
                                <textarea required name="direccion" placeholder="Dirección exacta" onChange={handleInputChange} className="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 text-sm outline-none h-24" />
                                
                                <button type="submit" className="w-full bg-grita-red text-white py-4 rounded-2xl font-black shadow-lg text-lg mt-4">Completar Registro</button>
                                
                                <button type="button" onClick={() => setView('menu')} className="w-full text-center text-gray-500 font-bold text-sm mt-3 py-2 underline">
                                    ← Cancelar y Volver
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (view === 'driver_rules') {
                return (
                    <div className="flex flex-col h-full bg-[#0b0f19] fade-in w-full items-center justify-center p-6">
                        <div className="bg-white p-6 rounded-3xl shadow-2xl w-full border-t-8 border-yellow-400 overflow-y-auto text-center">
                            <i className="fa-solid fa-triangle-exclamation text-5xl text-yellow-500 mb-3"></i>
                            <h2 className="text-xl font-black text-black mb-4">REGLAS DEL CONDUCTOR</h2>
                            <div className="text-left font-bold text-gray-700 space-y-3 mb-6 bg-gray-50 p-5 rounded-2xl text-[11px] border border-gray-200 shadow-inner">
                                <p><span className="text-red-500">1.</span> <strong>Cobro:</strong> SOLO cobras la tarifa del traslado.</p>
                                <p><span className="text-red-500">2.</span> <strong>Seguridad:</strong> Uso obligatorio de CASCO y CESTA.</p>
                                <p><span className="text-red-500">3.</span> <strong>Tiempos:</strong> 60s para aceptar viaje asignado.</p>
                                <p><span className="text-red-500">4.</span> <strong>Pagos:</strong> Comisión del 10% mensual a la central.</p>
                            </div>
                            <button onClick={() => { window.open(`https://wa.me/${ADMIN_PHONE}?text=Me%20registré%20como%20chofer.`, '_blank'); setView('driver_dashboard'); }} className="w-full bg-green-500 text-white py-4 rounded-2xl font-black shadow-lg">
                                Unirme al Grupo y Entrar
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'client_view' || view === 'encomienda_view') {
                return <TripPlanner user={user} type={view === 'client_view' ? 'client' : 'encomienda'} onBack={() => setView('menu')} triggerToast={triggerToast} />;
            }

            if (view === 'market_view') {
                return <MercadoDashboard user={user} goBack={() => setView('menu')} triggerToast={triggerToast} />;
            }

            if (view === 'driver_dashboard') {
                return <DriverDashboard user={user} goBack={() => setView('menu')} triggerToast={triggerToast} />;
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
